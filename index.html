  .switch-track::before{ content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }

  /* ---------------- Theme-aware overrides for content surfaces (dark mode) ---------------- */

  /* GSDE v20: explicit cart delete button and two purchase actions. */
  .ci-remove{
    display:inline-flex!important;align-items:center;justify-content:center;
    margin-top:8px!important;padding:7px 12px!important;border:1.5px solid #b42318!important;
    border-radius:8px!important;background:var(--white)!important;color:#b42318!important;

    font-size:13px;padding:13px 10px;border-radius:10px;cursor:pointer;width:100%;

  /* round 14: Home banner album (approved animated design) */
  .hb-wrap{margin:12px 14px 10px;}
  .hb-banner{container-type:inline-size; aspect-ratio:11/4; max-width:100%; position:relative; overflow:hidden; background:#EFB921; border-radius:4.5cqw; --s:-1; direction:ltr;}
  .hb-banner.rtl{--s:1;}
  .hb-slide{position:absolute; inset:0; display:flex; align-items:center; gap:3cqw; padding:0 5cqw; visibility:hidden; color:#141414; cursor:pointer;}
  .hb-banner.rtl .hb-slide{flex-direction:row-reverse;}
  .hb-slide.in,.hb-slide.out{visibility:visible;}
  .hb-txt{flex:1; display:flex; flex-direction:column; gap:1.3cqw; min-width:0;}
  .hb-tag{align-self:flex-start; font-size:2.7cqw; font-weight:700; background:#141414; color:#EFB921; padding:.7cqw 2cqw; border-radius:9cqw;}
  .hb-ttl{margin:0; font-size:6.6cqw; line-height:1.05; font-weight:800;}
  .hb-sub{margin:0; font-size:2.9cqw; line-height:1.35; font-weight:600; max-width:52cqw;}
  .hb-banner.rtl .hb-txt{direction:rtl; text-align:right; align-items:flex-end;}
  .hb-banner.rtl .hb-tag{align-self:flex-end;}
  .hb-banner.rtl .hb-ttl{font-size:7cqw; font-weight:700;}
  .hb-banner.rtl .hb-sub{font-size:3.3cqw;}
  .hb-pics{flex:0 0 30cqw; height:30cqw; position:relative;}
  .hb-card{position:absolute; inset:0; border-radius:2.6cqw; overflow:hidden; background:#fff; border:.8cqw solid #141414; box-shadow:1.1cqw 1.1cqw 0 rgba(20,20,20,.85); transform:rotate(calc(var(--s)*3deg));}
  .hb-card img{width:100%; height:100%; object-fit:cover; display:block;}
  .hb-dots{position:absolute; bottom:1.8cqw; left:50%; right:auto; inset-inline-start:auto; transform:translateX(-50%); display:flex; gap:1.2cqw;}
  .hb-dots i{width:2.2cqw; height:.7cqw; background:rgba(20,20,20,.25);}
  .hb-dots i.on{background:#141414;}
  .hb-slide.in .hb-pics{animation:hbPin 1.1s cubic-bezier(.16,.9,.2,1) both;}
  .hb-slide.in .hb-tag{animation:hbTin .45s .15s cubic-bezier(.2,.8,.2,1) both;}
  .hb-slide.in .hb-ttl{animation:hbTin .7s .3s cubic-bezier(.2,.8,.2,1) both;}
  .hb-slide.in .hb-sub{animation:hbFin 1s .65s ease-out both;}
  .hb-slide.out .hb-pics{animation:hbPout .6s cubic-bezier(.6,0,.8,.3) both;}
  .hb-slide.out .hb-txt{animation:hbTout .35s ease-in both;}
  @keyframes hbPin{0%{transform:translateX(calc(var(--s)*120cqw)) rotate(calc(var(--s)*12deg))}70%{transform:translateX(calc(var(--s)*-2cqw)) rotate(calc(var(--s)*-1deg))}100%{transform:none}}
  @keyframes hbPout{to{transform:translateX(calc(var(--s)*-120cqw)) rotate(calc(var(--s)*-8deg))}}
  @keyframes hbTin{from{opacity:0;transform:translateX(calc(var(--s)*-6cqw))}to{opacity:1;transform:none}}
  @keyframes hbFin{from{opacity:0;transform:translateY(2.5cqw)}to{opacity:1;transform:none}}
  @keyframes hbTout{to{opacity:0;transform:translateY(-1.5cqw)}}
  /* round 14: information ticker under the banner */
  .info-ticker{margin:0 14px 14px; padding:10px 14px; border-radius:12px; background:var(--surface2); border:1px solid var(--line); min-height:78px; display:flex; flex-direction:column; justify-content:center; gap:4px; overflow:hidden;}

<script>
/* GSDE round40: two-finger pinch zoom + one-finger pan when zoomed + double-tap zoom/reset, for every img.pz */
(function () {
  var S = new WeakMap(), cur = null, mode = "", d0 = 0, sc0 = 1, lx = 0, ly = 0, lastTap = 0, lastEl = null;
  function st(el) { var s = S.get(el); if (!s) { s = { sc: 1, x: 0, y: 0 }; S.set(el, s); } return s; }
  function dist(t) { var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx * dx + dy * dy) || 1; }
  function clamp(el, s) {
    var mx = el.offsetWidth * (s.sc - 1) / 2, my = el.offsetHeight * (s.sc - 1) / 2;
    s.x = Math.max(-mx, Math.min(mx, s.x)); s.y = Math.max(-my, Math.min(my, s.y));
  }
  function apply(el, s) {
    if (s.sc <= 1.01) { s.sc = 1; s.x = 0; s.y = 0; }
    clamp(el, s);
    el.style.transform = s.sc === 1 ? "" : "translate(" + s.x + "px," + s.y + "px) scale(" + s.sc + ")";
    el.classList.toggle("pz-on", s.sc > 1);
    if (s.sc > 1.4 && el.dataset.full && !el.dataset.hi) { el.dataset.hi = "1"; el.src = el.dataset.full; }
  }
  document.addEventListener("touchstart", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("img.pz") : null;
    if (!el) { mode = ""; cur = null; return; }
    var s = st(el); cur = el;
    if (e.touches.length === 2) { mode = "pinch"; d0 = dist(e.touches); sc0 = s.sc; e.preventDefault(); return; }
    if (e.touches.length === 1) {
      var now = Date.now();
      var key = el.getAttribute("src");
      if (now - lastTap < 300 && lastEl === key) { s.sc = s.sc > 1 ? 1 : 2.5; s.x = 0; s.y = 0; apply(el, s); lastTap = 0; e.preventDefault(); mode = ""; return; }
      lastTap = now; lastEl = key;
      if (s.sc > 1) { mode = "pan"; lx = e.touches[0].clientX; ly = e.touches[0].clientY; e.preventDefault(); } else { mode = ""; }
    }
  }, { passive: false });

// GSDE v28 — PRODUCT INTERACTION PARITY CONTRACT.
// Products.Live Status / approval metadata must never disable a customer interaction that
// Website Status + Availability + declared exact inventory already allow. Category cards stay
// navigable for Active/Coming Soon; purchase controls remain governed by Website Status,
// Website Availability and exact product+color+size stock only.
function gsdeInteractionQa() {
  const targets = ["QTKq 007","QTKq 008","DRS 009","DLG 008"];
  return targets.map(id => {
    const p = PRODUCTS.find(x => x.id === id);
    if (!p) return {id, pass:false, reason:"missing product"};
    const visible = isProductVisible(p);
    const stock = (p.colors && p.colors.length ? p.colors : [null]).some(c =>
      (p.sizes && p.sizes.length ? p.sizes : [null]).some(s => {
        const r = getRemainingStock(p,c,s); return r === null || r > 0;
      })
    );
    return {id, pass: visible && stock, websiteStatus:p.websiteStatus, availability:p.availability, stock};
  });
}

// ---- Verbatim from the validated website v4 build (getSizeStockMap / getRemainingStock /
// cartQtyFor / color-availability check) -- reused as-is so mobile behaves identically to web. ----
function getSizeStockMap(p, color) {
  if (!p) return null;
  if (p.variants && p.variants.length) {
    const v = p.variants.find(v => v.name === color);
    return (v && v.sizeStock) || null;
  }
  if (p.colorSizeStock && color && p.colorSizeStock[color]) return p.colorSizeStock[color];
  return p.sizeStock || null;
}
function cartQtyFor(id, color, size) {
  const skip = editingIdx();
  return cart.reduce((sum, c, i) => sum + ((i !== skip && c.id === id && c.color === color && c.size === size) ? c.qty : 0), 0);
}
function getRemainingStock(p, color, size) {
  const map = getSizeStockMap(p, color);
  if (!map || typeof map[size] !== "number") return null;
  return Math.max(0, map[size] - cartQtyFor(p.id, color, size));
}
function colorAvailable(p, color) {
  const map = getSizeStockMap(p, color);
  return !map || Object.values(map).some(v => typeof v === "number" && v > 0);
}
function isProductSoldOut(p) {
  const colors = p.colors && p.colors.length ? p.colors : [null];
  const sizes = p.sizes && p.sizes.length ? p.sizes : [null];
  for (const c of colors) {
    for (const s of sizes) {
      const r = getRemainingStock(p, c, s);
      if (r === null || r > 0) return false;
    }
  }
  return true;
}

function productGallery(p, color) {

}

// The CEO's new standing rule (2026-08-27): wherever a product or category has no real
// photo yet, show the real Golden Scissors logo as the background/placeholder instead of
// a generic icon, until a real photo is added to the relevant Drive folder.
//
// GSDE FIX (2026-09-03) -- per explicit CEO bug report with screenshots (same fix applied to the
// website demo): multi-color products keep their real photos inside p.variants[].images, never in
// the flat p.img field (p.img is always null for these). Every place below that used to check p.img
// directly was blind to any product whose only photos are per-color -- getRepresentativeImage() is
// the permanent, reusable fix: it returns the flat p.img if present, else the first color variant (in
// declared order, or a specific requested color first when one is given) that has a real photo, else
// null only when the product genuinely has zero real photos anywhere.
function getRepresentativeImage(p, preferColor) {
  // Exact-color binding: never fall back to another color's image.
  if (preferColor) {
    const v = (p.variants || []).find(v => v.name === preferColor);
    return (v && v.images && v.images.length) ? v.images[0] : null;
  }
  // CEO RULE (2026-09-29): a product with ONE declared color shows its OWN primary image.
  if ((p.colors || []).length <= 1) {
    if (p.img) return p.img;
    for (const v of (p.variants || [])) { if (v.images && v.images.length) return v.images[0]; }
    return null;
  }
  // More than one color: no single color may stand in as the product photo; the family/folder
  // "*main*" navigation image is used when the product's Drive folder provides one.
  return (p.navigationNode && p.navigationNode.isNavigationNode && p.navigationImage) ? p.navigationImage : null;
}

  // ---- GSDE round33: show the customer where the added item went ----
function gsFlyToCart(srcEl, targetSel) {
  try {
    const tgt = [...document.querySelectorAll(targetSel)].find(e => e.getClientRects().length);
    if (!tgt) return;
    tgt.classList.remove("gs-blink"); void tgt.offsetWidth; tgt.classList.add("gs-blink");
    setTimeout(() => tgt.classList.remove("gs-blink"), 2000);
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const b = tgt.getBoundingClientRect();
    if (reduce || !tgt.animate || b.bottom < 0 || b.top > innerHeight) return;
    let a = srcEl && srcEl.getBoundingClientRect ? srcEl.getBoundingClientRect() : null;
    const x0 = a ? a.left + a.width / 2 : innerWidth / 2, y0 = a ? a.top + a.height / 2 : innerHeight * 0.7;
    const x1 = b.left + b.width / 2, y1 = b.top + b.height / 2;
    const d = document.createElement("div"); d.className = "gs-fly"; d.textContent = "+";
    document.body.appendChild(d);
    const mx = (x0 + x1) / 2, my = Math.min(y0, y1) - 70; // arc: up first, then down into the cart
    const anim = d.animate([
      { transform: `translate(${x0}px,${y0}px) scale(1)`, opacity: 1 },
      { transform: `translate(${mx}px,${my}px) scale(1.1)`, opacity: 1, offset: .45 },
      { transform: `translate(${x1}px,${y1}px) scale(.3)`, opacity: .85 }
    ], { duration: 850, easing: "ease-in-out" });
    anim.onfinish = anim.oncancel = () => d.remove();
  } catch (e) { /* decoration only: never block adding to the cart */ }
}

function addToCart(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!isCustomerPurchasable(p)) { showToast(productStatusBadge(p) || t("badgeOutOfStock")); return; }
  if (p.colors && p.colors.length && !productModalState.color) { return; }
  if (p.sizes && p.sizes.length && !productModalState.size) { showToast(pickMsg()); return; }
  const remaining = getRemainingStock(p, productModalState.color, productModalState.size);
  if (remaining !== null && remaining <= 0) { showToast(t("sizeSoldOutNote")); return; }
  const existing = cart.find(c => c.id === id && c.size === productModalState.size && c.color === productModalState.color);
  if (existing) existing.qty += productModalState.qty;
  else cart.push({ id, size: productModalState.size, color: productModalState.color, qty: productModalState.qty });
  showToast(t("toastAddedToCart").replace("{name}", productName(p)));
  const gsSrc = (window.event && window.event.target && window.event.target.closest) ? window.event.target.closest("button,.btn,[onclick]") : null;
  render(false);
  gsFlyToCart(gsSrc, ".navitem[onclick*='cart'] .ic");
}

function directOrder(id) {
  const p = PRODUCTS.find(x => x.id === id);

function gsdeStockClamp(list) { // v38/v34: reduce lines above real stock (remove at 0); true if anything changed
  let changed = false;
  for (let i = list.length - 1; i >= 0; i--) {
    const it = list[i], p = PRODUCTS.find(x => x.id === it.id); if (!p) continue;
    const map = getSizeStockMap(p, it.color), stock = (map && typeof map[it.size] === "number") ? map[it.size] : null;
    if (stock === null || it.qty <= stock) continue;
    changed = true; if (stock <= 0) list.splice(i, 1); else it.qty = stock;
  }
  return changed;
}
function gsdeStockMsg() { const m = { en: "Quantities were adjusted to the available stock. Please review your order and send it again.", ar: "تم تعديل بعض الكميات حسب المخزون المتوفر. يرجى مراجعة طلبك وإرساله من جديد.", ku_bad: "بڕی هەندێک کاڵا بەپێی کۆگای بەردەست گۆڕدرا. تکایە داواکارییەکەت پێداچوونەوە بکە و دووبارە بینێرە.", ku_sor: "بڕی هەندێک کاڵا بەپێی کۆگای بەردەست گۆڕدرا. تکایە داواکارییەکەت پێداچوونەوە بکە و دووبارە بینێرە." }; return m[wLang()] || m.en; }
function cartStep(i, d) {
  const c = cart[i]; if (!c) return;
  const p = PRODUCTS.find(x => x.id === c.id);
  const next = c.qty + d;
  if (next < 1) return;
  const map = getSizeStockMap(p, c.color);
  const stock = (map && typeof map[c.size] === "number") ? map[c.size] : null;
  if (stock !== null && next > stock) { showToast(t("sizeSoldOutNote")); return; }
  c.qty = next;
  render(false);
}
function editingIdx() { const top = stack[stack.length - 1]; return (top && top.type === "product" && top.editIdx != null) ? top.editIdx : null; }
function editCartItem(i) {
  const c = cart[i]; if (!c) return;
  productModalState.color = c.color; productModalState.size = c.size; productModalState.qty = c.qty; productModalState.imgIdx = 0;
  suppPanel = null;
  push({ type: "product", id: c.id, editIdx: i });
}
function updateCartItem(id) {
  const idx = editingIdx();
  if (idx == null || !cart[idx]) { pop(); return; }
  const p = PRODUCTS.find(x => x.id === id);
  if (!isCustomerPurchasable(p)) { showToast(productStatusBadge(p) || t("badgeOutOfStock")); return; }
  if (p.colors && p.colors.length && !productModalState.color) { return; }
  if (p.sizes && p.sizes.length && !productModalState.size) { showToast(pickMsg()); return; }
  const color = productModalState.color, size = productModalState.size;
  const remaining = getRemainingStock(p, color, size); // the line being edited is excluded (see cartQtyFor)
  if (remaining !== null && remaining <= 0) { showToast(t("sizeSoldOutNote")); return; }
  const qty = remaining !== null ? Math.min(productModalState.qty, remaining) : productModalState.qty;
  if (qty <= 0) return;
  const other = cart.findIndex((c, k) => k !== idx && c.id === id && c.size === size && c.color === color);
  if (other >= 0) { cart[other].qty += qty; cart.splice(idx, 1); }
  else cart[idx] = { id, size, color, qty };
  showToast(cartUi("updated"));
  stack.pop();
  render(true);
}

function removeFromCart(idx) { cart.splice(idx, 1); render(false); }

function renderCartScreen() {
  if (!cart.length) {
    const inner = `<div class="cart-empty">${esc(t("cartEmptyLine1"))}<br>${esc(t("cartEmptyLine2"))}</div>`;
    return screenChrome(inner);
  }
  let total = 0, hasUnknown = false;
  const rows = cart.map((c, i) => {
    const p = PRODUCTS.find(x => x.id === c.id);
    const lineTotal = p.price != null ? p.price * c.qty : null;
    if (lineTotal != null) total += lineTotal; else hasUnknown = true;
    return `<div class="cart-item">
      <span class="cart-pz-wrap" style="display:block;width:64px;height:64px;flex:none;border-radius:9px">${img(getRepresentativeImage(p, c.color), "pz", 300)}</span>
      <div style="flex:1;">
        <div class="ci-name">${esc(productName(p))}</div>
        ${c.color ? `<div class="ci-meta">${esc(t("cartColorPrefix"))} ${esc(colorLabel(c.color))}</div>` : ""}
        ${c.size ? `<div class="ci-meta">${esc(t("cartSizePrefix"))} ${esc(sizeLabel(c.size))}</div>` : ""}
        <div class="ci-qty"><button type="button" class="ci-qbtn${c.qty <= 1 ? " off" : ""}" onclick="cartStep(${i}, -1)" aria-label="−">−</button><span class="ci-qval">${c.qty}</span><button type="button" class="ci-qbtn" onclick="cartStep(${i}, 1)" aria-label="+">+</button></div>
        <div class="ci-price">${lineTotal != null ? lineTotal.toLocaleString() + " IQD" : esc(t("priceNotSpecified"))}</div>
        <div class="ci-actions"><span class="ci-edit" onclick="editCartItem(${i})">${esc(cartUi("edit"))}</span><span class="ci-remove" onclick="removeFromCart(${i})">${esc(t("cartRemoveLink"))}</span></div>
      </div>
    </div>`;
  }).join("");
  const inner = `<div>${rows}</div>`;
  const summary = `
    <div class="cart-summary">
      <div class="sum-row total"><span>${esc(t("checkoutItemsTotalLabel") || "Total")}</span><span>${total.toLocaleString()} IQD${hasUnknown ? " " + esc(t("cartSubtotalNoteUnknown") || "") : ""}</span></div>
      <button class="btn-primary" style="margin-top:10px;" onclick="directOrderItem=null;push({type:'checkout'})">${esc(t("orderCompleteBtn"))}</button>
    </div>`;
  return screenChrome(inner + summary);
}

let DELIVERY_LOCATIONS_MOBILE = [];

function mobileLocationLabel(loc) {
  const l = wLang();
  if (l === "en") return loc.en;
  if (l === "ar") return loc.ar;
  // Website v28 currently has one governed Kurdish location-label set;
  // use the same set for both Kurdish UI variants until a separate source exists.
  return loc.ku;
}
function mobileDeliveryFee() {
  if (checkoutDeliveryState.method === "pickup") return 0;
  const loc = DELIVERY_LOCATIONS_MOBILE.find(x => x.en === checkoutDeliveryState.location);
  return loc ? loc.price : 0;
}
function mobileCheckoutSubtotal() {
  const items = directOrderItem ? [directOrderItem] : cart;
  return items.reduce((s,c)=>{
    const p = PRODUCTS.find(x=>x.id===c.id);
    return s + (p && p.price != null ? p.price * c.qty : 0);
  },0);
}
function checkoutDeliveryChanged(value) {
  checkoutDeliveryState.method = value;
  updateMobileCheckoutDeliveryDom();
}
function checkoutLocationChanged(value) {
  checkoutDeliveryState.location = value;

}
function updateMobileCheckoutDeliveryDom() {

}

async function placeOrder() {
  const name = (document.getElementById("mCkName")?.value || "").trim();
  const primaryCC = (document.getElementById("mCkPrimaryCC")?.value || "+964").trim();
  const secondaryCC = (document.getElementById("mCkSecondaryCC")?.value || "+964").trim();
  const primaryPhone = (document.getElementById("mCkPrimaryPhone")?.value || "").trim();
  const secondaryPhone = (document.getElementById("mCkSecondaryPhone")?.value || "").trim();
  const email = (document.getElementById("mCkEmail")?.value || "").trim();
  const city = (document.getElementById("mCkCity")?.value || "").trim();
  const note = (document.getElementById("mCkNote")?.value || "").trim();
  const checkoutItems = directOrderItem ? [directOrderItem] : cart;
  if (!name || !primaryPhone) { alert(t("toastFillNamePhone")); return; }
  if (gsdeStockClamp(checkoutItems)) { if (!checkoutItems.length) { directOrderItem = null; showToast(gsdeStockMsg()); gotoTab('shop'); } else { showToast(gsdeStockMsg()); render(false); } return; } // v34: last stock check right before sending
  if (!checkoutItems.length) { alert(t("toastCartEmpty")); return; }

  const orderId = gsdeMakeOrderNo(); // GSW-YYMMDD-XXXX: same number goes to WhatsApp, the confirmation screen and the saved order
  const fee = mobileDeliveryFee();
  const subtotal = mobileCheckoutSubtotal();
  const loc = DELIVERY_LOCATIONS_MOBILE.find(x => x.en === checkoutDeliveryState.location);
  const deliveryLabel = checkoutDeliveryState.method === "pickup"
    ? t("checkoutDeliveryPickup")
    : checkoutDeliveryState.method === "factory_car" ? t("checkoutDeliveryFactoryCar") : t("checkoutDeliveryCompany");
  const areaLabel = checkoutDeliveryState.method === "pickup" ? t("checkoutDeliveryPickup") : (loc ? mobileLocationLabel(loc) : "—");

  const lines = checkoutItems.map((c,i)=>{
    const p=PRODUCTS.find(x=>x.id===c.id);
    const price=p&&p.price!=null?p.price:0;
    const variants=[c.size?`قەبارە: ${sizeLabel(c.size)}`:null,c.color?`ڕەنگ: ${colorLabel(c.color)}`:null].filter(Boolean).join(", ");
    return `${i+1}. ${p?productName(p):c.id}${variants?` (${variants})`:""} — ${c.qty} دانە × ${price.toLocaleString()} IQD = ${(price*c.qty).toLocaleString()} IQD`;
  }).join("\n");

  let msg = `سڵاو، داواکارییەکی نوێ هەیە بۆ ناردن:\n\n`;
  msg += `*ژمارەی داواکاری:* ${orderId}\n`;
  msg += `*ناوی تەواو:* ${name}\n*ژمارەی سەرەکی پەیوەندی:* ${primaryCC} ${primaryPhone}\n`;
  if (secondaryPhone) msg += `*ژمارەی دووەمی پەیوەندی:* ${secondaryCC} ${secondaryPhone}\n`;
  if (email) msg += `*ئیمەیڵ:* ${email}\n`;
  msg += `*ناونیشان:* ${city || "—"}\n\n*وردەکاری داواکاری:*\n${lines}\n\n`;
  msg += `*کۆی کاڵاکان:* ${subtotal.toLocaleString()} IQD\n*شێوازی گەیاندن:* ${deliveryLabel}\n*ناوچەی گەیاندن:* ${areaLabel}\n*کرێی گەیاندن:* ${fee.toLocaleString()} IQD\n*کۆی گشتی (کاڵا + گەیاندن):* ${(subtotal+fee).toLocaleString()} IQD`;
  if (note) msg += `\n\n*تێبینی:* ${note}`;

  // Destination of the fallback WhatsApp message comes from Company Master routing; customer-entered phone is payload only.
  const url = `https://wa.me/${APP_ORDER_WHATSAPP}?text=${encodeURIComponent(gsdeClampWa(msg, "\n", orderId))}`;
  if (window.__gsdeOrderBusy) return; // double-tap guard
  window.__gsdeOrderBusy = true; showToast(t("orderSending"));
  const wasDirect = !!directOrderItem; // read BEFORE the await
  const gsSum = { name, phone: primaryCC + " " + primaryPhone.replace(/^0+/, ""), count: checkoutItems.reduce((n, c) => n + (c.qty | 0), 0), subtotal, fee, total: subtotal + fee };
  let gsSaved = false;
  try {
    const gsdeItems = checkoutItems.map(c => { const p = PRODUCTS.find(x => x.id === c.id); return { productId: String(c.id), name: p ? productName(p) : String(c.id), size: c.size || null, color: c.color || null, qty: c.qty | 0, unitPrice: p ? p.price : null }; });
    const gsSave = gsdeSaveOrderCopy({
      orderNumber: orderId, items: gsdeItems, hasUnknownPrice: gsdeItems.some(i => typeof i.unitPrice !== "number"),
      itemsTotal: subtotal, deliveryFee: fee, deliveryAreaLabel: areaLabel, name,
      primaryContact: gsdeE164cc(primaryCC, primaryPhone), secondaryContact: gsdeE164cc(secondaryCC, secondaryPhone), email, address: city
    });
    gsSaved = (await Promise.race([gsSave, new Promise(r => setTimeout(() => r(false), 200000))])) === true; // never hangs forever
  } catch (e) { console.warn("GSDE order not saved", e); }
  window.__gsdeOrderBusy = false;
  if (gsSaved) {
    if (!wasDirect) cart = [];
    directOrderItem = null;
    stack = [{ type: wasDirect ? "shop" : "cart" }, { type: "confirmation", orderId, sum: gsSum }];
  } else {
    window.__gsdeFailWa = url; // kept: cart + checkout stay as they are; the back arrow returns to the checkout form
    stack = stack.concat([{ type: "confirmation", orderId, failed: true }]);
  }
  render(true);
}
function renderConfirmation(orderId, failed, sum) {
  const iqd = n => (Number(n) || 0).toLocaleString("en-US") + " IQD";
  const row = (k, v, cls) => `<div class="conf-row${cls || ""}"><span class="k">${esc(k)}</span><span class="v" dir="auto">${esc(v)}</span></div>`;
  const sumHtml = sum ? `<div class="conf-sum">${row(t("checkoutNameLabel"), sum.name)}${row(t("orderDoneContact"), sum.phone)}${row(t("orderDoneItems"), String(sum.count))}${row(t("checkoutItemsTotalLabel"), iqd(sum.subtotal))}${row(t("checkoutDeliveryFeeLabel"), iqd(sum.fee))}${row(t("checkoutGrandTotalLabel"), iqd(sum.total), " total")}</div>` : "";
  const inner = failed
  ? `<div class="conf-wrap"><div class="conf-check fail">!</div>
  <p class="conf-msg">${esc(t("orderFailMsg"))}</p>
  <button class="btn-primary" onclick="window.open(window.__gsdeFailWa, '_blank')">${esc(t("orderFailWaBtn"))}</button></div>`
  : `<div class="conf-wrap"><div class="conf-check">✔</div>
  <h2>${esc(t("orderDoneTitle"))}</h2>
  <p class="conf-id">${esc(t("orderIdPrefix").trim())} ${esc(orderId)}</p>
  <p class="conf-msg">${esc(t("orderDoneMsg"))}</p>
  ${sumHtml}
  <button class="btn-primary" onclick="gotoTab('shop')">${esc(t("heroCta"))}</button>
  <p class="conf-note">${esc(t("orderDoneNote"))}</p></div>`;
  return screenChrome(inner);
}

function gsdeE164(local) { const d = String(local || "").replace(/\D/g, "").replace(/^964/, "").replace(/^0+/, ""); return d ? "+964" + d : ""; }

      let qty = Math.max(1, Math.min(99, parseInt(s.qty, 10) || 1));

async function gsdeAuthGoogle() {
  try {
    const fb = await gsdeFb();
    await fb.authM.signInWithPopup(fb.auth, new fb.authM.GoogleAuthProvider());
  } catch (e) { gsdeAuthError(e); }
}
async function gsdeSignUp(btn) {
  const name = acv("acName").trim(), email = acv("acEmail").trim(), password = acv("acPass");
  if (!name) { showToast(t("toastEnterName")); return; }
  if (!email || !password) { showToast(t("toastEnterEmailPassword")); return; }
  if (password.length < 8) { showToast(ta("acctErrWeak")); return; }
  if (btn) btn.disabled = true; gsdePendingSignup = true;
  try {
    const fb = await gsdeFb(); gsdeEmailLang(fb);
    const cred = await fb.authM.createUserWithEmailAndPassword(fb.auth, email, password);
    try { await fb.authM.updateProfile(cred.user, { displayName: name }); } catch (e) { /* non-fatal */ }
    gsdeUid = cred.user.uid;
    await fb.fsM.setDoc(fb.fsM.doc(fb.db, "accounts", cred.user.uid), gsdeNewProfile(fb, cred.user, "Email", {
      displayName: name, shopName: acv("acShop").trim(),
      primaryPhone: gsdeE164(acv("acP1")), secondaryPhone: gsdeE164(acv("acP2")),
      address: acv("acAddr").trim(), marketingConsent: !!acv("acMkt")
    }));
    try { await fb.authM.sendEmailVerification(cred.user); } catch (e) { console.warn("verification email not sent", e); }
    gsdePendingSignup = false;
    acctClearDraft(null);
    await gsdeLoadProfile(cred.user);
    showToast(ta("acctVerifySent"));
  } catch (e) { gsdePendingSignup = false; gsdeAuthError(e); }
  finally { if (btn) btn.disabled = false; }
}
async function gsdeSignIn(btn) {
  const email = acv("siEmail").trim(), password = acv("siPass");
  if (!email || !password) { showToast(t("toastEnterEmailPassword")); return; }
  if (btn) btn.disabled = true;
  try { const fb = await gsdeFb(); await fb.authM.signInWithEmailAndPassword(fb.auth, email, password); acctClearDraft(null); }
  catch (e) { gsdeAuthError(e); }
  finally { if (btn) btn.disabled = false; }
}
async function gsdeForgot() {
  const email = acv("siEmail").trim();
  if (!email) { showToast(t("toastEnterEmailPassword")); return; }
  try { const fb = await gsdeFb(); gsdeEmailLang(fb); await fb.authM.sendPasswordResetEmail(fb.auth, email); }
  catch (e) { if (!e || e.code !== "auth/user-not-found") { if (e && e.code === "auth/invalid-email") { gsdeAuthError(e); return; } console.warn("reset", e && e.code); } }
  showToast(ta("acctResetSent")); // same message whether or not the account exists (no account enumeration)
}
async function gsdeResendVerify() {
  try { const fb = await gsdeFb(); gsdeEmailLang(fb); await fb.authM.sendEmailVerification(fb.auth.currentUser); showToast(ta("acctVerifyResent")); }
  catch (e) { gsdeAuthError(e); }
}
async function gsdeSaveDetails(btn) {
  const name = acv("edName").trim();
  if (!name) { showToast(t("toastEnterName")); return; }
  if (btn) btn.disabled = true;
  try {
    const fb = await gsdeFb();
    const fields = {
      displayName: name.slice(0, 100), shopName: acv("edShop").trim().slice(0, 100),
      primaryPhone: gsdeE164(acv("edP1")), secondaryPhone: gsdeE164(acv("edP2")),
      address: acv("edAddr").trim().slice(0, 300), marketingConsent: !!acv("edMkt"),
      updatedAt: fb.fsM.serverTimestamp()
    };
    await fb.fsM.updateDoc(fb.fsM.doc(fb.db, "accounts", gsdeUid), fields);
    try { await fb.authM.updateProfile(fb.auth.currentUser, { displayName: fields.displayName }); } catch (e) { /* non-fatal */ }
    Object.assign(gsdeProfile, fields);
    loggedInUser.name = fields.displayName; loggedInUser.shopName = fields.shopName; loggedInUser.address = fields.address;
    loggedInUser.primaryPhone = gsdeLocalPhone(fields.primaryPhone); loggedInUser.secondaryPhone = gsdeLocalPhone(fields.secondaryPhone);
    acctEditOpen = false; acctClearDraft(["ed"]);
    gsdeRefresh(); showToast(ta("acctSaved"));
  } catch (e) { gsdeAuthError(e); }
  finally { if (btn) btn.disabled = false; }
}
async function gsdeDeleteAccount() {
  if (!window.confirm(ta("acctDeleteConfirm"))) return;
  try {
    const fb = await gsdeFb(); const uid = gsdeUid, user = fb.auth.currentUser;
    // v37 (M1 fix): erase the profile FIRST (rules only allow it while signed in), then the Auth user.
    const last = user.metadata && user.metadata.lastSignInTime ? Date.parse(user.metadata.lastSignInTime) : 0;
    if (!last || Date.now() - last > 4 * 60 * 1000) { showToast(t.acctNeedRelogin); return; } // sign-in not recent: erase nothing
    await fb.fsM.deleteDoc(fb.fsM.doc(fb.db, "accounts", uid));
    await fb.authM.deleteUser(user); // if this still fails the profile is re-created on next sign-in (gsdeLoadProfile)
    showToast(ta("acctDeleted"));
  } catch (e) {
    if (e && e.code === "auth/requires-recent-login") showToast(ta("acctNeedRelogin")); else gsdeAuthError(e);
  }
}
async function gsdeSignOut() {
  try { const fb = await gsdeFb(); await fb.authM.signOut(fb.auth); } catch (e) { console.warn("signOut", e); }
}
async function gsdeInitAccounts() {
  try {
    const fb = await gsdeFb();
    fb.authM.onAuthStateChanged(fb.auth, async (user) => {
      if (!user || user.isAnonymous) {
        gsdeUid = null; gsdeProfile = null; gsdeOrders = null; gsdePendingCart = null; loggedInUser = null; acctEditOpen = false; acctClearDraft(null);
        gsdeRefresh(); return;
      }
      gsdeUid = user.uid;
      if (gsdePendingSignup) return; // the sign-up handler loads the profile once it has been written
      await gsdeLoadProfile(user);
    });
  } catch (e) { console.warn("GSDE: accounts unavailable", e); }
}

  const POLICIES = {"GS-POL-01": {"id": "GS-POL-01", "docControlEn": "", "docControlAr": "", "titleEn": "Terms & Conditions", "titleAr": "الشروط والأحكام", "titleKuSor": "مەرج و ڕێنماییەکان", "titleKuBad": "مەرج و رێنما", "introEn": "These Terms & Conditions (\"Terms\") are effective as of 25 July 2026 and govern your access to and use of the gscissors.com website, as well as any order you place with Golden scissors Factory, trading as \"Golden Scissors\" (\"we,\" \"us,\" \"our,\" or \"the Factory\"), whether through the website or through our official WhatsApp and Instagram channels. By accessing this website or placing an order, you agree to be bound by these Terms.", "introAr": "تُعد هذه الشروط والأحكام (\"الشروط\") سارية المفعول اعتباراً من 25 يوليو 2026، وتحكم استخدامكم لموقع gscissors.com الإلكتروني، وكذلك أي طلب شراء تقدمونه لدى مصنع مقص الذهبي، الذي يتعامل تجارياً باسم \"غولدن سيزرز\" (Golden Scissors) (ويُشار إليه فيما يلي بـ \"نحن\" أو \"المصنع\")، سواء عبر الموقع الإلكتروني أو عبر قنواتنا الرسمية على واتساب وإنستغرام. إن دخولكم إلى هذا الموقع أو تقديمكم لأي طلب شراء يُعد قبولاً منكم بالالتزام بهذه الشروط.", "introKuSor": "ئەم مەرج و ڕێنماییانە (\"مەرجەکان\") لە ٢٥ی تەممووزی ٢٠٢٦ەوە کاری پێ دەکرێت، و بەڕێوەبردنی بەکارهێنانی ئێوە بۆ ماڵپەڕی الکترونیی gscissors.com دەگرێتەوە، هەروەسا هەر داواکارییەکی کڕین کە پێشکەشی دەکن لە کارگەی مقص الذهبي، کە بە ناوی بازرگانیی \"گۆڵدن سێسەرز\" (Golden Scissors) مامەڵە دەکات (و لەمە دوا بە \"مە\" یان \"کارگە\" ناودەبرێت)، چ لە ڕێگەی ماڵپەڕی الکترونییەوە یان لە ڕێگەی کەناڵە فەرمییەکانمانەوە لە واتسئەپ و ئینستاگرام. چوونەژوورەوەی ئێوە بۆ ئەم ماڵپەڕە یان پێشکەشکردنی هەر داواکارییەکی کڕین بە مانای قبوڵکردنی پابەندبوون بەم مەرجانە دێت.", "introKuBad": "ئەڤ مەرج و رێنمایی (\"مەرج\") بەرکارن ژ ٢٥ی تەممووزا ٢٠٢٦ێ ڤە، و حوکمێ بکارئینانا وە ژ مالپەرا الکترونی gscissors.com دکەن، هەروەسا هەر داخوازەکا کڕینێ کو هوین پێشکێش دکەن ل کارگەها مقص الذهبي، یا کو ب ناڤێ بازرگانی \"گۆڵدن سێسەرز\" (Golden Scissors) مامەلەیێ دکەت (و ژ ڤەدۆر ڤە دهێتە ناسکرن ب \"مە\" یان \"کارگەه\")، چ ل رێکا مالپەرا الکترونی یان ل رێکا کەناڵێن مە یان فەرمی ل واتساب و اینستگرام. هاتنا ژوور بۆ ڤێ مالپەرێ یان پێشکێشکڕنا هەر داخوازەکا کڕینێ ب خۆ ڕازیبوونەکا هەوەیە کو هوین پابەندن ب ڤان مەرجان..", "sectionsEn": [{"heading": "1. Definitions", "paragraphs": ["For the purposes of these Terms, the following words have the meanings set out below, whether used in the singular or plural:", "\"Website\" means the gscissors.com website and any successor site operated by Golden Scissors.", "\"Customer,\" \"you,\" or \"your\" means any person or business that accesses the Website, contacts Golden Scissors through an official channel, or places an Order, whether as a Retail Customer or a Wholesale Customer.", "\"Retail Customer\" means an individual purchasing products for personal use in ordinary retail quantities.", "\"Wholesale Customer\" means a business or individual purchasing products in bulk or wholesale quantities for resale or business use, as further described in our Wholesale Policy.", "\"Distributor\" and \"Agent\" mean a business or individual who has entered into a separate written agreement with Golden Scissors to represent or resell our products on an ongoing basis, as described in our Distributor & Agent Policy.", "\"Order\" means a request to purchase products submitted through the Website, WhatsApp, Instagram, or any other official channel.", "\"Business Day\" means any day other than Friday, Saturday, or an official public holiday in the Kurdistan Region of Iraq.", "\"Account\" means a registered customer profile created on the Website, where available, including individual retail accounts and Wholesale Customer accounts."]}, {"heading": "2. Acceptance of Terms", "paragraphs": ["By accessing, browsing, or using the Website, or by placing an Order with Maqasa Zeri Factory (\"Golden Scissors\"), whether through the Website, WhatsApp, Instagram, or any other official communication channel, you acknowledge that you have read, understood, and agree to be bound by these Terms & Conditions, together with any policies referenced herein, including our Copyright Notice and our Privacy Policy. Because using the Website and placing an Order involves sharing personal information such as your name, phone number, address, and email address, your use of the Website also constitutes your agreement to our Privacy Policy. If you do not agree with any part of these Terms, please discontinue use of the Website and refrain from placing Orders."]}, {"heading": "3. About Golden Scissors", "paragraphs": ["Golden Scissors is the retail and e-commerce trade name of Maqasa Zeri Factory, a Kurdish fashion house based in Duhok, Kurdistan Region of Iraq. We design and create fashion with a focus on traditional Kurdish style, and our goal is to help standardize and elevate Kurdish traditional fashion. The Factory operates under Trade Name Registration No. DUH 2025 3109. Golden Scissors currently creates Kurdish traditional clothing and related accessories, and serves both individual retail customers and wholesale/bulk business buyers."]}, {"heading": "4. Eligibility to Use the Site and Place Orders", "paragraphs": ["By using this website or placing an order, you represent that you are legally capable of entering into binding contracts under the laws of the Kurdistan Region of Iraq and the Republic of Iraq. Orders placed on behalf of a minor, a business, or any other third party must be made by an individual who has the legal authority to do so. Golden Scissors reserves the right, at its sole discretion, to refuse service, decline or cancel an order, or restrict access to the website, including where there is reasonable suspicion of fraudulent, unauthorized, or unlawful activity."]}, {"heading": "5. User Accounts", "paragraphs": ["Where the Website offers account registration or login features, whether for Retail Customers or Wholesale Customers, you are responsible for maintaining the confidentiality of your password and account credentials, and for all activity that occurs under your Account. You agree to provide accurate and up-to-date information when creating or updating your Account.", "You must notify us promptly if you suspect any unauthorized or suspicious activity on your Account.", "Golden Scissors may suspend or restrict access to an Account where we reasonably suspect misuse, fraudulent activity, or a breach of these Terms.", "You may request deletion of your Account at any time by contacting us through our official channels; we will process such requests in accordance with our Privacy Policy."]}, {"heading": "6. Wholesale Accounts", "paragraphs": ["Businesses and individuals wishing to purchase in bulk or wholesale quantities may register or apply for a Wholesale Customer account. Submitting a wholesale registration or inquiry does not, by itself, guarantee approval or acceptance. Golden Scissors reviews wholesale inquiries on a case-by-case basis, including basic information about the applicant's business, before finalizing a wholesale relationship. Wholesale pricing is not published on the Website and is provided only after an inquiry has been reviewed and accepted. We reserve the right to decline any wholesale registration or order at our discretion. Full details are set out in our separate Wholesale Policy.", "Distributors and Agents — businesses or individuals who represent Golden Scissors on an ongoing basis — operate under a separate written agreement with the Factory, as described in our Distributor & Agent Policy, rather than under a standard Wholesale Customer account."]}, {"heading": "7. Product Descriptions and Quality Assurance", "paragraphs": ["We make reasonable efforts to ensure that the product descriptions, photographs, colors, and measurements displayed on the website and on our Instagram page (@golden_scissors400) accurately represent our products. Golden Scissors products are made on a modern production line, supported by a dedicated quality control (QC) team and quality control procedures and policies designed to keep defects to a very low rate. In the rare event that a product shows a defect, the customer has the right to a replacement or exchange in accordance with our Return & Refund Policy."]}, {"heading": "8. Pricing and Payment", "paragraphs": ["All prices displayed on the website or quoted through our official channels are stated in Iraqi Dinar (IQD) unless expressly stated otherwise. Prices are subject to change at any time and without prior notice, including due to fluctuations in material costs, production costs, or market conditions. The price in effect at the time an order is confirmed will apply to that order.", "Accepted payment methods and related payment terms are set out in our separate Payment Policy, which we may update from time to time as new payment options become available or existing ones change.", "If an order is cancelled before shipment, any applicable refund will be processed in accordance with our Return & Refund Policy."]}, {"heading": "9. International Customers", "paragraphs": ["Golden Scissors welcomes Orders from customers outside Iraq. For international Orders, shipping costs and delivery times may vary depending on the destination country and the shipping carrier used, and will be coordinated with the customer after the Order has been confirmed. International customers are also responsible for any customs duties, import taxes, or other charges imposed by their own country."]}, {"heading": "10. Orders and Order Confirmation", "paragraphs": ["Placing an order through the website, WhatsApp, or Instagram, and sending us your order details through any of these channels, reflects your decision to purchase and creates an order with Golden Scissors. Depending on the order, our team may proceed directly to prepare it, or may first verify details such as product availability, price, and delivery information with you — this is handled at our discretion based on the specific order and does not affect the validity of your order. We reserve the right to decline or cancel an order, including in cases of stock unavailability, pricing errors, or suspected fraud, and will inform you via WhatsApp or Instagram if this occurs.", "Order request submitted via the website, WhatsApp, or Instagram — this reflects your decision to place the order.", "Depending on the order, our team may verify product availability, price, and delivery details with you, or may proceed directly to prepare the order.", "We reserve the right to decline or cancel an order in cases such as stock unavailability, pricing errors, or suspected fraud, and will inform you if this occurs.", "Depending on your location, you may choose to receive your Order via a local delivery company, our factory driver, or factory pickup — further details are set out in our Shipping & Delivery Policy."]}, {"heading": "11. Intellectual Property", "paragraphs": ["All intellectual property appearing on the website and across our official channels — including the Golden Scissors brand name, logo, product photography, designs, and written content — is owned by Maqasa Zeri Factory and is protected under applicable law. Full details of our intellectual property rights and the permitted use of our content are set out in our separate Copyright Notice, which forms part of these Terms by reference."]}, {"heading": "12. User Conduct", "paragraphs": ["When using the website or interacting with Golden Scissors through any official channel, you agree not to engage in any conduct that could harm the Factory, its customers, or the integrity of its services, including the following prohibited activities:", "Placing fraudulent, false, or bad-faith orders.", "Impersonating another person or misrepresenting your affiliation with any person or entity.", "Attempting to gain unauthorized access to the website, its systems, or related accounts.", "Using the website or its content for any unlawful purpose or in violation of these Terms.", "Copying, scraping, or reproducing website content for commercial use without authorization."]}, {"heading": "13. Limitation of Liability", "paragraphs": ["To the fullest extent permitted by applicable law, golden scissors Factory shall not be liable for any indirect, incidental, or consequential damages arising from the use of the website or the purchase of our products, including loss of profit or business opportunity. The Factory shall not be responsible for delays or failures in delivery caused by third-party delivery or courier companies, or by circumstances beyond its reasonable control (force majeure), including but not limited to natural disasters, civil unrest, transportation disruptions, or government actions."]}, {"heading": "14. Governing Law and Jurisdiction", "paragraphs": ["These Terms, and any dispute arising from or in connection with them, or with the use of the website or the purchase of products, shall be governed by and construed in accordance with the laws of the Kurdistan Region of Iraq and the Republic of Iraq. Any dispute that cannot be resolved amicably shall be subject to the exclusive jurisdiction of the competent courts of Duhok, Kurdistan Region of Iraq."]}, {"heading": "16. Amendments to These Terms and Contact Us", "paragraphs": ["Golden Scissors reserves the right to amend, update, or replace these Terms at any time and at its sole discretion. The updated version will be posted on the website with a revised effective date, and your continued use of the website or placement of orders after such changes constitutes your acceptance of the amended Terms.", "For any questions regarding these Terms, please contact us through our official channels: WhatsApp +964 750 400 6200 (wa.me/9647504006200), Instagram @golden_scissors400, or email goldenscissors400@gmail.com. Full contact details are also set out in our Contact & Support Policy."]}], "sectionsAr": [{"heading": "١. التعريفات", "paragraphs": ["لأغراض هذه الشروط، يكون للكلمات التالية المعاني الموضحة أدناه، سواء استُخدمت بصيغة المفرد أو الجمع:", "\"الموقع الإلكتروني\" يُقصد به موقع gscissors.com وأي موقع لاحق يخلفه ويُشغّله \"غولدن سيزرز\".", "\"الزبون\" أو \"أنتم\" أو \"لكم\" يُقصد به أي شخص أو جهة تجارية تدخل إلى الموقع الإلكتروني، أو تتواصل مع \"غولدن سيزرز\" عبر أي قناة رسمية، أو تقدّم طلب شراء، سواء بصفة زبون تجزئة أو زبون جملة.", "\"زبون التجزئة\" يُقصد به أي فرد يشتري المنتجات للاستخدام الشخصي وبكميات التجزئة الاعتيادية.", "\"زبون الجملة\" يُقصد به أي جهة تجارية أو فرد يشتري المنتجات بكميات جملة أو كبيرة لغرض إعادة البيع أو الاستخدام التجاري، على النحو الموضح بمزيد من التفصيل في سياسة البيع بالجملة الخاصة بنا.", "\"الموزّع\" و\"الوكيل\" يُقصد بهما أي جهة تجارية أو فرد أبرم اتفاقية خطية منفصلة مع \"غولدن سيزرز\" لتمثيل أو إعادة بيع منتجاتنا بشكل مستمر، على النحو الموضح في سياسة الموزّعين والوكلاء الخاصة بنا.", "\"الطلب\" يُقصد به أي طلب شراء يُقدَّم عبر الموقع الإلكتروني أو واتساب أو إنستغرام أو أي قناة رسمية أخرى.", "\"يوم العمل\" يُقصد به أي يوم بخلاف يومي الجمعة والسبت أو أي عطلة رسمية معتمدة في إقليم كوردستان العراق.", "\"الحساب\" يُقصد به الملف الشخصي المسجَّل للزبون على الموقع الإلكتروني، حيثما كان متاحاً، بما في ذلك حسابات التجزئة الفردية وحسابات زبائن الجملة."]}, {"heading": "٢. قبول الشروط", "paragraphs": ["إن دخولكم أو تصفحكم أو استخدامكم للموقع الإلكتروني، أو تقديمكم لأي طلب شراء لدى مصنع مقص الذهبي (\"غولدن سيزرز\")، سواء عبر الموقع الإلكتروني أو واتساب أو إنستغرام أو أي قناة اتصال رسمية أخرى، يُعد إقراراً منكم بأنكم قد قرأتم هذه الشروط والأحكام وفهمتموها، وتوافقون على الالتزام بها، إلى جانب أي سياسات أخرى مُشار إليها فيها، بما في ذلك إشعار حقوق النشر الخاص بنا وسياسة الخصوصية الخاصة بنا. ونظراً لأن استخدام الموقع الإلكتروني وتقديم طلب شراء يستلزم مشاركة معلومات شخصية مثل اسمكم ورقم هاتفكم وعنوانكم وبريدكم الإلكتروني، فإن استخدامكم للموقع الإلكتروني يُعد أيضاً موافقة منكم على سياسة الخصوصية الخاصة بنا. وفي حال عدم موافقتكم على أي جزء من هذه الشروط، يُرجى التوقف عن استخدام الموقع الإلكتروني والامتناع عن تقديم أي طلبات شراء."]}, {"heading": "٣. عن غولدن سيزرز", "paragraphs": ["\"غولدن سيزرز\" هو الاسم التجاري المعتمد للبيع بالتجزئة والتجارة الإلكترونية التابع لمصنع مقص الذهبي، وهو بيت أزياء كوردي يقع في دهوك، إقليم كوردستان العراق. نقوم بتصميم وابتكار الأزياء مع التركيز على الطراز الكوردي التقليدي، وهدفنا هو المساهمة في توحيد معايير الأزياء الكوردية التقليدية والارتقاء بها. يعمل المصنع بموجب شهادة تسجيل الاسم التجاري رقم DUH 2025 3109. يقوم \"غولدن سيزرز\" حالياً بصناعة الملابس الكوردية التقليدية وما يتصل بها من إكسسوارات، وذلك لكل من الزبائن الأفراد بالتجزئة، وزبائن الجملة/المشتريات التجارية بالكميات."]}, {"heading": "٤. أهلية استخدام الموقع وتقديم الطلبات", "paragraphs": ["باستخدامكم لهذا الموقع الإلكتروني أو تقديمكم لأي طلب شراء، فإنكم تقرّون بأنكم تتمتعون بالأهلية القانونية اللازمة لإبرام عقود ملزمة بموجب قوانين إقليم كوردستان العراق وجمهورية العراق. يجب أن يتم تقديم الطلبات نيابة عن قاصر، أو شركة، أو أي طرف ثالث آخر، من قِبل شخص يملك الصلاحية القانونية للقيام بذلك. يحتفظ \"غولدن سيزرز\" بحقه، وفق تقديره المطلق، في رفض تقديم الخدمة، أو رفض أو إلغاء أي طلب، أو تقييد الوصول إلى الموقع الإلكتروني، بما في ذلك في حال وجود شبهة معقولة بوجود نشاط احتيالي أو غير مصرح به أو مخالف للقانون."]}, {"heading": "٥. حسابات المستخدمين", "paragraphs": ["في حال أتاح الموقع الإلكتروني خاصية إنشاء حساب أو تسجيل الدخول، سواء لزبائن التجزئة أو زبائن الجملة، فإنكم تتحملون مسؤولية الحفاظ على سرية كلمة المرور وبيانات الدخول الخاصة بحسابكم، وعن جميع الأنشطة التي تتم من خلاله. وتوافقون على تقديم معلومات دقيقة ومحدثة عند إنشاء الحساب أو تحديث بياناته.", "يجب عليكم إبلاغنا فوراً في حال الاشتباه بأي نشاط غير مصرح به أو مشبوه على حسابكم.", "يجوز لـ\"غولدن سيزرز\" تعليق أو تقييد الوصول إلى أي حساب في حال الاشتباه المعقول بإساءة الاستخدام، أو النشاط الاحتيالي، أو مخالفة هذه الشروط.", "يمكنكم طلب حذف حسابكم في أي وقت من خلال التواصل معنا عبر قنواتنا الرسمية، وسنقوم بمعالجة هذه الطلبات وفقاً لسياسة الخصوصية الخاصة بنا."]}, {"heading": "٦. حسابات الجملة", "paragraphs": ["يجوز للجهات التجارية والأفراد الراغبين بالشراء بكميات جملة أو كبيرة التسجيل أو التقدّم بطلب للحصول على حساب زبون جملة. ولا يعني تقديم طلب التسجيل أو الاستفسار عن الجملة، بحد ذاته، ضماناً للموافقة أو القبول. تقوم \"غولدن سيزرز\" بمراجعة استفسارات الجملة على أساس كل حالة على حدة، بما في ذلك الحصول على معلومات أساسية عن نشاط الجهة المتقدمة، وذلك قبل إتمام أي علاقة بيع بالجملة. ولا تُنشر أسعار الجملة على الموقع الإلكتروني، وإنما تُقدَّم فقط بعد مراجعة الاستفسار وقبوله. ونحتفظ بحقنا في رفض أي طلب تسجيل أو طلب شراء بالجملة وفقاً لتقديرنا. وترد التفاصيل الكاملة في سياسة البيع بالجملة المنفصلة الخاصة بنا.", "أما الموزّعون والوكلاء - وهم الجهات التجارية أو الأفراد الذين يمثلون \"غولدن سيزرز\" بشكل مستمر - فيعملون بموجب اتفاقية خطية منفصلة مع المصنع، على النحو الموضح في سياسة الموزّعين والوكلاء الخاصة بنا، وليس بموجب حساب زبون جملة اعتيادي."]}, {"heading": "٧. أوصاف المنتجات وضمان الجودة", "paragraphs": ["نبذل جهوداً معقولة لضمان أن تكون أوصاف المنتجات والصور الفوتوغرافية والألوان والمقاسات المعروضة على الموقع الإلكتروني وعلى صفحتنا على إنستغرام (@golden_scissors400) ممثّلة بدقة لمنتجاتنا. تُصنَّع منتجات \"غولدن سيزرز\" ضمن خط إنتاج حديث، بدعم من فريق مختص بمراقبة الجودة (QC) وإجراءات وسياسات لضبط الجودة تهدف إلى إبقاء نسبة العيوب عند أدنى حد ممكن. وفي الحالات النادرة التي يظهر فيها عيب في أحد المنتجات، يحق للزبون استبداله أو تغييره وفقاً لسياسة الاسترجاع والاستبدال الخاصة بنا."]}, {"heading": "٨. الأسعار والدفع", "paragraphs": ["تُعرض جميع الأسعار الموضحة على الموقع الإلكتروني أو المُبلَّغة عبر قنواتنا الرسمية بالدينار العراقي (IQD)، ما لم يُنص صراحةً على خلاف ذلك. تخضع الأسعار للتغيير في أي وقت ودون إشعار مسبق، بما في ذلك نتيجة تقلبات تكاليف المواد أو تكاليف الإنتاج أو ظروف السوق. ويُطبَّق على الطلب السعر المعمول به في وقت تأكيد ذلك الطلب.", "ترد وسائل الدفع المقبولة وشروط الدفع ذات الصلة في سياسة الدفع المنفصلة الخاصة بنا، والتي قد نقوم بتحديثها من وقت لآخر مع توفر وسائل دفع جديدة أو تغيّر الوسائل القائمة.", "في حال إلغاء أي طلب قبل شحنه، فإن أي عملية استرداد للمبلغ ستتم وفقاً لسياسة الاسترجاع والاستبدال الخاصة بنا."]}, {"heading": "٩. الزبائن الدوليون", "paragraphs": ["ترحّب \"غولدن سيزرز\" بالطلبات الواردة من الزبائن خارج العراق. وبالنسبة للطلبات الدولية، قد تختلف تكاليف الشحن ومدة التوصيل بحسب دولة الوجهة وشركة الشحن المستخدمة، ويتم التنسيق بشأنها مع الزبون بعد تأكيد الطلب. كما يتحمل الزبائن الدوليون مسؤولية أي رسوم جمركية أو ضرائب استيراد أو أي رسوم أخرى تفرضها دولتهم."]}, {"heading": "١٠. الطلبات وتأكيد الطلب", "paragraphs": ["إن تقديم طلب شراء عبر الموقع الإلكتروني أو واتساب أو إنستغرام، وإرسال تفاصيل طلبكم إلينا عبر أي من هذه القنوات، يعكس قراركم بالشراء وينشئ طلباً لدى \"غولدن سيزرز\". وبحسب طبيعة الطلب، قد يقوم فريقنا بالمباشرة مباشرةً بتجهيزه، أو قد يتحقق أولاً من تفاصيل مثل توفر المنتج والسعر وبيانات التوصيل معكم - ويتم ذلك بحسب تقديرنا لكل طلب على حدة، ولا يؤثر ذلك على صحة طلبكم. نحتفظ بحقنا في رفض أو إلغاء أي طلب، بما في ذلك في حالات عدم توفر المخزون، أو الأخطاء في التسعير، أو الاشتباه بالاحتيال، وسنُبلغكم عبر واتساب أو إنستغرام في حال حدوث ذلك.", "تقديم طلب الشراء عبر الموقع الإلكتروني أو واتساب أو إنستغرام - ويعكس ذلك قراركم بتقديم الطلب.", "قد يتحقق فريقنا، بحسب طبيعة الطلب، من توفر المنتج والسعر وتفاصيل التوصيل معكم، أو قد يباشر بتجهيز الطلب مباشرة.", "نحتفظ بحقنا في رفض أو إلغاء أي طلب في حالات مثل عدم توفر المخزون، أو الأخطاء في التسعير، أو الاشتباه بالاحتيال، وسنُبلغكم في حال حدوث ذلك.", "وبحسب موقعكم، يمكنكم اختيار استلام طلبكم عبر شركة توصيل محلية، أو سائق المصنع، أو استلامه شخصياً من المصنع - وترد التفاصيل الكاملة في سياسة الشحن والتوصيل الخاصة بنا."]}, {"heading": "١١. الملكية الفكرية", "paragraphs": ["تُعد جميع عناصر الملكية الفكرية الظاهرة على الموقع الإلكتروني وعبر قنواتنا الرسمية - بما في ذلك اسم علامة \"غولدن سيزرز\" التجارية، والشعار، والصور الفوتوغرافية للمنتجات، والتصاميم، والمحتوى الكتابي - ملكاً خاصاً لمصنع مقص الذهبي ومحمية بموجب القانون المعمول به. وترد التفاصيل الكاملة لحقوق الملكية الفكرية الخاصة بنا وحدود الاستخدام المسموح به لمحتوانا في إشعار حقوق النشر المنفصل الخاص بنا، والذي يُعد جزءاً لا يتجزأ من هذه الشروط بالإحالة إليه."]}, {"heading": "١٢. سلوك المستخدم", "paragraphs": ["عند استخدامكم للموقع الإلكتروني أو تواصلكم مع \"غولدن سيزرز\" عبر أي قناة رسمية، فإنكم توافقون على عدم القيام بأي تصرف من شأنه الإضرار بالمصنع أو بزبائنه أو بسلامة خدماته، بما في ذلك على سبيل المثال الأنشطة المحظورة التالية:", "تقديم طلبات شراء احتيالية أو كاذبة أو بسوء نية.", "انتحال شخصية شخص آخر أو تقديم بيانات غير صحيحة بشأن علاقتكم بأي شخص أو جهة.", "محاولة الوصول غير المصرح به إلى الموقع الإلكتروني أو أنظمته أو الحسابات المرتبطة به.", "استخدام الموقع الإلكتروني أو محتواه لأي غرض غير قانوني أو بما يخالف هذه الشروط.", "نسخ أو استخلاص أو إعادة إنتاج محتوى الموقع الإلكتروني لأغراض تجارية دون تصريح."]}, {"heading": "١٣. تحديد المسؤولية", "paragraphs": ["إلى أقصى حد يسمح به القانون المعمول به، لا يتحمل مصنع مقص الذهبي أي مسؤولية عن أي أضرار غير مباشرة أو عرضية أو تبعية ناتجة عن استخدام الموقع الإلكتروني أو شراء منتجاتنا، بما في ذلك خسارة الأرباح أو الفرص التجارية. كما لا يتحمل المصنع مسؤولية التأخير أو الإخفاق في التوصيل الناتج عن شركات التوصيل أو النقل التابعة لأطراف ثالثة، أو عن ظروف خارجة عن إرادته المعقولة (القوة القاهرة)، بما في ذلك على سبيل المثال لا الحصر الكوارث الطبيعية، أو الاضطرابات المدنية، أو تعطل وسائل النقل، أو الإجراءات الحكومية."]}, {"heading": "١٤. القانون الواجب التطبيق والاختصاص القضائي", "paragraphs": ["تخضع هذه الشروط، وأي نزاع ينشأ عنها أو يتعلق بها أو باستخدام الموقع الإلكتروني أو شراء المنتجات، لقوانين إقليم كوردستان العراق وجمهورية العراق، وتُفسَّر وفقاً لها. وفي حال تعذّر تسوية أي نزاع ودياً، تكون المحاكم المختصة في دهوك، إقليم كوردستان العراق، صاحبة الاختصاص القضائي الحصري للفصل فيه."]}, {"heading": "١٦. تعديل هذه الشروط والتواصل معنا", "paragraphs": ["يحتفظ \"غولدن سيزرز\" بحقه في تعديل أو تحديث أو استبدال هذه الشروط في أي وقت ووفقاً لتقديره المطلق. وسيتم نشر النسخة المحدثة على الموقع الإلكتروني مع تاريخ نفاذ مُحدَّث، ويُعد استمراركم في استخدام الموقع الإلكتروني أو تقديم الطلبات بعد إجراء هذه التعديلات بمثابة موافقة منكم على الشروط المعدَّلة.", "لأي استفسارات بخصوص هذه الشروط، يُرجى التواصل معنا عبر قنواتنا الرسمية: واتساب على الرقم 964 750 400 6200+ (wa.me/9647504006200)، أو عبر إنستغرام على الحساب golden_scissors400@، أو عبر البريد الإلكتروني goldenscissors400@gmail.com. كما ترد تفاصيل التواصل الكاملة في سياسة التواصل والدعم الخاصة بنا."]}], "sectionsKuSor": [{"heading": "١. پێناسەکان", "paragraphs": ["بۆ مەبەستی ئەم مەرجانە، ئەم ووشانەی خوارەوە واتای دیاریکراوی خۆیان هەیە، چ بە شێوەی تاک یان کۆ بەکار هاتبن:", "\"ماڵپەڕی الکترونی\": مەبەست لێی ماڵپەڕی gscissors.com و هەر ماڵپەڕێکی داهاتووە کە شوێنی بگرێتەوە و لەلایەن \"گۆڵدن سێسەرز\"ەوە بەڕێوەببرێت\".", "\"کڕیار\" یان \"ئێوە\": مەبەست لێی هەر کەس یان لایەنێکی بازرگانییە کە دەچێتە ناو ماڵپەڕی الکترونییەوە، یان پەیوەندی بە \"گۆڵدن سێسەرز\"ەوە دەکات لە ڕێگەی هەر کەناڵێکی فەرمییەوە، یان داواکارییەکی کڕین پێشکەش دەکات، چ بە ناوی کڕیاری تاکفڕۆشی یان کڕیاری کۆمفڕۆشی.", "\"کڕیاری تاکفڕۆشی\": مەبەست لێی هەر تاکێکە کە بەرهەمەکان بۆ مەبەستی بەکارهێنانی کەسایەتی و بە بڕی ئاسایی تاکفڕۆشی دەکڕێت.", "\"کڕیاری کۆمفڕۆشی\": مەبەست لێی هەر لایەنێکی بازرگانی یان تاکێکە کە بەرهەمەکان بە بڕی کۆم یان گەورە بۆ مەبەستی دووبارەفرۆشتنەوە یان بەکارهێنانی بازرگانی دەکڕێت، وەک لە سیاسەتی فرۆشتنی کۆمدا بە وردی روونکراوەتەوە.", "\"دابەشکار\" و \"بریکار\": مەبەست لێی هەر لایەنێکی بازرگانی یان تاکێکە کە ڕێککەوتنێکی نووسراوی جودای لەگەڵ \"گۆڵدن سێسەرز\" گرێداوە بۆ نوێنەرایەتیکردن یان دووبارەفرۆشتنەوەی بەرهەمەکانمان بە شێوەی بەردەوام، وەک لە سیاسەتی دابەشکاران و بریکارەکانماندا روونکراوەتەوە.", "\"داواکاری\": مەبەست لێی هەر داواکارییەکی کڕینە کە لە ڕێگەی ماڵپەڕی الکترونی، واتسئەپ، ئینستاگرام یان هەر کەناڵێکی فەرمیی تریشەوە پێشکەش دەکرێت.", "\"ڕۆژی کارکردن\": مەبەست لێی هەر ڕۆژێکە جیا لە هەینی و شەممە یان هەر پشوویەکی فەرمیی پەسەندکراو لە هەرێمی کوردستانی عێراق.", "\"هەژمار\": مەبەست لێی پرۆفایلی تۆمارکراوی کڕیارە لەسەر ماڵپەڕی الکترونی، ئەگەر بەردەست بێت، لەوانە هەژمارەکانی تاکفڕۆشیی تاکەکەسی و هەژمارەکانی کڕیارانی کۆمفڕۆشی."]}, {"heading": "٢.قبوڵکردنی مەرجەکان", "paragraphs": ["چوونەژوورەوە، گەڕان، یان بەکارهێنانی ئەم ماڵپەڕە الکترونییە، یان پێشکەشکردنی هەر داواکارییەکی کڕین لە کارگەی مقص الذهبي (\"گۆڵدن سێسەرز\")، چ لە ڕێگەی ماڵپەڕی الکترونی یان واتسئەپ یان ئینستاگرام یان هەر کەناڵێکی تری پەیوەندیی فەرمی، بە مانای دانپێدانانی ئێوە دێت کە ئەم مەرج و ڕێنماییانەتان خوێندۆتەوە و تێگەیشتوون، و ڕازین بە پابەندبوون پێیانەوە، لەگەڵ هەر سیاسەتێکی تریش کە ئاماژەیان پێ کراوە، لەوانە ئاگاداری مافی لەبەرگرتنەوە (Copyright) و سیاسەتی تایبەتمەندیمان. لەبەر ئەوەی بەکارهێنانی ماڵپەڕی الکترونی و پێشکەشکردنی داواکاریی کڕین پێویستی بە هاوبەشکردنی زانیاریی کەسایەتی هەیە وەک ناو، ژمارەی تەلەفۆن، ناونیشان و پۆستەی الکترونی، بۆیە بەکارهێنانی ماڵپەڕی الکترونی بە مانای ڕەزامەندیدانیش دێت لەسەر سیاسەتی تایبەتمەندیمان. لە حاەتی نەبوونی ڕەزامەندیی ئێوە لەسەر هەر بەشێکی ئەم مەرجانە، تکایە واز لە بەکارهێنانی ماڵپەڕی الکترونی بهێنن و خۆتان بپارێزن لە پێشکەشکردنی هەر داواکارییەکی کڕین."]}, {"heading": "٣. دەربارەی گۆڵدن سێسەرز", "paragraphs": ["\"گۆڵدن سێسەرز\" ناوی بازرگانیی پەسەندکراوە بۆ فرۆشتنی تاکفڕۆشی و بازرگانیی الکترونی سەر بە کارگەی مقص الذهبي، کە ماڵێکی جلوبەرگی کوردییە و دەکەوێتە دهۆک، هەرێمی کوردستانی عێراق. ئێمە دیزاین و داهێنانی جلوبەرگ دەکەین بە گرنگیدان بە شێوازی کوردیی ڕەسەن، و ئامانجمان بەشداریکردنە لە یەکخستنی پێوەرەکانی جلوبەرگی کوردیی ڕەسەن و بەرزکردنەوەی ئاستیان. کارگە بە مۆڵەتی تۆمارکردنی ناوی بازرگانی بە ژمارەی DUH 2025 3109 کار دەکات. \"گۆڵدن سێسەرز\" لە ئێستادا جلوبەرگی کوردیی ڕەسەن و پێداویستییەکانی دروست دەکات، هەم بۆ کڕیارانی تاکەکەسیی تاکفڕۆشی، و هەم بۆ کڕیارانی کۆمفڕۆشی / کڕینی بازرگانی بە بڕی گەورە."]}, {"heading": "٤. شیاوەتیی بەکارهێنانی ماڵپەڕ و پێشکەشکردنی داواکارییەکان", "paragraphs": ["بە بەکارهێنانی ئەم ماڵپەڕە الکترونییە یان پێشکەشکردنی هەر داواکارییەکی کڕین، ئێوە دان بەوەدا دەن کە خاوەنی شیاوەتیی یاسایی پێویستن بۆ ئەنجامدانی گرێبەستی پابەندکەر لە ژێر یاساکانی هەرێمی کوردستانی عێراق و کۆماری عێراقدا. پێویستە داواکارییەکان لەسەر ناوی کەسێکی نابالیغ، کۆمپانیایەک، یان هەر لایەنێکی سێیەمی تر، لەلایەن کەسێکەوە پێشکەش بکرێن کە دەسەڵاتی یاسایی بۆ ئەوە هەبێت. \"گۆڵدن سێسەرز\" مافی خۆی دەپارێزێت، بە پێی لێڕەواندنی تایبەتی خۆی، لە رەتکردنەوەی پێشکەشکردنی خزمەتگوزاری، یان ڕەتکردنەوە یان هەڵوەشاندنەوەی هەر داواکارییەک، یان سنوردارکردنی دەستگەیشتن بە ماڵپەڕی الکترونی، لەوانەش لە کاتی بوونی گۆمانێکی لۆژیکی لە بوونی چالاکیی فێڵبازانە یان ناتەواو یان پێچەوانەی یاسا."]}, {"heading": "٥. هەژمارەکانی بەکارهێنەران", "paragraphs": ["لە ئەگەری بەردەستکردنی تایبەتمەندیی دروستکردنی هەژمار یان چوونەژوورەوە لەلایەن ماڵپەڕی الکترونییەوە، چ بۆ کڕیارانی تاکفڕۆشی یان کۆمفڕۆشی، ئێوە بەرپرسن لە پاراستنی نهێنیی وشەی تێپەڕ (پاسوۆرد) و زانیارییەکانی چوونەژوورەوەی هەژمارەکەتان، و لە هەموو ئەو چالاکییانەی کە لە ڕێگەیەوە ئەنجام دەدرێن. هەروەها ڕازین لەسەر پێشکەشکردنی زانیاریی ڕاست و نوێ لە کاتی دروستکردنی هەژمارەکە یان نوێکردنەوەی زانیارییەکانیدا.", "پێویستە دەستبەجێ ئاگاداربکەنەوە لە ئەگەری گۆمانکردن لە هەر چالاکییەکی ناتەواو یان گۆماناوی لەسەر هەژمارەکەتان.", "دەکرێت \"گۆڵدن سێسەرز\" ڕاگرتن یان سنوردارکردنی دەستگەیشتن بۆ هەر هەژمارەیەک ئەنجام بدات لە کاتی گۆمانی لۆژیکی بۆ خراپ بەکارهێنان، چالاکیی فێڵبازانە، یان پێشێلکردنی ئەم مەرجانە.", "دەتوانن داوای سڕینەوەی هەژمارەکەتان بکەن لە هەر کاتێکدا لە ڕێگەی پەیوەندیکردن بە مە بە پێی کەناڵە فەرمییەکانمان، و ئێمە ئەم داواکارییانە چارەسەر دەکەین بە پێی سیاسەتی تایبەتمەندیمان."]}, {"heading": "٦. هەژمارەکانی کۆمفڕۆشی", "paragraphs": ["دەکرێت لایەنە بازرگانییەکان و ئەو کەسانەی حەز بە کڕینی بڕی گەورە یان کۆم دەکەن، داواکاری پێشکەش بکەن بۆ بەدەستهێنانی هەژماری کڕیاری کۆمفڕۆشی. پێشکەشکردنی داواکاریی تۆمارکردن یان پرسیارکردن دەربارەی کۆم، بە تەنیا گەرەنتیی قبوڵکردن نییە. \"گۆڵدن سێسەرز\" پێداچوونەوە بە پرسیارەکانی کۆمدا دەکات لەسەر بنەمای هەر دۆسیەیەک بە جیا، لەوانەش بەدەستهێنانی زانیاریی بنەڕەتی دەربارەی چالاکیی لایەنی داواکار، پێش تەواوکردنی هەر پەیوەندییەکی فرۆشتنی کۆم. نرخەکانی کۆم لەسەر ماڵپەڕی الکترونی بڵاونابنەوە، بەڵکو تەنیا دوای پێداچوونەوە بە پرسیارەکە و قبوڵکردنی دەدرێن. ئێمە مافی خۆمان دەپارێزین لە ڕەتکردنەوەی هەر داواکارییەکی تۆمارکردن یان کڕینی کۆم بە پێی لێڕەواندنی خۆمان. وردەکاریی تەواو لە سیاسەتی جودای فرۆشتنی کۆمماندا هەیە.", "بەڵام دابەشکاران و بریکاران - کە ئەو لایەنە بازرگانی یان تاکانەن کە نوێنەرایەتیی \"گۆڵدن سێسەرز\" دەکەن بە شێوەیەکی بەردەوام - لە ژێر ڕێککەوتنێکی نووسراوی جودادا لەگەڵ کارگە کار دەکەن، وەک لە سیاسەتی دابەشکاران و بریکارەکانماندا هاتووە، نەک لە ڕێگەی هەژماری ئاسایی کڕیاری کۆمفڕۆشییەوە."]}, {"heading": "٧. پێناسەی بەرهەمەکان و مسۆگەرکردنی کوالێتی", "paragraphs": ["هەوڵی لۆژیکی دەدەین بۆ مسۆگەرکردنی ئەوەی کە پێناسەی بەرهەمەکان، وێنە فۆتۆگرافییەکان، ڕەنگەکان و قەبارە نیشاندراوەکان لەسەر ماڵپەڕی الکترونی و لەسەر پەڕەکەمان لە ئینستاگرام (@golden_scissors400) بە وردی نوێنەرایەتیی بەرهەمەکانمان بکەن. بەرهەمەکانی \"گۆڵدن سێسەرز\" لە هێڵی بەرهەمهێنانی نوێدا دروست دەکرێن، بە پشتگیریی تیمێکی تایبەتمەند بە چاودێریی کوالێتی (QC) و ڕێکار و سیاسەتی ڕێکخستنی کوالێتی بە ئامانجی هێشتنەوەی ڕێژەی کەمکوورییەکانی بەرهەم لە نزمترین ئاستدا. لە حاڵەتە دەگمەنەکاندا کە کەمکوورییەک لە یەکێک لە بەرهەمەکاندا دەردەکەوێت، مافی کڕیارە کە ئاڵوگۆڕی بکات یان بگۆڕێت بە پێی سیاسەتی گەڕاندنەوە و ئاڵوگۆڕکردنمان."]}, {"heading": "٨. نرخەکان و پارەدان", "paragraphs": ["هەموو نرخە دیاریکراوەکان لەسەر ماڵپەڕی الکترونی یان ڕاگەیەندراوەکان لە ڕێگەی کەناڵە فەرمییەکانمانەوە بە دیناری عێراقی (IQD)ن، مەگەر بە ڕوونی پێچەوانەکەی باس کرابێت. نرخەکان لە ژێر گۆڕانکاریدان لە هەر کاتێکدا و بێ ئاگاداریی پێشوەختە، لەوانەش وەک ئەنجامی گۆڕانی تێچووی ماددەکان یان تێچووی بەرهەمهێنانیش یان دۆخی بازاڕ. ئەو نرخە پەیڕەو دەکرێت کە لە کاتی پشتڕاستکردنەوەی داواکارییەکەدا کارا بووە.", "ڕێگاکانی پارەدانی قبوڵکراو و مەرجە پەیوەندیدارەکانی پارەدان لە سیاسەتی پارەدانی جوداماندا هەن، کە ڕەنگە لە کاتێکەوە بۆ کاتێکی تر نوێیان بکەینەوە لەگەڵ بەردەستبوونی ڕێگەی نوێی پارەدان یان گۆڕانی ڕێگاکانی ئێستا", ". لە ئەگەری هەڵوەشاندنەوەی هەر داواکارییەک پێش ناردنی، هەر پرۆسەیەکی گەڕاندنەوەی پارە بە پێی سیاسەتی گەڕاندنەوە و ئاڵوگۆڕکردنمان ئەنجام دەدرێت."]}, {"heading": "٩. کڕیارانی نێودەوڵەتی", "paragraphs": ["\"گۆڵدن سێسەرز\" پێشوازی لە داواکارییەکانی دەرەوەی عێراق دەکات. بۆ داواکارییە نێودەوڵەتییەکان، ڕەنگە تێچووی گەیاندن و ماوەی گەیاندن جیاواز بن بە پێی وڵاتی مەبەست و کۆمپانیای گەیاندنی بەکارهاتوو، و هەماهەنگی لەسەر دەکرێت لەگەڵ کڕیاردا دوای پشتڕاستکردنەوەی داواکارییەکە. هەروەها کڕیارانی نێودەوڵەتی بەرپرسیارن لە هەر رسوومێکی گومرکی، باجی هاوردەکردن یان هەر رسوومێکی تری وڵاتەکەیان."]}, {"heading": "١٠. داواکارییەکان و پشتڕاستکردنەوەی داواکاری", "paragraphs": ["پێشکەشکردنی داواکاریی کڕین لە ڕێگەی ماڵپەڕی الکترونی، واتسئەپ یان ئینستاگرام، و ناردنی وردەکاریی داواکارییەکەتان بۆ ئێمە لە ڕێگەی هەر یەکێک لەم کەناڵانەوە، بڕیاری کڕینی ئێوە نیشان دەدات و داواکارییەک لە \"گۆڵدن سێسەرز\" دروست دەکات. بە پێی سروشتی داواکارییەکە، ڕەنگە تیمەکەمان ڕاستەوخۆ دەست بە ئامادەکردنی بکات، یان ڕەنگە پێش هەموو شتێک پشکنین بۆ وردەکارییەکانی وەک بەردەستبوونی بەرهەم، نرخ و زانیارییەکانی گەیاندن لەگەڵ ئێوەدا بکات - ئەمەش بە پێی لێڕەواندنی ئێمەیە بۆ هەر داواکارییەک بە جیا، و ئەمە کاریگەری لەسەر دروستیی داواکارییەکەتان نابێت. ئێمە مافی خۆمان دەپارێزین لە ڕەتکردنەوە یان هەڵوەشاندنەوەی هەر داواکارییەک، لەوانە لە حاڵەتەکانی نەبوونی کۆگا، هەڵەی نرخدان، یان گۆمان لە فێڵکردندا، و لەو حاڵەتەدا لە ڕێگەی واتسئەپ یان ئینستاگرامەوە ئاگادارتان دەکەینەوە.", "پێشکەشکردنی داواکاریی کڕین لە ڕێگەی ماڵپەڕی الکترونی، واتسئەپ یان ئینستاگرام - کە ئەوە بڕیاری ئێوە بۆ پێشکەشکردنی داواکارییەکە دەردەخات.", "ڕەنگە تیمەکەمان، بە پێی سروشتی داواکارییەکە، پشکنین بۆ بەردەستبوونی بەرهەم، نرخ و وردەکارییەکانی گەیاندن لەگەڵ ئێوەدا بکات، یان دەستبەجێ دەست بە ئامادەکردنی داواکارییەکە بکات.", "ئێمە مافی خۆمان دەپارێزین لە ڕەتکردنەوە یان هەڵوەشاندنەوەی هەر داواکارییەک لە حاڵەتەکانی وەک نەبوونی کۆگا، هەڵەی نرخدان، یان گۆمان لە فێڵکردن، و ئەگەر ئەوە ڕوودەدات ئاگادارتان دەکەینەوە.", "بە پێی شوێنی خۆتان، دەتوانن وەرگرتنی داواکارییەکەتان لە ڕێگەی کۆمپانیایەکی گەیاندنی خۆماڵی، شۆفێری کارگە، یان وەرگرتنی ڕاستەوخۆ لە کارگە هەڵبژێرن - و وردەکاریی تەواو لە سیاسەتی ناردن و گەیاندنماندا هاتووە."]}, {"heading": "١١. موڵکایەتیی فکری", "paragraphs": ["هەموو توخمەکانی موڵکایەتیی فکریی دەركەوتوو لەسەر ماڵپەڕی الکترونی و لەسەر کەناڵە فەرمییەکانمان - لەوانە ناوی مارکەی \"گۆڵدن سێسەرز\"، لۆگۆ، وێنە فۆتۆگرافییەکانی بەرهەمەکان، دیزاینەکان و ناوەڕۆکی نووسراو - موڵکی تایبەتی کارگەی مقص الذهبي نە و بە پێی یاسای بەرکار دەپارێزرێن. وردەکاریی تەواوی مافەکانی موڵکایەتیی فکریی ئێمە و سنوورەکانی بەکارهێنانی ڕێگەپێدراوی ناوەڕۆکەکەمان لە ئاگاداریی مافی لەبەرگرتنەوەی جوداماندا هاتووە، کە بەشێکی دانەبڕاوە لەم مەرجانە بە ڕێگەی ئاماژەپێکردن پێیان."]}, {"heading": "١٢. ڕفتاری بەکارهێنەر", "paragraphs": ["لە کاتی بەکارهێنانی ماڵپەڕی الکترونی یان پەیوەندیکردنتان لەگەڵ \"گۆڵدن سێسەرز\"دا لە ڕێگەی هەر کەناڵێکی فەرمییەوە، ئێوە ڕازین لەسەر ئەنجامنەدانی هیچ ڕفتارێک کە زیان بە کارگە، کڕیارەکانی، یان سەلامەتیی خزمەتگوزارییەکانی بگەیەنێت، لەوانە بۆ نموونە ئەم چالاکییە قەدەغکراوانەی خوارەوە:", "پێشکەشکردنی داواکاریی کڕینی فێڵبازانە، درۆزن یان بە مەبەستی خراپ.", "خۆپیشاندان بە کەسێکی تر یان پێشکەشکردنی زانیاریی ناتەواو دەربارەی پەیوەندیی ئێوە بە هەر کەس یان لایەنێکەوە.", "هەوڵدان بۆ دەستگەیشتنی ناتەواو بە ماڵپەڕی الکترونی، سیستەمەکانی یان هەژمارە پەیوەندیدارەکانی.", "بەکارهێنانی ماڵپەڕی الکترونی یان ناوەڕۆکەکەی بۆ هەر مەبەستێکی نایاسایی یان بە پێچەوانەی ئەم مەرجانە.", "لەبەرگرتنەوە، دەرهێنان یان دووبارە دروستکردنەوەی ناوەڕۆکی ماڵپەڕی الکترونی بۆ مەبەستی بازرگانی بێ مۆڵەت."]}, {"heading": "١٣. سنوردارکردنی بەرپرسیارێتی", "paragraphs": ["تا ئەو ڕادەیەی کە یاسای بەرکار ڕێگەی پێ دەدات، کارگەی مقص الذهبي هیچ بەرپرسیارێتییەک هەڵناگرێت بۆ هیچ زیانێکی ناڕاستەوخۆ، لابەلا یان لێبڕاو کە لە ئەنجامی بەکارهێنانی ماڵپەڕی الکترونی یان کڕینی بەرهەمەکانمانەوە دروست دەبێت، لەوانەش لەدەستدانی قازانج یان دەرفەتە بازرگانییەکان. هەروەها کارگە بەرپرسیار نییە لە دواکەوتن یان سەرکەوتنەدەبێت لە گەیاندندا کە لەلایەن کۆمپانیاکانی گەیاندن یان گواستنەوەی لایەنی سێیەمەوە دروست دەبێت، یان لە دۆخەکانی دەرەوەی دەسەڵاتی لۆژیکیی ئەوەوە (هێزی گەورە)، لەوانە بۆ نموونە کارەساتە سروشتییەکان، ئاشوبە شارستانییەکان، پەککەوتنی ڕێگاکانی گواستنەوە، یان ڕێکارە حکومییەکان."]}, {"heading": "١٤. یاسای پەیڕەوکراو و دەسەڵاتی دادوەری", "paragraphs": ["ئەم مەرجانە، و هەر ناکۆکییەک کە لێیانەوە سەرچاوە بگرێت یان پەیوەندی بە بەکارهێنانی ماڵپەڕی الکت
