دی یا کەلتووری، و ئارمانجا مە ئەوە پشکداربیت د ئێکخستنا مەرجێن جلوبەرگان کوردی یێن کەلتووری و بلندکرنا وان. کارگەه ل ژێر شێوازێ شهادەتا تۆمارکرنا ناڤێ بازرگانی ژمارە DUH 2025 3109 کار دکەت. \"گۆڵدن سێسەرز\" نووکه جلوبەرگێن کوردی یێن کەلتووری و ئیکسسوارێن وان یێن پەیوەندیدار دروست دکەت، هەم بۆ کڕیارێن تاکفڕۆشی یێن تاکەکەسی، و هەم بۆ کڕیارێن کۆمفڕۆشی / کڕینێن بازرگانی یێن ب بڕێن مەزن."]}, {"heading": "٤. مەرجێن بکارئینانا مالپەرێ و پێشکێشکرنا داخوازییان", "paragraphs": ["ب بکارئینانا ڤی ماڵپەڕێ ئەلکترۆنی یان پێشکێشکرنا هەر داخوازکا کڕینێ، هوین دان ب وێ چەندێ دن کو خودان شیاوەتا یاسایی یا پێدڤی نە بۆ ئەنجامدانا گرێبەستێن پابەندکەر ژێر یاسایێن هەرێما کوردستانا کوردستانا عێراقێ و کۆمارا عێراقێدا. پێدڤیە داخوازکاری ل سەر ناڤێ کەسەکێ نەبالغ، کۆمپانیایەکێ، یان هەر لایەنەکێ سێیەمێ دی، ژ لایێ کەسەکێ ڤە بێنە پێشکێشکملکرن کو دەستهەلاتا یاسایی بۆ وێ چەندێ هەبت. \"گۆڵدن سێسەرز\" مافێ خۆ دپارێزت، ل دیڤ لێگەران و تێڕامانا تایبەت یا خۆ، د رەتکرنا پێشکێشکرنا خزمەتگوزاریێ دا، یان رەتکرن یان هەلوەشاندنا هەر داخوازکارەکێ، یان سنوردارکرنا دەستگەهشتنێ بۆ ماڵپەڕێ ئەلکترۆنی، ژ وان ژی د دەمێ بوونا گۆمانەکا لۆژیکی د بوونا چالاکیێن فێلبازانە یان ناتەواو یان پێچەوانەی یاسایێ دا."]}, {"heading": "٥ هەژمارێن بکارئینەران", "paragraphs": ["د حالەتێ پێشکێشکرنا تایبەتمەندیا ڤەکرنا هەژمارێ یان تۆمارکرنا ناڤی ژ لایێ مالپەرا الکترونی ڤە، چ بۆ کڕیارێن تاکفڕۆشی یان کۆمفڕۆشی، هوین بەرپرسیارن ژ پاراستنا نهێنیا کلیلپەیڤێ (پاسوۆرد) و زانیاریێن ناڤتۆمارکرنێ یێن هەژمارا خۆ، و ژ هەمی ئەو چالاکیێن کو ل رێکا وێ ئەنجام ددەن. و هوین ڕازی نە ب پێشکێشکرنا زانیاریێن ڕاست و نووکی دەما دروستکرنا هەژمارێ یان نویكرنا زانیاریێن وێ.", "پێدڤییە هوین ئێکسەر مە ئاگەهدار بکەن د حالەتێ گۆمانکرنێ ب هەر چالاکییا بێ مۆهلەت یان گۆماناوی ل سەر هەژمارا خۆ.", "دەشێت \"گۆڵدن سێسەرز\" ڕاگرتن یان سنوردارکرنا گەهشتنێ بۆ هەر هەژمارەکێ بکەت د حالەتێ گۆمانا مەنتیقی ب خراپ بکارئینان، یان چالاکییا فێلبازی، یان پێچەوانەبوونا ڤان مەرجان.", "هوین دکارن داخوازا ژێبرنا هەژمارا خۆ بکەن د هەر دەمەکی دا ب رێکا پەیوەندیکرنا دگەل مە ل رێکا کەناڵێن مە یان فەرمی، و ئەم دێ ڤان داخوازییان ئەنجام ددەن ل پەی سیاسەتا تایبەتمەندییا مە."]}, {"heading": "٦. هەژمارێن کۆمفڕۆشی", "paragraphs": ["دشێت لایەنێن بازرگانی و کەسێن حەزدکەن بڕێن مەزن یان کۆم بکڕن تۆمار بکەن یان پێشکێش بکەن ب مەرەما بدەستڤەئینانا هەژمارا کڕیارێ کۆمفڕۆشی. و پێشکێشکرنا داخوازا تۆمارکرنێ یان پرسیارکرنا کۆمفڕۆشی، ب خۆ نا گەهینت مسۆگەرکرنا پەسەندکرنێ یان قەبیلکرنێ. \"گۆڵدن سێسەرز\" پێداچوونێ ب پرسیارێن کۆمفڕۆشی دکەت ل سەر بنەمایێ هه‌ر دۆسه‌يه‌كێ ب تنێ، ژ ناڤ دا بدەستڤەئینانا زانیاریێن بنەڕەتی ل سەر چالاکیا لایەنێ پێشکێشکەر، پێش تەمامکرنا هەر پەیوەندییەکا فرۆتنا کۆمفڕۆشی. و بەهایێن کۆمفڕۆشی ل سەر مالپەرا الکترونی نا هاتینە بەلاڤکرن، بەلکو تنێ دهێنە پێشکێشکڕن پاش پێداچوونا پرسیارێ و پەسەندکرنا وێ. و ئەم مافێ خۆ پارێزین د ڕەتکرنا هەر داخوازەکا تۆمارکرنێ یان داخوازا کڕینا کۆمفڕۆشی ب پەی لێڕەواندنا خۆ. و هویرکاریێن تەمام د سیاسەتا جودا یا فرۆتنا کۆمفڕۆشی یا مە دا هەنە. ئەڤجا دابەشکار و بریکار - ئەو ژی ئەو لایەنێن بازرگانی یان کەسێن کو نوینەراتیا \"گۆڵدن سێسەرز\" دکەن ب شێوەیەکێ بەردەوام - ب رێکا ڕێککەفتنەکە نڤیسکاری یا جودا دگەل کارگەهێ کار دکەن، وەک ل سیاسەتا دابەشکار و بریکاران یا مە هاتیە دیارکرن، نه برێکا هەژمارا کڕیارێ کۆمفڕۆشی یا ئاسایی."]}, {"heading": "٧. پێناسینا بەرهەمان و مسۆگەرکرنا کوالیتیێ", "paragraphs": ["ئەم بزاڤێن مەنتیقی دکەن بۆ مسۆگەرکرنا وێ چەندێ کو پێناسێن بەرهەمان، وێنێن فۆتۆگرافی، رەنگ و قەبارەیێن ل سەر مالپەرا الکترونی و ل سەر ڕوپەلا مە ل اينستگرام (@golden_scissors400) ب رەنگەکێ رێکوپێک نوینەراتیا بەرهەمێن مە بکەن. بەرهەمێن \"گۆڵدن سێسەرز\" د ناڤ هێلا چێکرنێ یا نی دا دهێنە دروستکرن، ب پشکدارییا تیمەکا تایبەتمەند ب چاڤدێریا کوالیتیێ (QC) و ڕێکار و سیاسەتێن ڕێکخستنا کوالیتیێ ب مەرەستا هێلانا ڕێژا کێماسییان ل نزمترین ئاست. و د حالەتێن دەگمەن دە کو کێماسییەک ل یەکێک ژ بەرهەمان دیار بیت، مافێ کڕیاری هەیە کو وێ بگوهرێت یان بگۆڕیت ب پەی سیاسەتا ڤەگەراندن و گوهۆڕینێ یا مە."]}, {"heading": "٨. بها و پارەدان", "paragraphs": ["هەمی بهایێن دیارکری ل سەر مالپەرا الکترونی یان یێن کو دهێنە راگەهاندن ل رێکا کەناڵێن مە یان فەرمی ب دینارێ عێراقی (IQD) نە، ئه‌گه‌ر ب ڕوونی بەروڤاژی وێ بهێتە گوتن. بها د بوارێ گۆهۆڕینێ ددان د هەر دەمەکی دا و ب بێ ئاگەهداریا پێشتر، ژ ئەنجامێ گۆهۆڕینێن بهایێن ماددەیان یان بهایێن چێکرنێ یان رەوشا بازاڕی.", "و ئەو بهایێ کارپێکری یە ل دەمێ پشتراستکرنا وێ داخوازیێ ل سەر داخوازیێ جێبەجێ بیت. رێکێن پارەدانێ یێن پەسەندکری و مەرجێن پارەدانێ یێن پەیوەندیدار ل سیاسەتا پارەدانێ یا جودا یا مە هەنە، یا کو دبیت ئەڤە ژدەم بۆ دەمەکێ نی بکەین دگەل پەیدابوونا رێکێن نوی یێن پارەدانێ یان گۆهۆڕینا رێکێن نوکە.", "د حالەتێ هەلوەشاندنا هەر داخوازییەکێ پێش هنارتنا وێ، هەر پڕۆسەیەکا ڤەگەراندنا پارەی دێ ل پەی سیاسەتا ڤەگەراندن و گوهۆڕینێ یا مە جیبەجێ بیت."]}, {"heading": "٩.بکرێن نیڤدەولەتی", "paragraphs": ["\"گۆڵدن سێسەرز\" پێشوازییێ ل داخوازییێن ژ دەرڤەی عێراقێ دکەت. و بۆ داخوازییێن ناڤدەولەتی، لپەی بهایێن هنارتنێ و ماوێ گەهاندنێ ل گورەی دەولەتا ئارمانج و کۆمپانییا هنارتنێ یا بکارهاتی جودا بن، و هەماهەنگی ل سەر کڕیارێ دهێتە کرن پاش پشتراستکرنا داخوازیێ. هەروەسا کڕیارێن ناڤدەولەتی بەرپرسیارن ژ هەر باجێن گۆمرکی، باجێن ئینانێ یان هەر باجێن دی یێن کو دەولەتا وان د سەپینت."]}, {"heading": "١٠. داخوازی و پشتراستکرنا داخوازیێ", "paragraphs": ["پێشکێشکرنا داخوازا کڕینێ ل رێکا مالپەرا الکترونی، واتساب، اینستگرام، و هنارتن و ورکاریێن داخوازییا هەوە بۆ مە ل رێکا هەر ئێك ژ ڤان کەناڵان، بڕیارا هەوەیا کڕینێ نیشان ددەت و داخوازیەکێ ل دەڤ \"گۆڵدن سێسەرز\" دروست دکەت. و ل پەی سروشتێ داخوازیێ، تیما مە ڕاستەوخۆ دەست پێ بکەت ب ئامادەکرنا وێ، یان بەری هەر شتەک ێ هوورکاری وەک پەیدابوونا بەرهەمی، بهایێن و زانیاریێن گەهاندنێ دگەل هەوە پشکێن بکن - و ئەڤە ل پەی لێڕەواندنا مە ل سەر هەر داخوازییەکێ ب تنێ دهێتە کرن، و ئەڤە کارتێکرنێ ل سەر دروستییا داخوازییا هەوە ناکەت. ئەم مافێ خۆ پارێزین ب ڕەتکرن یان هەلوەشاندنا هەر داخوازیەکێ، ژ ناڤ دا د حالەتێن نەپەیدابوونا کۆگەهێ، خەلەتییێن پارەدانێ ، یان گۆمانا فێلبازیێ، و ئەم دێ هەوە ئاگەهدار کەین ل رێکا واتساب یان اینستگرام د حالەتێ ڕوودانا وێ چەندێ.", "پێشکێشکرنا داخوازا کڕینێ ل رێکا مالپەرا الکترونی، واتساب، اینستگرام - و ئەڤە بڕیارا هەوەیا پێشکێشکرنا داخوازیێ نیشان ددەت.", "تیمما مە، ل پەی سروشتێ داخوازیێ، پێداچوونێ ب پەیدابوونا بەرهەمی، بهایان و هوورکاریێن گەهاندنێ دگەل هەوە بکەت، یان دەست پێ بکەت ب ئامادەکرنا داخوازیێ ڕاستەوخۆ.", "ئەم مافێ خۆ پارێزین ب ڕەتکرن یان هەلوەشاندنا هەر داخوازییەکێ د حالەتێن وەک نەپەیدابوونا کۆگەهێ، خەلەتییێن پارەدانێ ، یان گۆمانا فێلبازیێ، و ئەم دێ هەوە ئاگەهدار بکەین د حالەتێ ڕوودانا وێ چەندێ.", "و ل پەی جهێ هەوە، هوین دشێن وەرگرتنا داخوازییا خۆ هەڵبژێرن ل رێکا کۆمپانییەکا گەهاندنێ یا خۆمالی، شوفێرێ کارگەهێ، یان وەرگرتنا وێ ب خۆ ژ کارگەهێ - و هویرکاریێن تەمام ل سیاسەتا هنارتن و گەهاندنێ یا مە هەنە."]}, {"heading": "١١. خودانتییا هزری", "paragraphs": ["هەمی پێکهاتێن خودانتییا هزری یێن دیار ل سەر مالپەرا الکترونی و ل سەر کەناڵێن مە یێن فەرمی - ژ ناڤ دا ناڤێ مارکەیا \"گۆڵدن سێسەرز\"، لۆگۆ، وێنێن فۆتۆگرافی یێن بەرهەمان، دیزاین، و ناڤەرۆکا نڤیسکاری - پشکێن تایبەتن ب کارگەها مەقاسا زێری و پاراستینە ل پەی قانوونا بەرکار. هویرکاریێن تەمام یێن مافێن خودانتییا هزری یێن مە و سنۆرێن بکارئینانا ڕێپێدکری یێن ناڤەرۆکا مە ل ئاگەهداریا مافێ چاپکرنێ یا جودا یا مە هەنە، یا کو پشکەک نەڤەقەتییە ژ ڤان مەرجان ب رێکا ئاماژەپێکرنا وێ."]}, {"heading": "١٢. رەفتارا بکارئینەری", "paragraphs": ["دەما بکارئینانا هەوە یا مالپەرا الکترونی یان پەیوەندیکرنا هەوە دگەل \"گۆڵدن سێسەرز\" ل رێکا هەر کەناڵەکا فەرمی، هوین ڕازی نە ب نەکرنا چ ڕەفتارەکێ کو زیانێ بگەهینت کارگەهێ، یان کڕیارێن وێ، یان سلامەتییا خزمەتگوزاریێن وێ، ژ ناڤ دا بۆ نموونە چالاکیێن قەدەغەکری یێن ل خوارێ:", "پێشکێشکرنا داخوازییێن کڕینێ یێن فێلباز، نەراست، یان ب مەرەمەکا خراب.", "خۆدیارکرن ب کەسەکە دی یان پێشکێشکرنا زانیاریێن نەڕاست دەربارەی پەیوەندییا هەوە ب هەر کەسەکێ یان لایەنەکی ڤە.", "هەولدانا گەهشتنا بێ مۆهلەت بۆ مالپەرا الکترونی یان سیستەمێن وێ یان هەژمارێن پەیوەندیدار.", "بکارئینانا مالپەرا الکترونی یان ناڤەرۆکا وێ بۆ هەر مەبەستەکە نەقانوونی یان پێچەوانەی ڤان مەرجان.", "کۆپیکرن، دەرئێخستن، یان دووبارە دروستکرنا ناڤەرۆکا مالپەرا الکترونی بۆ مەبەستێن بازرگانی ب بێ مۆهلەت."]}, {"heading": "١٣. سنوردارکرنا بەرپرسیاریێ", "paragraphs": ["هەتا وێ رادەیا قانوونا بەرکار ڕێپێدەت، کارگەها مەقاسا زێری چ بەرپرسیاریێ نا ڤەگەرینتە خۆ بۆ چ زیانێن نەڕاست، لاوەکی یان پێدڤی یێن ژ بکارئینانا مالپەرا الکترونی یان کڕینا بەرهەمێن مە پەیدا دبن، دەستدانا قازانجان یان دەرفەتێن بازرگانی. هەروەسا کارگەه بەرپرسیار نینە ژ پاشکەفتن یان بێسەرکەفتنێ د گەهاندنێ دا یێن ژ کۆمپانییێن گەهاندنێ یان ڤەگوهاستنێ یێن لایەنێن سێیەم چێدبن، یان ژ رەوشێن دەرڤەی دەسهەڵاتا وێ یا مەنتیقی (هێزا مەزن)، ژ ناڤ دا بۆ نموونە کارەساتێن سروشتی، ئاشۆبێن شارستانی، پەککەفتنا رێکێن ڤەگوهاستنێ، یان ڕێکارێن حکومی."]}, {"heading": "١٤. یاسایا بکارئینران و دەستهەڵاتا دادوەری", "paragraphs": ["ئەڤ مەرجە، و هەر ناکۆکییەکا ژ وان پەیدا دبن یان پەیوەندی ب وان هەی یان بکارئینانا مالپەرا الکترونی یان کڕینا بەرهەمان، دکەڤنە ژێر قانوونێن هەرێما کوردستانا عێراقێ و جۆمهۆریا عێراقێ، و ب پەی وان دهێنە ڤه‌گوهاستن. و د حالەتێ نەشیا ڕێککەفتنێ ل سەر چ ناکۆکییەکێ ب ئاشتی، دادگەهێن مەجبوور ل دهۆکێ، هەرێما کوردستانا عێراقێ، خودان دەستهەڵاتداریا دادوەری یا بێژەنگ دبن بۆ ئێکلاکرنا وێ."]}, {"heading": "١٦. گۆهۆڕینا ڤان مەرجان و پەیوەندیکرنا ب مە", "paragraphs": ["\"گۆڵدن سێسەرز\" مافێ خۆ پارێزت د گۆهۆڕین، نویكرن یان جێگرکرنا ڤان مەرجان د هەر دەمەکی دا و ب پەی لێڕەواندنا خۆ یا خۆیی. و کۆپیا نووکی دێ ل سەر مالپەرا الکترونی هێتە بلاڤکرن دگەل رووژا نفاذێ یا نووکرن، و بەردەوامبوونا هۆ ل بکارئینانا مالپەرا الکترونی یان پێشکێشکرنا داخوازییان پاش ئەنجامدانا ڤان گۆهۆڕینان ب خۆ ڕازیبوونەکە ژ لایێ هەوە ڤە بۆ مەرجێن گۆهۆڕکری.", "بۆ هەر پرسیار یان تێبینییەکێ دەربارەی ئەڤ پۆلیسییا زڤڕاندن و ڤەگەڕاندنا پارەی یان داخوازییا زڤڕاندن، گوهۆڕین، یان ڤەگەڕاندنا پارەی، هیڤییە ب رێیا کەناڵێن مە یێن فەرمی پەیوەندیێ ب مە بکەن: وەتسئەپ ل سەر ژمارا 9647504006200+ (wa.me/9647504006200)، یان ب رێیا ئینستاگرامی ل سەر ئەکاونتێ golden_scissors400@، یان ب رێیا ئیمەیلی ل سەر goldenscissors400@gmail.com. هەروەسا هویرکارییێن تەمام یێن پەیوەندیێ د پۆلیسییا پەیوەندیکردن و پشتەڤانیێ یا مە دا هاتینە"]}]}, "GS-POL-02": {"id": "GS-POL-02", "docControlEn": "", "docControlAr": "", "titleEn": "Privacy Policy", "titleAr": "سياسة الخصوصية", "titleKuSor": "سیاسەتی تایبەتمەندی", "titleKuBad": "سیاسەتا تایبەتمەندیێ", "introEn": "This Privacy Policy explains how Golden Scissors Factory, trading as \"Golden Scissors\" (\"we,\" \"us,\" \"our,\" or \"the Factory\"), collects, uses, shares, and protects personal data in connection with the gscissors.com website and our official WhatsApp and Instagram channels. This Policy applies to website visitors, Retail Customers, Wholesale Customers, Distributors, Agents, and anyone who submits an account, registration, or wholesale inquiry to us. By using the Website or interacting with us through an official channel, you acknowledge that you have read and understood this Policy.", "introAr": "توضح سياسة الخصوصية هذه كيفية قيام مصنع مقص الذهبي، الذي يتعامل تجارياً باسم \"غولدن سيزرز\" (Golden Scissors) (ويُشار إليه فيما يلي بـ \"نحن\" أو \"المصنع\")، بجمع البيانات الشخصية واستخدامها ومشاركتها وحمايتها فيما يتعلق بموقع gscissors.com الإلكتروني وقنواتنا الرسمية على واتساب وإنستغرام. تنطبق هذه السياسة على زوار الموقع الإلكتروني، وعملاء التجزئة، وعملاء الجملة، والموزّعين، والوكلاء، وأي شخص يقدّم طلب تسجيل حساب أو استفسار جملة إلينا. إن استخدامكم للموقع الإلكتروني أو تواصلكم معنا عبر أي قناة رسمية يُعد إقراراً منكم بأنكم قد قرأتم هذه السياسة وفهمتموها.", "introKuSor": "ئەم سیاسەتی تایبەتمەندییە ڕوونی دەكاتەوە کە چۆن کارگەی مەقەسی زێڕین، کە بە ناوی بازرگانیی \"گۆڵدن سێسەرز\" (Golden Scissors) کار دەکات (و لێرە بە دواوە بە \"مە\" یان \"کارگە\" ناودەبرێت)، داتای کەسایەتی کۆدەکاتەوە، بەکاریدەهێنێت، بڵاودەکاتەوە و دەیپارێزێت سەبارەت بە ماڵپەڕی ئەلیکترونی gscissors.com و کەناڵە فەرمییەکانمان لە واتسئەپ و ئینستاگرام. ئەم سیاسەتە سەردانیکەرانی ماڵپەڕ، میوانانی تاکفڕۆشی، میوانانی کۆمفڕۆشی، دابەشکاران، بریکاران، و هەر کەسێک کە داوای تۆمارکردنی هەژمارێک بکات یان پرسیارێکی بازرگانی پێشکەش بە مە بکات، دەگرێتەوە. بەکارهێنانی تۆ بۆ ماڵپەڕ یان پەیوەندیکردنت بە مەوە لە ڕێگەی هەر کەناڵێکی فەرمییەوە بە مانای دانپێداندان دێت کە ئەم سیاسەتەت خوێندووەتەوە و تێگەیشتوویەتی.", "introKuBad": "ئەڤ سیاسەتا تایبەتمەندیێ ڕوون دکەت کو کارگەها مەقەسا زێری، یا کو ب ناڤێ بازرگانی یێ \"گۆڵدن سێسەرز\" (Golden Scissors) مامەڵەی دکەت (و ل ڤێرە پێڤە ب \"مە\" یان \"کارگە\" ئاماژەدەت)، چەوا داتایێن کەسایەتی کۆم دکەت، بکار دئینت، بەلاڤ دکەت و پارێزێت سەبارەت ب ماڵپەڕێ ئەلکترونیی gscissors.com و کەناڵێن مە یێن فەرمی ل واتسئەپ و ئینستاگرام. ئەڤ سیاسەتە سەر سەرەدانکەرێن ماڵپەڕی، بکرێن تاکفڕۆشی، بکرێن کۆمفڕۆشی، دابەشکار، بریکار، و هەر کەسەکی دهێتە جێبەجێکرن یێ کو داخوازا تۆمارکرنا هژمارەکێ یان پرسیارا کۆم دکەت بۆ مە. بکارئینانا هەوە بۆ ماڵپەڕی یان پەیوەندیکرنا هەوە ب مە ڤە ل رێکا هەر کەناڵەکا فەرمی ب رامانا دانپێدانێ دهێت کو هەوە ئەڤ سیاسەتە خواندییە و تێگەهشتییە.", "sectionsEn": [{"heading": "1. Introduction and Purpose", "paragraphs": ["Golden Scissors respects your privacy and is committed to protecting the personal data of everyone who interacts with our Website and official channels — whether you are simply browsing, placing a retail order, registering as a Wholesale Customer, or operating as a Distributor or Agent. This Privacy Policy sets out, in plain language, what personal data we collect, why we collect it, how we use and share it, and the rights you have over it."]}, {"heading": "2. Scope of This Policy", "paragraphs": ["This Policy applies wherever Golden Scissors collects or processes personal data in connection with the Website or our official WhatsApp and Instagram channels. It should be read together with our Terms & Conditions and any other policy referenced within it. This Policy applies to:", "Website visitors.", "Retail Customers.", "Wholesale Customers.", "Distributors.", "Agents.", "Anyone who submits an account registration, wholesale registration, or a distributor or agent inquiry."]}, {"heading": "3. Personal Data We Collect", "paragraphs": ["We may collect the following types of personal data, depending on how you interact with us:", "Personal identification data: your name, and, where provided, date of birth or similar identifying details.", "Contact data: phone number, email address, delivery address, and your social media handle where you contact us via Instagram or WhatsApp.", "Account data: username, password (stored securely), account preferences, and communication history, where the Website offers account registration.", "Order data: products ordered, order value, order history, delivery preferences, and related notes.", "Payment data: we do not store your card details ourselves; card payments are processed directly by our payment service provider, and we only receive confirmation of payment status and a reference number.", "Shipping data: delivery address, recipient name and phone number, and any information required by the delivery company or courier to complete delivery.", "Business data for Wholesale Customers, Distributors, and Agents: business name, business activity, estimated order volumes, and other information relevant to assessing or managing a wholesale, distributor, or agent relationship.", "Verification documents: where required to confirm a business's identity or activity for wholesale, distributor, or agent purposes, such as a trade license, registration certificate, or similar document.", "Technical data: IP address, browser type and version, device information, cookies and similar technologies, and usage data such as pages visited and time spent on the Website."]}, {"heading": "4. How We Use Your Data", "paragraphs": ["We use personal data for the following purposes:", "Creating and managing your Account.", "Processing and fulfilling your Orders.", "Providing our products and services to you.", "Verifying the eligibility and legitimacy of Wholesale Customers.", "Managing Distributor and Agent relationships and accounts.", "Improving your experience on the Website.", "Improving the performance, security, and functionality of the Website.", "Communicating with you about your Account, Orders, or inquiries.", "Sending order-related notifications, such as confirmation, dispatch, and delivery updates.", "Complying with applicable legal, regulatory, or governmental requirements.", "Preventing fraud and other unlawful or unauthorized activity.", "Protecting the security of the Website and our systems."]}, {"heading": "5. Legal Basis for Processing", "paragraphs": ["Although this is not currently a specific requirement under Iraqi law, we set out below, in line with international best practice, the legal bases on which we process your personal data. We process personal data on one or more of the following bases:", "Performance of a contract: to process and fulfil your Order, provide the products or services you requested, or manage your Wholesale, Distributor, or Agent relationship with us.", "Compliance with a legal obligation: to meet applicable legal, tax, customs, or regulatory requirements.", "Legitimate interests: to protect the security of the Website and our systems, prevent fraud, and improve our products and services, provided this does not override your fundamental rights and interests.", "Your consent: where we specifically ask for it, such as for certain marketing communications or optional cookies; you may withdraw this consent at any time, as described in Section 10 (Your Rights)."]}, {"heading": "6. Data Sharing and Disclosure", "paragraphs": ["We do not sell your personal data. We may share personal data with the following categories of third parties, only to the extent necessary for the purposes described in this Policy. We work with reputable, approved providers in each category; if we change a specific provider, this Policy remains accurate, as any new provider continues to operate within the same categories of service described below:", "Delivery and courier companies, to complete the shipment of your Order, as further described in our Shipping & Delivery Policy.", "Payment service providers, to process payments securely.", "Hosting and infrastructure providers, to operate and store the Website and its data.", "Technical service providers, such as content delivery and security services (for example, Cloudflare), to keep the Website fast, available, and secure."]}, {"heading": "7. Data Security", "paragraphs": ["We take reasonable technical and organizational measures to protect personal data against unauthorized access, loss, misuse, or disclosure. While we work to protect your personal data, no method of transmission or storage is completely secure, and we cannot guarantee absolute security. Examples of the general measures we apply include:", "Encrypting data where appropriate during transmission, for example when it is submitted through the Website.", "Restricting access to personal data to authorized personnel who need it to perform their role (access control).", "Reviewing our security measures periodically to keep them appropriate to the risks involved.", "Maintaining backups of important data where appropriate, to protect against accidental loss."]}, {"heading": "8. International Data Transfers", "paragraphs": ["Golden Scissors serves customers both within Iraq and internationally. As a result, some personal data may be processed, transmitted, or stored by service providers located outside Iraq, including hosting providers, payment service providers, and technical or security service providers. Where this occurs, we take reasonable steps to ensure that such service providers apply an appropriate level of protection to your personal data, consistent with this Policy."]}, {"heading": "9. Data Retention", "paragraphs": ["We retain personal data only for as long as necessary to fulfill the purposes described in this Policy, including any legal, accounting, or regulatory requirements. When personal data is no longer needed for these purposes, we take reasonable steps to delete or anonymize it."]}, {"heading": "10. Your Rights", "paragraphs": ["Subject to applicable law, you have the right to:", "Access the personal data we hold about you.", "Request correction of inaccurate personal data.", "Request that we update your personal data.", "Request deletion of your personal data, where this is legally possible and does not conflict with a legal or legitimate business requirement (for example, order or accounting records) — see Section 11 (Account Deactivation and Deletion) for further details.", "Withdraw your consent, where our processing of your data is based on consent, without affecting the lawfulness of processing carried out before withdrawal."]}, {"heading": "11. Account Deactivation and Deletion", "paragraphs": ["When you ask us to deactivate or delete your Account, we will delete or anonymize the personal data that is no longer required for a legal, accounting, or legitimate business purpose. Some data may still need to be retained for a limited period even after deactivation, where this is required by law or for legitimate business records, consistent with Section 9 (Data Retention).", "Data typically deleted or anonymized upon request: your account profile, login credentials, saved preferences, and account activity history.", "Data that may be retained for a limited period: order and invoice records, payment confirmation references, and any records required for tax, accounting, or other legal or regulatory purposes."]}, {"heading": "12. Cookies", "paragraphs": ["The Website uses cookies and similar technologies to operate correctly, remember your preferences, and understand how visitors use the Website.", "You can control or disable cookies through your browser settings; please note that disabling certain cookies may affect the functionality of the Website. Full details on the types of cookies we use and how to manage them are set out in our separate Cookie Policy.", "Essential cookies, which are necessary for the Website to function properly.", "Functional or preference cookies, which remember choices you make, such as language.", "Analytics or performance cookies, which help us understand how the Website is used so that we can improve it.", "Marketing or advertising cookies, which we may use in the future — for example, together with tools such as Google Analytics or the Meta Pixel — to measure the effectiveness of our marketing and tailor content to your interests; we will update this section and our Cookie Policy before any such cookies are used."]}, {"heading": "13. Third-Party Services", "paragraphs": ["The Website may rely on third-party service providers to operate securely, effectively, and to support our growing business.", "Golden Scissors may add, change, or replace any of these service providers from time to time as our business needs evolve; where we do so, the new provider continues to operate within the same categories of service described below, and this Policy does not need to be amended solely because a specific provider has changed. Depending on the service in question, these categories may include, without limitation:", "Payment gateways and payment service providers, as set out in our Payment Policy.", "Shipping and courier companies, as set out in our Shipping & Delivery Policy.", "Content delivery and security services, such as Cloudflare.", "Hosting and infrastructure providers.", "Website analytics and statistics tools, to help us understand and improve Website performance.", "Email delivery services, to send account, order, and notification emails.", "Marketing tools, where used, to communicate with customers about our products and promotions."]}, {"heading": "14. Children's Privacy", "paragraphs": ["Our Website and products are intended for use by adults capable of entering into binding contracts under applicable law, as set out in our Terms & Conditions. We do not knowingly collect personal data from children. If we become aware that we have collected personal data from a child without appropriate consent, we will take reasonable steps to delete that data."]}, {"heading": "15. Policy Updates", "paragraphs": ["We may update this Privacy Policy from time to time to reflect changes in our practices, our services, or applicable law. Any update will be posted on the Website with a revised \"Last Updated\" date. Where a change is material, we will take reasonable steps to bring it to your attention through our official channels prior to, or at the time of, the change taking effect."]}, {"heading": "16. Contact Us", "paragraphs": ["For any questions, concerns, or requests regarding this Privacy Policy or your personal data, please contact us through our official channels: WhatsApp +964 750 400 6200 (wa.me/9647504006200), Instagram @golden_scissors400, or email goldenscissors400@gmail.com. Full contact details are also set out in our Contact & Support Policy."]}], "sectionsAr": [{"heading": "١. المقدمة والغرض من السياسة", "paragraphs": ["تحترم \"غولدن سيزرز\" خصوصيتكم وتلتزم بحماية البيانات الشخصية لكل من يتعامل مع موقعنا الإلكتروني وقنواتنا الرسمية - سواء كنتم مجرد زائرين للموقع، أو تقدّمون طلب شراء بالتجزئة، أو تسجّلون كعميل جملة، أو تعملون كموزّع أو وكيل. وتوضح سياسة الخصوصية هذه، بلغة واضحة ومبسّطة، ما هي البيانات الشخصية التي نجمعها، ولماذا نجمعها، وكيف نستخدمها ونشاركها، والحقوق التي تملكونها عليها."]}, {"heading": "٢. نطاق تطبيق هذه السياسة", "paragraphs": ["تنطبق هذه السياسة في كل الحالات التي تقوم فيها \"غولدن سيزرز\" بجمع أو معالجة بيانات شخصية فيما يتعلق بالموقع الإلكتروني أو قنواتنا الرسمية على واتساب وإنستغرام، ويجب قراءتها إلى جانب الشروط والأحكام الخاصة بنا وأي سياسة أخرى مُشار إليها فيها. تنطبق هذه السياسة على:", "زوار الموقع الإلكتروني.", "عملاء التجزئة.", "عملاء الجملة.", "الموزّعون.", "الوكلاء.", "أي شخص يقدّم طلب تسجيل حساب، أو تسجيل جملة، أو استفسار عن التوزيع أو الوكالة."]}, {"heading": "٣. البيانات الشخصية التي نجمعها", "paragraphs": ["قد نجمع الأنواع التالية من البيانات، بحسب طبيعة تعاملكم معنا:", "بيانات تعريف شخصية: الاسم، وحيثما تُقدَّم، تاريخ الميلاد أو أي بيانات تعريفية مماثلة.", "بيانات الاتصال: رقم الهاتف، والبريد الإلكتروني، وعنوان التوصيل، وحساب التواصل الاجتماعي في حال تواصلكم معنا عبر إنستغرام أو واتساب.", "بيانات الحساب: اسم المستخدم، وكلمة المرور (المخزَّنة بشكل آمن)، وتفضيلات الحساب، وسجل التواصل، حيثما يوفّر الموقع الإلكتروني خاصية إنشاء حساب.", "بيانات الطلبات: المنتجات المطلوبة، وقيمة الطلب، وسجل الطلبات، وتفضيلات التوصيل، والملاحظات ذات الصلة.", "بيانات الدفع: لا نقوم بتخزين بيانات بطاقتكم لدينا؛ فعمليات الدفع بالبطاقة تتم معالجتها مباشرة من قبل مزوّد خدمات الدفع الخاص بنا، ونحصل فقط على تأكيد حالة الدفع ورقم مرجعي له.", "بيانات الشحن: عنوان التوصيل، واسم ورقم هاتف المستلم، وأي معلومات تطلبها شركة التوصيل أو مندوب الشحن لإتمام عملية التسليم.", "بيانات النشاط التجاري لعملاء الجملة والموزّعين والوكلاء: اسم النشاط التجاري، ونوع النشاط، والكميات التقديرية للطلبات، وأي معلومات أخرى ذات صلة بتقييم أو إدارة علاقة الجملة أو التوزيع أو الوكالة.", "مستندات التحقق: حيثما يلزم التحقق من هوية أو نشاط جهة تجارية لأغراض الجملة أو التوزيع أو الوكالة، مثل رخصة النشاط التجاري أو شهادة التسجيل أو ما يماثلها.", "البيانات التقنية: عنوان IP، ونوع المتصفح وإصداره، ومعلومات الجهاز، وملفات تعريف الارتباط (Cookies) والتقنيات المماثلة، وبيانات الاستخدام مثل الصفحات التي تمت زيارتها والوقت المستغرق على الموقع الإلكتروني."]}, {"heading": "٤. الغرض من استخدام بياناتكم", "paragraphs": ["نستخدم البيانات الشخصية للأغراض التالية:", "إنشاء حسابكم وإدارته.", "معالجة طلباتكم وتنفيذها.", "تقديم منتجاتنا وخدماتنا لكم.", "التحقق من أهلية عملاء الجملة ومشروعية نشاطهم التجاري.", "إدارة علاقات وحسابات الموزّعين والوكلاء.", "تحسين تجربتكم على الموقع الإلكتروني.", "تحسين أداء الموقع الإلكتروني وأمانه ووظائفه.", "التواصل معكم بخصوص حسابكم أو طلباتكم أو استفساراتكم.", "إرسال الإشعارات المتعلقة بالطلبات، مثل التأكيد، والشحن، وتحديثات التوصيل.", "الامتثال للمتطلبات القانونية أو التنظيمية أو الحكومية المعمول بها.", "منع الاحتيال وأي نشاط غير قانوني أو غير مصرح به.", "حماية أمن الموقع الإلكتروني وأنظمتنا."]}, {"heading": "٥. الأساس القانوني لمعالجة البيانات", "paragraphs": ["على الرغم من أن هذا الأمر لا يشكّل حالياً متطلباً محدداً بموجب القانون العراقي، فإننا نوضح أدناه، تماشياً مع أفضل الممارسات الدولية، الأسس القانونية التي نعتمد عليها في معالجة بياناتكم الشخصية. فنحن نعالج البيانات الشخصية استناداً إلى واحد أو أكثر من الأسس التالية:", "تنفيذ العقد: لمعالجة طلبكم وتنفيذه، أو تقديم المنتجات أو الخدمات التي طلبتموها، أو إدارة علاقتكم كعميل جملة أو موزّع أو وكيل معنا.", "الامتثال لالتزام قانوني: للوفاء بالمتطلبات القانونية أو الضريبية أو الجمركية أو التنظيمية المعمول بها.", "المصالح المشروعة: لحماية أمن الموقع الإلكتروني وأنظمتنا، ومنع الاحتيال، وتحسين منتجاتنا وخدماتنا، شريطة ألا يطغى ذلك على حقوقكم ومصالحكم الأساسية.", "موافقتكم: في الحالات التي نطلب فيها موافقتكم تحديداً، مثل بعض الاتصالات التسويقية أو ملفات تعريف الارتباط الاختيارية؛ ويمكنكم سحب هذه الموافقة في أي وقت، على النحو الموضح في القسم رقم ١٠ (حقوقكم)."]}, {"heading": "٦. مشاركة البيانات والإفشاء", "paragraphs": ["لا نقوم ببيع بياناتكم الشخصية. وقد نشارك البيانات الشخصية مع الفئات التالية من الأطراف الثالثة، وفقط بالقدر اللازم للأغراض الموضحة في هذه السياسة. ونحن نتعامل مع مزوّدين معتمدين وموثوقين ضمن كل فئة؛ وفي حال تغييرنا لمزوّد معين، تبقى هذه السياسة دقيقة، إذ يستمر أي مزوّد جديد بالعمل ضمن ذات فئات الخدمة الموضحة أدناه:", "شركات التوصيل والشحن، لإتمام تسليم طلبكم، على النحو الموضح في سياسة الشحن والتوصيل الخاصة بنا.", "مزوّدي خدمات الدفع، لمعالجة عمليات الدفع بشكل آمن.", "مزوّدي خدمات الاستضافة والبنية التحتية، لتشغيل الموقع الإلكتروني وتخزين بياناته.", "مزوّدي الخدمات التقنية، مثل خدمات توصيل المحتوى والأمان (مثل Cloudflare)، للحفاظ على سرعة الموقع الإلكتروني وتوفره وأمانه."]}, {"heading": "٧. أمن المعلومات", "paragraphs": ["نتخذ تدابير تقنية وتنظيمية معقولة لحماية البيانات الشخصية من الوصول غير المصرح به، أو الفقدان، أو سوء الاستخدام، أو الإفشاء. وعلى الرغم من جهودنا لحماية بياناتكم الشخصية، لا توجد وسيلة نقل أو تخزين آمنة بشكل مطلق، ولا يمكننا ضمان الأمان الكامل. ومن أمثلة التدابير العامة التي نطبّقها:", "تشفير البيانات حيثما كان ذلك مناسباً أثناء نقلها، على سبيل المثال عند إرسالها عبر الموقع الإلكتروني.", "تقييد الوصول إلى البيانات الشخصية على الموظفين المخوَّلين الذين يحتاجونها لأداء مهامهم (التحكم بالصلاحيات).", "مراجعة إجراءاتنا الأمنية بشكل دوري للحفاظ على ملاءمتها للمخاطر القائمة.", "الاحتفاظ بنسخ احتياطية (Backup) للبيانات المهمة حيثما كان ذلك مناسباً، للحماية من الفقدان العرضي."]}, {"heading": "٨. نقل البيانات دولياً", "paragraphs": ["تخدم \"غولدن سيزرز\" عملاء داخل العراق وخارجه على حد سواء. ونتيجة لذلك، قد تتم معالجة بعض البيانات الشخصية أو نقلها أو تخزينها من قبل مزوّدي خدمات موجودين خارج العراق، بما في ذلك مزوّدي خدمات الاستضافة، ومزوّدي خدمات الدفع، ومزوّدي الخدمات التقنية أو الأمنية. وفي هذه الحالات، نتخذ خطوات معقولة للتأكد من أن مزوّدي الخدمات هؤلاء يطبّقون مستوى مناسباً من الحماية لبياناتكم الشخصية، بما يتوافق مع هذه السياسة."]}, {"heading": "٩. الاحتفاظ بالبيانات", "paragraphs": ["نحتفظ بالبيانات الشخصية فقط للمدة اللازمة لتحقيق الأغراض الموضحة في هذه السياسة، بما في ذلك أي متطلبات قانونية أو محاسبية أو تنظيمية. وعندما لا تعود البيانات الشخصية ضرورية لهذه الأغراض، نتخذ خطوات معقولة لحذفها أو إخفاء هويتها."]}, {"heading": "١٠. حقوقكم", "paragraphs": ["مع مراعاة القانون المعمول به، لكم الحق في:", "الاطلاع على البيانات الشخصية التي نحتفظ بها بخصوصكم.", "طلب تصحيح البيانات الشخصية غير الدقيقة.", "طلب تحديث بياناتكم الشخصية.", "طلب حذف بياناتكم الشخصية، متى كان ذلك ممكناً قانونياً ولا يتعارض مع أي متطلب قانوني أو تجاري مشروع (مثل سجلات الطلبات أو السجلات المحاسبية) - انظر القسم رقم ١١ (إلغاء تفعيل الحساب وحذفه) لمزيد من التفاصيل.", "سحب موافقتكم، في الحالات التي تكون معالجتنا لبياناتكم قائمة على أساس تلك الموافقة، دون أن يؤثر ذلك على مشروعية المعالجة التي تمت قبل السحب."]}, {"heading": "١١. إلغاء تفعيل الحساب وحذفه", "paragraphs": ["عند طلبكم إلغاء تفعيل حسابكم أو حذفه، سنقوم بحذف أو إخفاء هوية البيانات الشخصية غير اللازمة لأي غرض قانوني أو محاسبي أو تجاري مشروع. وقد يستلزم الأمر الاحتفاظ ببعض البيانات لمدة محدودة حتى بعد إلغاء التفعيل، متى كان ذلك مطلوباً بموجب القانون أو لأغراض السجلات التجارية المشروعة، بما يتوافق مع القسم رقم ٩ (الاحتفاظ بالبيانات).", "البيانات التي يتم حذفها أو إخفاء هويتها عادة عند الطلب: ملفكم الشخصي في الحساب، وبيانات تسجيل الدخول، والتفضيلات المحفوظة، وسجل نشاط الحساب.", "البيانات التي قد يتم الاحتفاظ بها لمدة محدودة: سجلات الطلبات والفواتير، والمراجع الخاصة بتأكيد الدفع، وأي سجلات مطلوبة لأغراض ضريبية أو محاسبية أو قانونية أو تنظيمية أخرى."]}, {"heading": "١٢. ملفات تعريف الارتباط (Cookies)", "paragraphs": ["يستخدم الموقع الإلكتروني ملفات تعريف الارتباط (Cookies) والتقنيات المماثلة لضمان عمله بشكل صحيح، وتذكّر تفضيلاتكم، وفهم كيفية استخدام الزوار للموقع.", "يمكنكم التحكم في ملفات تعريف الارتباط أو تعطيلها من خلال إعدادات متصفحكم؛ يُرجى ملاحظة أن تعطيل بعض ملفات تعريف الارتباط قد يؤثر على وظائف الموقع الإلكتروني. وترد التفاصيل الكاملة حول أنواع ملفات تعريف الارتباط التي نستخدمها وكيفية إدارتها في سياسة ملفات تعريف الارتباط (Cookie Policy) المنفصلة الخاصة بنا.", "ملفات تعريف الارتباط الأساسية، وهي ضرورية لعمل الموقع الإلكتروني بشكل صحيح.", "ملفات تعريف الارتباط الوظيفية أو التفضيلية، التي تتذكر اختياراتكم، مثل اللغة.", "ملفات تعريف الارتباط التحليلية أو الخاصة بالأداء، التي تساعدنا على فهم كيفية استخدام الموقع الإلكتروني لتحسينه.", "ملفات تعريف الارتباط التسويقية أو الإعلانية، التي قد نستخدمها مستقبلاً - على سبيل المثال بالتزامن مع أدوات مثل Google Analytics أو Meta Pixel - لقياس فعالية أنشطتنا التسويقية وتخصيص المحتوى وفق اهتماماتكم؛ وسنقوم بتحديث هذا القسم وسياسة ملفات تعريف الارتباط الخاصة بنا قبل استخدام أي من هذه الملفات."]}, {"heading": "١٣. الخدمات والأطراف الخارجية", "paragraphs": ["قد يعتمد الموقع الإلكتروني على مزوّدي خدمات من أطراف خارجية لضمان تشغيله بأمان وفعالية، ولدعم نمو أعمالنا.", "قد تقوم \"غولدن سيزرز\" بإضافة أو تغيير أو استبدال أي من مزوّدي الخدمات هؤلاء من وقت لآخر بحسب تطور احتياجات أعمالنا؛ وفي حال قيامنا بذلك، يستمر المزوّد الجديد بالعمل ضمن ذات فئات الخدمة الموضحة أدناه، ولا تحتاج هذه السياسة إلى تعديل لمجرد تغيير مزوّد خدمة معين. وقد تشمل هذه الفئات، بحسب الخدمة المعنية، وعلى سبيل المثال لا الحصر:", "بوابات الدفع ومزوّدي خدمات الدفع، على النحو الموضح في سياسة الدفع الخاصة بنا.", "شركات الشحن والتوصيل، على النحو الموضح في سياسة الشحن والتوصيل الخاصة بنا.", "خدمات توصيل المحتوى والأمان، مثل Cloudflare.", "مزوّدي خدمات الاستضافة والبنية التحتية.", "أدوات تحليل الموقع الإلكتروني وإحصائياته، لمساعدتنا على فهم أداء الموقع وتحسينه.", "خدمات إرسال البريد الإلكتروني، لإرسال رسائل الحساب والطلبات والإشعارات.", "أدوات التسويق، حيثما استُخدمت، للتواصل مع العملاء بخصوص منتجاتنا وعروضنا."]}, {"heading": "١٤. خصوصية الأطفال", "paragraphs": ["يُعد موقعنا الإلكتروني ومنتجاتنا موجّهة للاستخدام من قبل البالغين القادرين على إبرام عقود ملزمة بموجب القانون المعمول به، على النحو الموضح في الشروط والأحكام الخاصة بنا. ولا نقوم عن علم بجمع بيانات شخصية من الأطفال. وفي حال علمنا بأننا جمعنا بيانات شخصية من طفل دون موافقة مناسبة، سنتخذ خطوات معقولة لحذف تلك البيانات."]}, {"heading": "١٥. تحديثات السياسة", "paragraphs": ["قد نقوم بتحديث سياسة الخصوصية هذه من وقت لآخر لتعكس التغييرات في ممارساتنا أو خدماتنا أو القانون المعمول به. وسيتم نشر أي تحديث على الموقع الإلكتروني مع تاريخ \"آخر تحديث\" محدَّث. وفي حال كان التغيير جوهرياً، سنتخذ خطوات معقولة لإطلاعكم عليه عبر قنواتنا الرسمية قبل أو عند دخول التغيير حيز التنفيذ."]}, {"heading": "١٦. التواصل معنا", "paragraphs": ["لأي استفسارات أو مخاوف أو طلبات بخصوص سياسة الخصوصية هذه أو بياناتكم الشخصية، يُرجى التواصل معنا عبر قنواتنا الرسمية: واتساب على الرقم 964 750 400 6200+ (wa.me/9647504006200)، أو عبر إنستغرام على الحساب golden_scissors400@، أو عبر البريد الإلكتروني goldenscissors400@gmail.com. كما ترد تفاصيل التواصل الكاملة في سياسة التواصل والدعم الخاصة بنا."]}], "sectionsKuSor": [{"heading": "١. پێشکێشکرن و مەبەستی سیاسەتەکە", "paragraphs": ["\"گۆڵدن سێسەرز\" ڕێز لە تایبەتمەندیی تۆ دەگرێت و پابەندە بە پاراستنی داتای کەسایەتیی هەموو ئەو کەسانەی کە لەگەڵ ماڵپەڕ و کەناڵەکانی مەدا مامەڵە دەکەن – چ تۆ تەنها سەردانی ماڵپەڕەکەی کەی، چ داوایەکی کڕینی تاکفڕۆشی پێشکەش بکەی، چ خۆت وەک میوانێکی کۆمفڕۆشی تۆمار بکەی، یان وەک دابەشکار و بریکار کار بکەیت. ئەم سیاسەتی تایبەتمەندییە، بە زمانێکی سادە و ڕوون، ڕوونکردنەوە دەدات لەسەر ئەوەی کە چ داتایەکی کەسایەتی کۆدەکەینەوە، بۆچی کۆیدەکەینەوە، چۆن بەکاری دەهێنین و بڵاوی دەکەینەوە، و مافەکانی تۆ لەسەر ئەو داتایانە چیین."]}, {"heading": "٢. سنووری جێبەجێکرنی ئەم سیاسەتە", "paragraphs": ["ئەم سیاسەتە لە هەموو ئەو حاڵەتانەدا کار پێ دەکرێت کە \"گۆڵدن سێسەرز\" داتای کەسایەتی کۆدەکاتەوە یان چارەسەری دەکات سەبارەت بە ماڵپەڕی ئەلیکترونی یان کەناڵەکانمان لە واتسئەپ و ئینستاگرام، و دەبێت لەگەڵ مەرج و ڕێنماییەکانی مە و هەر سیاسەتێکی تریشدا کە تێیدا ئاماژەی بۆ کراوە بخوێنرێتەوە. ئەم سیاسەتە لەسەر ئەم کەسانە جێبەجێ دەبێت:", "سەردانیکەرانی ماڵپەڕی ئەلیکترونی.", "بکری تاکفڕۆشی.", "بکری کۆمفڕۆشی.", "دابەشکاران.", "بریکاران.", "هەر کەسێک کە داوای تۆمارکردنی هەژمارێک، تۆمارکردنی کۆمی، یان پرسیاری دابەشکاری و بریکاری پێشکەش بکات."]}, {"heading": "٣. ئەو داتایە کەسایەتیانەی کە کۆیان دەکەینەوە", "paragraphs": ["ڕەنگە ئەم جۆرە داتایانە کۆبکەینەوە، بە پێی سروشتی پەیوەندیی تۆ لەگەڵ مەدا:", "داتای ناسنامەی کەسایەتی: ناڤ، و لەو شوێنەی کە پێشکەش دەکرێت، ڕۆژی لەدایکبوون یان هەر داتایەکی تری ناسنامەیی.", "داتای پەیوەندیکردن: ژمارەی تەلەفۆن، پۆستەی ئەلیکترونی (ئایمیل)، ناونیشانی گەیاندن، و ژمارەی تۆڕی کۆمەڵایەتی ئەگەر تۆ لە ڕێگەی ئینستاگرام یان واتسئەپەوە پەیوەندیت بە مە کردبێت.", "داتای هەژمار: ناوی بەکارهێنەر، وشەی تێپەڕ (پاسوۆرد - کە بە شێوەیەکی سەلامەت دەشاردرێتەوە)، پێشوەختەکانی هەژمار، و تۆمارکردنی پەیوەندییەکان، لەو شوێنەی کە ماڵپەڕی ئەلیکترونی تایبەتمەندی دروستکردنی هەژمار دابین بکات.", "داتای داواکارییەکان: ئەو بەرهەمانەی کە داوا کراون، وردەکاریی داواکارییەکە، تۆماری داواکارییەکانی پێشوو، پێشوەختەکانی گەیاندن، و سەرنجە پەیوەندیدارەکان.", "داتای پارەدان: مە داتای کارتی تۆ لە لای خۆمونارەگرین؛ پرۆسەکانی پارەدان بە کارتی بانکی راستەوخۆ لە لایەن دابینکەری خزمەتگوزاریی پارەدانەوە چارەسەر دەکرێن، و مە تەنها پشتڕاستکردنەوەی بارودۆخی پارەدان و ژمارەیەکی ئاماژەیی وەردەگرین.", "داتای گەیاندن: ناونیشانی گەیاندن، ناڤ و ژمارەی تەلەفۆنی وەرگر، و هەر زانیارییەکی تر کە کۆمپانیای گەیاندن یان نوێنەری ناردن داوای بکات بۆ تەواوکردنی پرۆسەی ڕادەستکردن.", "داتای چالاکیی بازرگانی بۆ میوانانی کۆمفڕۆشی، دابەشکار و بریکاران: ناوی کاری بازرگانی، جۆری چالاکییەکەی، ژمارە گەورە چاوەڕوانکراوەکانی داواکارییەکان، و هەر زانیارییەکی تری پەیوەندیدار بە هەڵسەنگاندن یان بەڕێوەبردنی پەیوەندیی کۆمی، دابەشکاری یان بریکارییەوە.", "دۆکۆمێنتەکانی پشکنین: لەو شوێنەی کە پێویست بکات پشکنین بۆ ناسنامە یان چالاکیی لایەنێکی بازرگانی بکرێت بۆ مەبەستەکانی کۆمی، دابەشکاری یان بریکاری، وەکو مۆڵەتی کاری بازرگانی، باوەڕنامەی تۆمارکردن یان ئەوانەی وەک ئەوان.", "داتای تەکنیکی: ناونیشانی IP، جۆری بەرنامەی گەڕان (Browser) و وەشانی، زانیاریی ئامێر، فایلەکانی ناسنامەیی (Cookies) و تەکنیکەکانی وەک ئەوان، و داتای بەکارهێنان وەک ئەو پەڕانەی کە سەردان کراون و کاتی سەردانکردن لە سەر ماڵپەڕی ئەلیکترونی."]}, {"heading": "٤. مەبەستی بەکارهێنانی داتاکانی تۆ", "paragraphs": ["مە داتای کەسایەتی بۆ ئەم مەبەستانە بەکار دەهێنین:", "دروستکردن و بەڕێوەبردنی هەژمارەکەی تۆ.", "چارەسەرکردن و جێبەجێکردنی داواکارییەکانی تۆ.", "پێشکەشکردنی بەرهەم و خزمەتگوزارییەکانمان بۆ تۆ.", "پشکنینی تواناکانی میوانانی کۆمفڕۆشی و ڕەواییی چالاکییە بازرگانییەکانیان.", "بەڕێوەبردنی پەیوەندی و هەژمارەکانی دابەشکاران و بریکاران.", "باشترکردنی ئەزموونی تۆ لەسەر ماڵپەڕی ئەلیکترونی.", "باشترکردنی کارایی، سەلامەتی و فەرمانەکانی ماڵپەڕی ئەلیکترونی.", "پەیوەندیکردن لەگەڵ تۆدا سەبارەت بە هەژمارەکەت، داواکارییەکانت، یان پرسیارەکانت.", "ناردنی ئاگاداریی پەیوەندیدار بە داواکارییەکانەوە، وەکو پشتڕاستکردنەوە، ناردن، و نوێترین گۆڕانکارییەکانی گەیاندن.", "پابەندبوون بە مەرجە یاسایی و ڕێکخراوەییە حکومییە کارپێکراوەکانەوە.", "پاراستن لە خاپاندن (فێڵبازی) و هەر چالاکییەکی نیاسایی یان نەدەستوورپێدراو.", "پاراستنی سەلامەتیی ماڵپەڕی ئەلیکترونی و سیستەمەکانمان."]}, {"heading": "٥. بنەمای یاسایی بۆ چارەسەرکردنی داتاکان", "paragraphs": ["هەرچەندە ئەم بابەتە لە ئێستادا مەرجێکی دیاریکراو نییە لە ژێر یاسای عێراقیدا، بەڵام مە لە دەرخستنی باشترین ڕێبازە نێودەوڵەتییەکاندا، ئەو بنەما یاساییانەمان دیار کردووە کە پشتمان بەو بەستووە لە چارەسەرکردنی داتای کەسایەتیی تۆدا. مە داتای کەسایەتی لەسەر بنەمای یەکێک یان چەند بنەمایەک لە خوارەوە چارەسەر دەکەین:", "جێبەجێکردنی گرێبەست: بۆ چارەسەرکردنی داواکارییەکەی تۆ و جێبەجێکردنی، یان پێشکەشکردنی ئەو بەرهەم یان خزمەتگوزارییەی کە داوای کردووە، یان بەڕێوەبردنی پەیوەندیی تۆ وەک میوانێکی کۆمی، دابەشکار یان بریکار لەگەڵ مەدا.", "پابەندبوون بە ئەرکی یاسایی: بۆ جێبەجێکردنی مەرجە یاسایی، باج (مالیات)، گۆمروکی یان ڕێکخراوەییە کارپێکراوەکان.", "بەرژەوەندییە گرنگەکان: بۆ پاراستنی سەلامەتیی ماڵپەڕی ئەلیکترونی و سیستەمەکانمان، پێشگرتن لە خاپاندن، و باشترکردنی بەرهەم و خزمەتگوزارییەکانمان، بە مەرجێک کە ئەمە سەرۆکاریی ماف و بەرژەوەندییە بنەڕەتییەکانی تۆ نەبڕێت.", "ڕەزامەندیی تۆ: لەو حاڵەتانەدا کە مە بە تایبەتی داوای ڕەزامەندیی تۆی کردووە، وەکو هەندێک پەیوەندیی ڕیکلامی یان فایلە ناسنامەیییە بژاردەیییەکان؛ و تۆ مافت هەیە ئەم ڕەزامەندییە لە هەر کاتێکدا پاشگەز بکەیتەوە، وەک لە بەشی ژمارە ١٠ (مافەکانی تۆ)دا ڕوون کراوەتەوە."]}, {"heading": "٦. بڵاوکردنەوەی داتا و ئاشکراکردن", "paragraphs": ["مە داتای کەسایەتیی تۆ نافرۆشین. و ڕەنگە داتای کەسایەتی لەگەڵ ئەم لایەنانەی خوارەوەی لایەنی سێیەمدا بڵاوبکەینەوە، بەو ڕادەیەی کە پێویست بێت بۆ ئەو مەبەستانەی لە ئەم سیاسەتەدا دیار کراون. مە لەگەڵ دابینکەرە باوەڕپێکراو و پەسەندکراوەکاندا لە هەر بەشێکدا کار دەکەین؛ و لە ئەگەری گۆڕینی دابینکەرێکی دیاریکراودا، ئەم سیاسەتە بە دروستی دەمێنێتەوە، لەبەر ئەوەی هەر دابینکەرێکی نوێ لە هەمان بەشە خزمەتگوزارییە دیارکراوەکانی خوارەوەدا بەردەوام دەبێت:", "کۆمپانیاکانی ناردن و گەیاندن، بۆ تەواوکردنی ڕادەستکردنی داواکارییەکەی تۆ، لەسەر بنەمای سیاسەتی ناردن و گەیاندنی مە.", "دابینکەرانی خزمەتگوزارییەکانی پارەدان، بۆ چارەسەرکردنی پرۆسەکانی پارەدان بە شێوەیەکی سەلامەت.", "دابینکەرانی خزمەتگوزارییەکانی میوانداری (Hosting) و ژێرخانی تەکنیکی، بۆ کارپێکردنی ماڵپەڕی ئەلیکترونی و کۆلکردنی داتاکانی.", "دابینکەرانی خزمەتگوزارییە تەکنیکییەکان، وەکو خزمەتگوزارییەکانی گەیاندنی ناوەڕۆک و سەلامەتی (وەکو Cloudflare)، بۆ پاراستنی خێرایی، بەردەستبوون و سەلامەتیی ماڵپەڕی ئەلیکترونی."]}, {"heading": "٧. سەلامەتیی زانیارییەکان", "paragraphs": ["مە ڕێکاری تەکنیکی و ڕێکخراوەیی گونجاویمان وەرگرتووە بۆ پاراستنی داتای کەسایەتی لە گەیشتنی نەدەستوورپێدراو، لە دەستچوون، خراپ بەکارهێنان، یان ئاشکراکردن. سەڕەڕای هەوڵەکانی مە بۆ پاراستنی داتاکانی تۆ، هیچ ڕێگەیەکی گواستنەوە یان کۆلکردن بە تەواوی ١٠٠٪ سەلامەت نییە، و مە ناتوانین مسۆگەریی سەلامەتیی تەواو بدەین. لە نموونەی ئەو ڕێکارە گشتییانەی کە جێبەجێیان دەکەین:", "تشفیکردنی داتاکان لە شوێنی گونجاودا لە کاتی گواستنەوەیدا، بۆ نموونە لە کاتی ناردنیدا لە ڕێگەی ماڵپەڕی ئەلیکترونییەوە.", "سنووردارکردنی گەیشتن بە داتای کەسایەتی تەنها بۆ کارمەندەکانمان کە مۆڵەتیان هەیە و پێویستیان پێیەتی بۆ ئەنجامدانی کارەکانیان (ڕێوەبردنی دەسەڵاتەکان).", "پێداچوونەوەکردنی خولی بە ڕێکارەکانی سەلامەتیی خۆمان بۆ پاراستنی بوونی گونجاوی بۆ مەترسییە بەردەستەکان.", "هێشتنەوەی کۆپیی پاراستن (Backup) بۆ داتا گرنگەکان لە شوێنی گونجاودا، بۆ پاراستن لە لەدەستچوونی بە بێ زانین."]}, {"heading": "٨. گواستنەوەی داتا بۆ دەرەوەی وڵات", "paragraphs": ["\"گۆڵدن سێسەرز\" خزمەتی میوانەکان دەکات لە ناو عێراق و دەرەوەیدا. و لەبەر ئەم هۆکارە، ڕەنگە هەندێک داتای کەسایەتی چارەسەر بکرێن، بگوازرێنەوە یان کۆلکرێن لە لایەن دابینکەرانی خزمەتگوزارییەوە لە دەرەوەی عێراق، لە ناویشیاندا دابینکەرانی خزمەتگوزاریی میوانداری، پارەدان، و خزمەتگوزارییە تەکنیکییەکان یان سەلامەتی. لەم حاڵەتانەدا، مە ڕێکاری گونجاویمان وەرگرتووە بۆ پشتڕاستکردنەوەی ئەوەی کە ئەم دابینکەرانەی خزمەتگوزارییە ئاستێکی گونجاو لە پاراستن بۆ داتاکانی تۆ جێبەجێ دەکەن، و لەسەر بنەمای ئەم سیاسەتە کار دەکەن."]}, {"heading": "٩. کۆلکردن و هێشتنەوەی داتاکان", "paragraphs": ["مە داتای کەسایەتی تەنها بۆ ئەو ماوەیە دەهێڵینەوە لە لای خۆمان کە پێویست بێت بۆ گەیشتن بەو مەبەستانەی لە ئەم سیاسەتەدا دیار کراون، لە ناویشیاندا مەرجە یاسایی، ژمێریاری یان ڕێکخراوەییەکان. و لەو کاتەدا کە داتای کەسایەتی سوودی نامێنێت بۆ ئەم مەبەستانە، مە ڕێکاری گونجاویمان وەرگرتووە بۆ سڕینەوەی یان شاردنەوەی ناسنامەکەی."]}, {"heading": "١٠. مافەکانی تۆ", "paragraphs": ["بە ڕەچاوکردنی یاسای کارپێکراو، تۆ ئەم مافانەت هەنە:", "سەردانیکردنی داتای کەسایەتیی کە لە لای خۆمان هێشتوومانەتەوە سەبارەت بە تۆ.", "داوای ڕاستکردنەوەی داتای کەسایەتیی نادروست.", "داوای نوێکردنەوەی داتای کەسایەتیی تۆ.", "داوای سڕینەوەی داتای کەسایەتیی تۆ، کاتێک ئەمە یاسایی بێت و ناکۆک نەبێت لەگەڵ هیچ مەرجێکی یاسایی یان بازرگانیی مەبەستداردا (وەکو تۆماری داواکارییەکان یان تۆماری ژمێریاری) – لە بەشی ژمارە ١١ (سڕینەوەی هەژمار و پەکخستنی) بنۆڕە بۆ وردەکاریی زیاتر.", "پاشگەزبوونەوە لە ڕەزامەندیی تۆ، لەو حاڵەتانەدا کە چارەسەرکردنی مە بۆ داتاکانی تۆ لەسەر بنەمای ئەو ڕەزامەندییە بێت، بە بێ ئەوەی ئەمە کاریگەریی هەبێت لەسەر ڕەواییی چارەسەرییەکە پێش پاشگەزبوونەوەکە."]}, {"heading": "١١. پەکخستن و سڕینەوەی هەژمار", "paragraphs": ["لە کاتی داواکاریی تۆ بۆ پەکخستنی هەژمارەکەت یان سڕینەوەی، مە ئەو داتایانەی کەسایەتی کە پێویست نین بۆ هیچ مەبەستێکی یاسایی، ژمێریاری یان بازرگانی دەسڕینەوە یان ناسنامەکەیان دەشارینەوە. و ڕەنگە پێویست بکات کە هەندێک داتا بۆ ماوەیەکی سنووردار بهێڵینەوە تەنانەت دوای پەکخستنەکەش، ئەگەر ئەمە لەسەر بنەمای یاسا داوا بکرێت یان بۆ مەبەستی تۆمارە بازرگانییە مەبەستدارەکان، لەسەر بنەمای بەشی ژمارە ٩ (کۆلکردن و هێشتنەوەی داتاکان).", "ئەو داتایانەی کە بە گشتی لە کاتی داواکارییەکەدا دەسڕێنەوە یان دەشاردرێنەوە: پرۆفایلی تۆ لە ناو هەژمارەکەدا، داتای چوونەژوورەوەکان، پێشوەختە پارێزراوەکان، و تۆماری چالاکیی تۆ لە هەژمارەکەدا.", "ئەو داتایانەی کە ڕەنگە بۆ ماوەیەکی سنووردار بهێڵینەوە: تۆماری داواکارییەکان و فاکتۆرەکان، ئاماژەکانی پشتڕاستکردنەوەی پارەدان، و هەر تۆمارێکی تری پێویست بۆ مەبەستی باج، ژمێریاری، یاسایی یان ڕێکخراوەیی تر."]}, {"heading": "١٢. فایلەکانی ناسنامەیی (Cookies)", "paragraphs": ["ماڵپەڕی ئەلیکترونی فایلەکانی ناسنامەیی (Cookies) و تەکنیکەکانی وەک ئەو بەکاردەهێنێت بۆ پشتڕاستکردنەوەی کارکردنی بە شێوەیەکی دروست، بیرهاتنەوەی پێشوەختەکانی تۆ، و تێگەیشتن لە چۆنیەتیی بەکارهێنانی میوانان بۆ ماڵپەڕەکە.", "تۆ دەتوانیت کۆنتڕۆڵی فایلەکانی ناسنامەیی بکەیت یان پەکیان بخەیت لە ڕێگەی ڕێکخستنەکانی بەرنامەی گەڕان (Browser) لە لای خۆتەوە؛ لە هەمان کاتدا داوای لێت دەکەین بزانیت کە پەکخستنی هەندێک فایلی ناسنامەیی ڕەنگە کاریگەریی هەبێت لەسەر فەرمانەکانی ماڵپەڕەکە. زانیاریی وردتر سەبارەت بە جۆرەکانی فایلی ناسنامەیی کە بەکاریان دەهێنین و چۆنیەتیی بەڕێوەبردنیان لە سیاسەتی فایلەکانی ناسنامەییدا (Cookie Policy) کە جیاوازە لە لای مە هەنە.", "فایلەکانی ناسنامەییی سەرەکی، کە پێویستن بۆ کارکردنی ماڵپەڕی ئەلیکترونی بە شێوەیەکی دروست.", "فایلەکانی ناسنامەییی کارپێکراو یان پێشوەختە، کە هەڵبژاردنەکانی تۆ بیر دێننەوە، وەکو زمان.", "فایلەکانی ناسنامەییی شیکاری یان تایبەت بە ئەنجامدان، کە یارمەتیدەرن بۆ تێگەیشتن لە چۆنیەتیی بەکارهێنانی ماڵپەڕی ئەلیکترونی بۆ باشترکردنی.", "فایلەکانی ناسنامەییی ڕیکلامی یان مارکێتینگ، کە ڕەنگە لە داهاتوودا بەکاریان بهێنین – بۆ نموونە لەگەڵ ئامرازەکانی وەک Google Analytics یان Meta Pixel – بۆ پێوانەکردنی کاریگەریی چالاکییە ڕیکلامییەکانمان و تایبەتکردنی ناوەڕۆک لەسەر بنەمای مەرامەکانی تۆ؛ و مە ئەم بەشە و سیاسەتی فایلەکانی ناسنامەیی نوێ دەکەینەوە پێش بەکارهێنانی هەر یەکێک لەم فایلانە فایلەکانی ناسنامەییی ڕیکلامی یان مارکێتینگ، کە ڕەنگە لە داهاتوودا بەکاریان بهێنین – بۆ نموونە لەگەڵ ئامرازەکانی وەک Google Analytics یان Meta Pixel – بۆ پێوانەکردنی کاریگەریی چالاکییە ڕیکلامییەکانمان و تایبەتکردنی ناوەڕۆک لەسەر بنەمای مەرامەکانی تۆ؛ و مە ئەم بەشە و سیاسەتی فایلەکانی ناسنامەیی نوێ دەکەینەوە پێش بەکارهێنانی هەر یەکێک لەم فایلانە."]}, {"heading": "١٣. خزمەتگوزاری و لایەنەکانی سێیەم", "paragraphs": ["ماڵپەڕی ئەلیکترونی ڕەنگە پشت بە دابینکەرانی خزمەتگوزاریی دەرەکی ببەستێت بۆ پشتڕاستکردنەوەی کارکردنی بە سەلامەتی و کاریگەری، و بۆ یارمەتیدان لە گەشەپێدانی کاری مە.", "\"گۆڵدن سێسەرز\" ڕەنگە دابینکەری خزمەتگوزاریی دیاریکراو زیاد بکات، بیانگۆڕێت یان بیانگۆڕێت بە ئەوانی تر لە کاتێکەوە بۆ کاتێکی تر لەسەر بنەمای گەشەسەندنی پێویستییەکانی کاری مە؛ و لە ئەگەری ئەم چەندەدا، دابینکەری نوێ لە هەمان بەشە خزمەتگوزارییە دیارکراوەکانی خوارەوەدا بەردەوام دەبێت، و ئەم سیاسەتە پێویستی بە دەستکاریکردن نییە تەنها بۆ گۆڕینی دابینکەرێکی دیاریکراو نەبێت. و ئەم بەشە ڕەنگە لەسەر بنەمای خزمەتگوزاریی هەبوو، و بێ سنووردارکردن لەسەر نموونەکان، ئەم لایەنانە بگرێتەوە:", "دەروازەکانی پارەدان و دابینکەرانی خزمەتگوزارییەکانی پارەدان، لەسەر بنەمای سیاسەتی پارەدانی مە.", "کۆمپانیاکانی ناردن و گەیاندن، لەسەر بنەمای سیاسەتی ناردن و گەیاندنی مە.", "خزمەتگوزارییەکانی گەیاندنی ناوەڕۆک و سەلامەتی، وەکو Cloudflare.", "دابینکەرانی خزمەتگوزارییەکانی میوانداری (Hosting) و ژێرخانی تەکنیکی.", "ئامرازەکانی شیکاریی ماڵپەڕی ئەلیکترونی و ئامارەکانی، بۆ یارمەتیدانی مە لە تێگەیشتن لە ئەنجامدانی ماڵپەڕی ئەلیکترونی و باشترکردنی.", "خزمەتگوزارییەکانی ناردنی پۆستەی ئەلیکترونی، بۆ ناردنی پەیامەکانی هەژمار، داواکارییەکان و ئاگادارییەکان.", "ئامرازەکانی مارکێتینگ، لەو شوێنەی کە بەکار هاتبێن، بۆ پەیوەندیکردن لەگەڵ میواناندا سەبارەت بە بەرهەم و پێشکەشکرنەکانمان."]}, {"heading": "١٤. تایبەتمەندیی منداڵان", "paragraphs": ["ماڵپەڕی ئەلیکترونی و بەرهەمەکانمان بۆ بەکارهێنان لە لایەن گەورەساڵانەوە ئاراستە کراون ئەوانەی کە توانای دروستکردنی گرێبەستی پابەندکەریان هەیە لەسەر بنەمای یاسای کارپێکراو، لەسەر بنەمای مەرج و ڕێنماییەکانی مە. مە بە زانابوون داتای کەسایەتی لە منداڵان کۆناکەینەوە. و لە ئەگەری زانینی مە لەم چەندەدا کە مە داتای کەسایەتی لە منداڵێک بە بێ ڕەزامەندیی گونجاو کۆکردووەتەوە، مە ڕێکاری گونجاویمان وەرگرتووە بۆ سڕینەوەی ئەو داتایانە."]}, {"heading": "١٥. نوێکردنەوەکانی سیاسەتەکە", "paragraphs": ["مە ڕەنگە ئەم سیاسەتی تایبەتمەندییە لە کاتێکەوە بۆ کاتێکی تر نوێ بکەینەوە بۆ ڕەچاوکردنی گۆڕانکارییەکان لە ڕێباز، خزمەتگوزاری یان یاسای کارپێکراودا. و هەر نوێکردنەوەیەک لەسەر ماڵپەڕی ئەلیکترونی بە ڕێکەوتی \"دوا نوێکردنەوە\" بڵاو دەبێتەوە. و لە ئەگەری گۆڕانکارییەکی بنەڕەتیدا، مە ڕێکاری گونجاویمان وەرگرتووە بۆ ئاگادارکردنەوەی تۆ لە ڕێگەی کەناڵە فەرمییەکانمانەوە پێش یان لە کاتی چوونە ناو کارپێکردنی گۆڕانکارییەکەدا."]}, {"heading": "١٦. پەیوەندیکردن بە مەوە", "paragraphs": ["بۆ هەر پرسیارێک، نیگەرانییەک یان داواکارییەک سەبارەت بە ئەم سیاسەتی تایبەتمەندییە یان داتای کەسایەتیی تۆ، تکایە لە ڕێگەی کەناڵە فەرمییەکانمانەوە پەیوەندیمان پێوە بکە: واتسئەپ لە ژمارەی +964 750 400 6200 (wa.me/9647504006200)، یان لە ڕێگەی ئینستاگرام لە هەژماری golden_scissors400@، یان لە ڕێگەی پۆستەی ئەلیکترونی goldenscissors400@gmail.com. هەروەها وردەکاریی زیاتری پەیوەندیکردن لە سیاسەتی پەیوەندی و پشتگیریی مەدا هەن."]}], "sectionsKuBad": [{"heading": "١. دەسپێک و مەرەما سیاسەتێ", "paragraphs": ["\"گۆڵدن سێسەرز\" رێزێ ل تایبەتمەندییا هەوە دگریت و پابەندە ب پاراستنا داتایێن کەسایەتی یێن هەمی کەسێن دگەل ماڵپەڕ و کەناڵێن مە مامەڵێ دکەن – چ هەوە ب تنێ سەردانا ماڵپەڕی کربیت، چ داخوازا كرینا تاکفڕۆ  – ل بەشێ ژمارە ١١ (ژێبرنا هژمارێ و پەکخستنا وێ) بنێڕە بۆ پتر زانیارییان.", "پاشڤەبرنا ڕەزامەندییا هەوە، د ئەو حالەتێن دا کو چارەسەرکرنا مە بۆ داتایێن هەوە ل سەر بنەمایێ وێ ڕەزامەندیێ بیت، بێ کو ئەڤە کاریگەرییێ ل سەر ڕەوایییا چارەسەرییا بەری پاشڤەبرنێ بکەت."]}, {"heading": "١١. ژ کارئێخستن و ژێبرنا هژمارێ", "paragraphs": ["د دەمێ داخوازا هەوە بۆ ژکارکەفتنا هژمارا هەوە یان ژێبرنا وێ، ئەم دێ داتایێن کەسایەتی یێن نەپێدڤی بۆ چ مەبەستەکا یاسایی، ژمێریاری یان بازرگانی ژێبەین یان ناسناما وێ ڤەشێرین. و ڕەنگە پێدڤی بکەت کو هندەک داتایان بۆ دەمەکێ سنوردار بهێلین ژی پشتی ژ کارکەفتنێ، ئەگەر ئەڤە ل گۆرەی یاسایێ دهێتە داخوازکرن یان بۆ مەبەستێن تۆمارێن بازرگانی یێن مەبەستدار، ل گۆرەی بەشێ ژمارە ٩ (کومکرن و هێلانا داتایان)", "ئەو داتایێن کو ب گشتی ل دەمێ داخوازێ دێنە ژێبرن یان ڤەشارتن: پرۆفایلێ هەوە ل ناڤ هژمارێ، داتایێن چوونا ژوور، پێشوەختەیێن پاراستی، و تۆمارا چالاکییا هەوە ل هژمارێ.", "ئەو داتایێن کو ڕەنگە بۆ دەمەکێ سنوردار بهێلین: تۆمارێن داخوازان و فاتوران، ئاماژەیێن پشتڕاستکرنا پارەدانێ، و هەر تۆمارەکا دیتر یا پێدڤی بۆ مەبەستێن باجی، ژمێریاری، یاسایی یان ڕێکخراوە یێن دی."]}, {"heading": "١٢. فایلێن ناسنامەیی (Cookies)", "paragraphs": ["ماڵپەڕی الکترونی فایلێن ناسنامەیی (Cookies) و تەکنیکێن وەک وێ بکار دئینت بۆ پشت راستکرنا کارکرنا وێ ب شێوەیەکێ دروست، بیرئینانا پێشوەخت ، و تێگەهشتنا چەوا بکارئینانا سەرادانکاران بۆ ماڵپەڕی.", "هین دشين کۆنتڕۆلا فایلێن ناسنامەیی بکەن یان ژکاربێخن ب ڕێکا ڕێکخستنێن بەرنامەیێ گەڕانێ (Browser) یێن هەوە؛ هیڤیە ئەڤ تشتە بەرچاڤ بهێتە وەلگرتن کو ژکارئێخستنا هندەک فایلێن ناسنامەیی ڕەنگە کاریگەرییێ ل سەر فرمانێن ماڵپەڕی بکەت. زانیارییێن دیتر سەبارەت ب جۆرێن فایلێن ناسنامەیی یێن مە بکار دئینەین و چەوا برێڤەبرنا وان ل سیاسەتا فایلێن ناسنامەیی (Cookie Policy) یا جۆدا ل دەف مە هەنە.", "فایلێن ناسنامەیی یێن سەرەکی، کو بۆ کارکرنا ماڵپەڕی الکترونی ب شێوەیەکێ دروست پێدڤی نە.", "فایلێن ناسنامەیی یێن کارپێکری یان پێشوەختەیی، کو هەلبژاردنێن هەوە دئینتە بیرا خو، وەک زمان.", "فایلێن ناسنامەیی یێن شیکاری یان یێن تایبەت ب ئەنجامدانێ ڤە، کو هاریکاریا مە دکەن بۆ تێگەهشتنا چەوا بکارئینانا ماڵپەڕی الکترونی بۆ باشترکرنا وێ.", "فایلێن ناسنامەیی یێن ڕیکلامی یان مارکێتینگێ، کو ڕەنگە ل داهاتی بکار بئینین – بۆ نموونە دگەل ئامرازێن وەکی Google Analytics یان Meta Pixel – بۆ پێوانەکرنا کاریگەرییا چالاکیێن مە یێن ڕیکلامی و تایبەتکرنا ناڤەڕۆکی ل گۆرەی مەرەمێن هەوە؛ و ئەم دێ ڤی بەشە و سیاسەتا فایلێن ناسنامەیی نوی کەیین بەری بکارئینانا هەر ئێك ژ ڤان فایلان."]}, {"heading": "١٣. خزمەتگوزاری و لایەنێن دەرەکی", "paragraphs": ["ماڵپەڕی الکترونی ڕەنگە پشت ب دابینکەرێن خزمەتگوزارییێن دەرەکی گرێبدەت بۆ پشتریا کارکرنا وێ ب سلامەتی و کاریگەری، و بۆ هاریکاریا گەشەکرنا کارێ مە. \"گۆڵدن سێسەرز\" ڕەنگە دابینکەرێن خزمەتگوزارییێن دیارکری زێدە بکەت، بگۆهریت یان بگۆهریت ب یێن دی دەم بۆ دەمی ل گورەی گەشەکرنا پێدڤیێن کارێ مە؛ و ژ ئەگەرێ ڤێ چەندێ ، دابینکەرێ نوی د ناڤ هەمان پشکێن خزمەتگوزارییێن ل خوارێ دیارکری دا بەردەوام دبیت، و ئەڤ سیاسەتە پێدڤی ب دەستکاریکرنێ نینە تنێ بۆ گۆهرینا دابینکەرەکێ دیارکری. و و ئەڤ پشکە، لدیڤ خزمەتگۆزاریا مەرەمدار، بەلێ تنێ ب ڤانڤە سنوردارە:", "دەروازەیێن پارەدانێ و دابینکەرێن خزمەتگوزارییێن پارەدانێ، ل سەر بنەمایێ سیاسەتا پارەدانا مە.", "کۆمپانییێن شاندن و گەهاندنێ، ل سەر بنەمایێ سیاسەتا شاندن و گەهاندنا مە.", "خزمەتگوزارییێن گەهاندنا ناوڤەڕۆکێ و سلامەتییێ، وەک Cloudflare.", "دابینکەرێن خزمەتگوزارییێن پێشوازی (Hosting)و ژێرخانا تەکنیکی.", "ئامرازێن شیکارییا ماڵپەڕی الکترونی و ئامارێن وێ، بۆ هاریکاریا مە د تێگەهشتنا ئەنجامدانێ ماڵپەڕی و باشترکرنا وێ.", "خزمەتگوزارییێن هنارتنا پۆستەی الکترونی، بۆ هنارتنا پەیامێن هژمارێ، داخوازان و ئاگەهدارییان.", "ئامرازێن مارکتینگێ، ل جهێ کو هاتبنە بکارئینان، بۆ پەیوەندیکرنا دگەل سەرەدانکەران سەبارەت بەرهەم و پێشکەشکرنێن مە."]}, {"heading": "١٤. تایبەتمەندییا زارۆکان", "paragraphs": ["ماڵپەڕی الکترونی و بەرهەمێن مە بۆ بکارئینانێ ژ لایێ مەزنان ڤە هاتینە ئاراستەکرن ئەڤێن کو شیانێن ئاڤاکرنا گرێبەستێن پابەندکەر هەی ل گۆرەی یاسایا کارپێکری، ل سەر بنەمایێ مەرج و ڕێنماییێن مە. ئەم ب ئاگەه داتایێن کەسایەتی ژ زارۆکان کۆم ناکەین. و ئەگەر مە زانی مە داتایێن کەسایەتی ژ زارۆکەکێ ب بێ ڕەزامەندییا گونجای کۆم کرینە، مە ڕێکارێن گونجای وەرگرتینە بۆ ژێبرنا وان داتایان."]}, {"heading": "١٥. نویکرنێن سیاسەتێ", "paragraphs": ["ڕەنگە ئەڤ سیاسەتا تایبەتمەندیێ ل دەم بۆ دەمێ نوی کەیین بۆ ڕەچڤەکرنا گۆهرینێن د ڕێباز، خزمەتگوزاری یان یاسایا کارپێکری دا. و هەر نویکرنەک دێ ل سەر ماڵپەڕی الکترونی ب ڕێکەوتی \"دوا نویکرن\" ڤە بەلاڤ بیت. و د حالەتێ گۆهرینەکا بنەڕەتی دا، دێ پێنگاڤێن ژیرانە هاڤێژین بۆ ئاگەهدارکرنا هەوە ب رێیا کەنالێن مە یێن پەیوەندیکرنێ یێن فەرمی بەری یان ل دەمێ چوونا گوهۆڕینێ بۆ د بیاڤێ جێبەجێکرنێ دا."]}, {"heading": "١٦. پەیوەندیکردن ب مە", "paragraphs": ["بۆ هەر پرسیار یان تێبینییەکێ دەربارەی ئەڤ پۆلیسییا زڤڕاندن و ڤەگەڕاندنا پارەی یان داخوازییا زڤڕاندن، گوهۆڕین، یان ڤەگەڕاندنا پارەی، هیڤییە ب رێیا کەناڵێن مە یێن فەرمی پەیوەندیێ ب مە بکەن: وەتسئەپ ل سەر ژمارا 9647504006200+ (wa.me/9647504006200)، یان ب رێیا ئینستاگرامی ل سەر ئەکاونتێ golden_scissors400@، یان ب رێیا ئیمەیلی ل سەر goldenscissors400@gmail.com. هەروەسا هویرکارییێن تەمام یێن پەیوەندیێ د پۆلیسییا پەیوەندیکردن و پشتەڤانیێ یا مە دا هاتینە ."]}]}, "GS-POL-03": {"id": "GS-POL-03", "docControlEn": "", "docControlAr": "", "titleEn": "Payment Policy", "titleAr": "سياسة الدفع", "titleKuSor": "سیاسەتی پارەدان", "titleKuBad": "سياسا پارەدانێ", "introEn": "This Payment Policy explains the rules and procedures that apply to payments made on the gscissors.com website and through our official channels, for Golden Scissors' Retail Customers, Wholesale Customers, Distributors, and Agents. It sets out, in clear language, how payments are accepted, confirmed, and processed, so that everyone understands their rights and responsibilities. By placing an Order or making a payment through the Website or an official channel, you agree to this Policy.", "introAr": "توضح سياسة الدفع هذه القواعد والإجراءات المتعلقة بعمليات الدفع التي تتم عبر موقع gscissors.com الإلكتروني وقنواتنا الرسمية، بالنسبة لعملاء \"غولدن سيزرز\" من فئات عملاء التجزئة، وعملاء الجملة، والموزّعين، والوكلاء. وتوضح هذه السياسة، بلغة واضحة، كيفية قبول عمليات الدفع وتأكيدها ومعالجتها، بما يضمن فهم الجميع لحقوقهم والتزاماتهم. إن تقديمكم لطلب شراء أو إجراء عملية دفع عبر الموقع الإلكتروني أو أي قناة رسمية يُعد موافقة منكم على هذه السياسة.", "introKuSor": "ئەم سیاسەتی پارەدانە، ڕێسا و ڕێکارە پەیوەندیدارەکان بە پرۆسەکانی پارەدان کە لە ڕێگەی ماڵپەڕی gscissors.com و کەناڵە فەرمییەکانمانەوە ئەنجام دەدرێن، بۆ میوان/مشتەرییەکانی \"گۆڵدن سیزەرز\" لە پشکێن مشتەرییەکانی تاکفرۆشی، و مشتەرییەکانی کۆفرۆشی، و بڵاوکاران، و نوێنەران، روون دەکاتەوە. ئەم سیاسەتە بە زمانێکی ڕوون دەردەخات کە چۆن پرۆسەکانی پارەدان قبوڵ دەکرێن، پشتڕاست دەکرێنەوە و یەکلایی دەکرێنەوە، بە جۆرێک کە دڵنیایی بدات کە هەموو کەسێک ماف و ئەرکەکانی خۆی دەزانێت. پێشکەشکردنی داوای کڕین یان ئەنجامدانی پرۆسەی پارەدان لەسەر ماڵپەڕ یان هەر کەناڵێکی فەرمی بە خۆڕازیبوون لەسەر ئەم سیاسەتە ئەژمار دەکرێت.", "introKuBad": "ئەڤ سياسا ڤەدانا پارەی ڕاڤە دكەت ڕێسا و ڕێكارێن په‌وه‌ندیدار ب پرۆسه‌يێن ڤەدانا پارەی يێن كو ب رێکا ماڵپەڕێ gscissors.com و کەناڵێن مه‌ یێن فەرمی دهێتە ئەنجام دان، بۆ مشتەریێن \"گۆلدن سيزرز\" ژ پشکێن مشتەریێن تاکفرۆش (التجزئة)، و مشتەریێن بکوم (الجملة)، و بڵاڤکەر (الموزعين)، و نوینەر (الوكال). و ئەڤ سياسە ب زمانەکی روون ديار دكەت چەوا قەبیلكرن، پشتڕاستكرن و چارەسەرکرنا پرۆسەیێن ڤەدانا پارەی دهێتە کرن، د په‌یداكردنا پشتڕاستبوونێ دا كو هه‌موو كه‌س ماف و ئه‌ركێن خوه‌ بزانن. پێشكێشكردنا داخوازا كڕينێ (طلب شراء) يان ئەنجامدانا پرۆسه‌يا ڤەدانا پارەی ب رێکا ماڵپەڕی یان هەر کەناڵەکە فەرمی، ب خۆ ڕازیبوونە لسەر ڤێ سياسەتێ.", "sectionsEn": [{"heading": "1. Introduction and Purpose", "paragraphs": ["Golden Scissors is committed to making payment on the Website clear, secure, and fair for everyone we serve. This Policy sets out the rules and procedures that govern payments for Orders, so that Retail Customers, Wholesale Customers, Distributors, and Agents all understand how payments are accepted, confirmed, and processed."]}, {"heading": "2. Scope of This Policy", "paragraphs": ["This Policy applies to all payments made in connection with Orders placed through the Website or through our official WhatsApp and Instagram channels. It applies to:", "Retail Customers.", "Wholesale Customers.", "Distributors.", "Agents."]}, {"heading": "2.1 Agreement-Specific Terms", "paragraphs": ["Where Golden Scissors has entered into a separate written agreement or contract with a Wholesale Customer, Distributor, or Agent, the payment terms set out in that agreement or contract will govern to the extent they differ from this Policy. This Policy continues to apply to any matter not specifically addressed in such an agreement or contract."]}, {"heading": "3. Accepted Currencies", "paragraphs": ["The Website may support one or more currencies depending on the country or market being served. The currency shown to you at checkout is the final reference for your payment. Any currency conversion applied by your bank, card issuer, or payment provider is carried out by that party and is outside Golden Scissors' control."]}, {"heading": "4. Payment Methods", "paragraphs": ["Payment methods may include, but are not limited to:", "Card payments.", "Cash on Delivery (COD), where available.", "Bank transfer, where offered.", "Digital wallets, where offered."]}, {"heading": "5. Payment Confirmation", "paragraphs": ["A payment is considered successful once it has been approved by the relevant payment provider, bank, or card issuer. An Order is considered confirmed once successful payment has been received and verified, or, for Cash on Delivery Orders, once the Order has been accepted by Golden Scissors. Golden Scissors may place an Order on hold pending verification of a payment before confirming it."]}, {"heading": "6. Order Processing and Payment", "paragraphs": ["Once payment is confirmed, or a Cash on Delivery Order is accepted, the Order moves into processing and is then prepared for handover to the delivery company or courier, in accordance with our Shipping & Delivery Policy. Some Orders may require additional review before processing begins — for example, to confirm payment details, verify a Wholesale Customer's account, or address other unusual order characteristics — which may extend the time before the Order moves into processing."]}, {"heading": "7. Cash on Delivery (COD)", "paragraphs": ["Golden Scissors currently offers Cash on Delivery for eligible Orders within Iraq.", "The availability of Cash on Delivery depends on the delivery area and may not be offered for all locations.", "Cash on Delivery may not be available for certain Orders, such as high-value Orders, Wholesale Orders, or Orders flagged for additional review.", "Golden Scissors reserves the right to limit, suspend, or withdraw the availability of Cash on Delivery, generally or for specific Orders, where necessary to protect its operations."]}, {"heading": "8. International Payments", "paragraphs": ["Golden Scissors accepts Orders from customers located outside Iraq.", "International Orders are paid for using the electronic payment methods available at checkout for the relevant country or market.", "Golden Scissors may contact an international customer to coordinate payment or shipping details where needed to complete an Order."]}, {"heading": "9. Taxes and Fees", "paragraphs": ["Whether prices shown on the Website include applicable taxes or fees will be indicated at checkout or on the relevant product or pricing page. Customers are responsible for any bank charges, currency conversion fees, transfer fees, or customs duties that may apply to their payment or Order, where applicable."]}, {"heading": "10. Payment Security", "paragraphs": ["Golden Scissors does not store your card payment details. Where payments are processed through a payment gateway or payment service provider, your payment information is handled directly and securely by that provider. We use appropriate safeguards, such as a secure payment gateway and SSL encryption, to help protect payment information in transit."]}, {"heading": "11. Payment Verification", "paragraphs": ["Golden Scissors may request additional verification of a payment or Order in certain circumstances, including but not limited to:", "Suspected fraudulent activity.", "A mismatch in payment details.", "High-value Orders.", "Any other situation that reasonably calls for additional verification."]}, {"heading": "12. Declined, Cancelled, or Suspended Payments", "paragraphs": ["Golden Scissors may decline a payment, cancel an Order, or suspend an Order in circumstances including but not limited to a failed or declined payment, suspected fraud, an inability to verify payment or account details, or other situations that could affect the security of a transaction or the interests of Golden Scissors or its customers. Golden Scissors reserves the right to take the action it considers appropriate to protect its interests in such cases."]}, {"heading": "13. Refunds", "paragraphs": ["Refunds, where applicable, are handled in accordance with our Return & Refund Policy. Please refer to that Policy for details on eligibility, process, and timelines."]}, {"heading": "14. Fraud Prevention", "paragraphs": ["Golden Scissors reserves the right to review any Order or payment, suspend a suspicious transaction, request additional information from a customer, and decline any transaction it reasonably suspects to be fraudulent."]}, {"heading": "15. Limitation of Liability", "paragraphs": ["Golden Scissors is not responsible for delays, failures, or losses arising from circumstances beyond its reasonable control, including issues with payment providers, interruptions to banking services, or technical failures caused by third parties."]}, {"heading": "16. Relationship to Other Policies", "paragraphs": ["This Policy should be read together with our Terms & Conditions, Privacy Policy, Shipping & Delivery Policy, and Return & Refund Policy. Where those policies address a topic in more detail, they take precedence for that topic, and this Policy does not repeat their content."]}, {"heading": "17. Policy Updates", "paragraphs": ["We may update this Payment Policy from time to time to reflect changes in our practices, our services, or applicable law. Any update will be posted on the Website with a revised \"Last Updated\" date. Where a change is material, we will take reasonable steps to bring it to your attention through our official channels prior to, or at the time of, the change taking effect."]}, {"heading": "18. Contact Us", "paragraphs": ["For any questions or concerns regarding this Payment Policy or a payment you have made, please contact us through our official channels: WhatsApp +964 750 400 6200 (wa.me/9647504006200), Instagram @golden_scissors400, or email goldenscissors400@gmail.com. Full contact details are also set out in our Contact & Support Policy."]}], "sectionsAr": [{"heading": "١. المقدمة والغرض من السياسة", "paragraphs": ["تلتزم \"غولدن سيزرز\" بأن تكون عملية الدفع على موقعها الإلكتروني واضحة وآمنة وعادلة لكل من نتعامل معهم. وتوضح هذه السياسة القواعد والإجراءات التي تحكم عمليات الدفع الخاصة بالطلبات، بحيث يفهم عملاء التجزئة، وعملاء الجملة، والموزّعون، والوكلاء كيفية قبول عمليات الدفع وتأكيدها ومعالجتها."]}, {"heading": "٢. نطاق تطبيق هذه السياسة", "paragraphs": ["تنطبق هذه السياسة على جميع عمليات الدفع المتعلقة بالطلبات المقدَّمة عبر الموقع الإلكتروني أو عبر قنواتنا الرسمية على واتساب وإنستغرام. وتنطبق هذه السياسة على:", "عملاء التجزئة.", "عملاء الجملة.", "الموزّعون.", "الوكلاء."]}, {"heading": "٢.١ الأحكام الخاصة بموجب الاتفاقيات", "paragraphs": ["في حال وجود اتفاقية أو عقد خطي منفصل بين \"غولدن سيزرز\" وأحد عملاء الجملة، أو الموزّعين، أو الوكلاء، فإن أحكام الدفع الواردة في تلك الاتفاقية أو ذلك العقد هي التي تُطبَّق في حال اختلافها عن هذه السياسة. وتظل هذه السياسة سارية على أي أمر لا تتناوله تلك الاتفاقية أو ذلك العقد تحديداً."]}, {"heading": "٣. العملات المقبولة", "paragraphs": ["قد يدعم الموقع الإلكتروني عملة واحدة أو أكثر بحسب الدولة أو السوق المستهدف. وتُعد العملة المعروضة لكم أثناء إتمام عملية الشراء هي المرجع النهائي لعملية الدفع. أما أي تحويل للعملة يقوم به بنككم أو مُصدر بطاقتكم أو مزوّد خدمة الدفع، فهو إجراء يقوم به ذلك الطرف ويخرج عن سيطرة \"غولدن سيزرز\"."]}, {"heading": "٤. وسائل الدفع", "paragraphs": ["قد تشمل وسائل الدفع، على سبيل المثال لا الحصر:", "الدفع بالبطاقة.", "الدفع عند الاستلام (Cash on Delivery)، حيثما كان متوفراً.", "التحويل المصرفي، حيثما تم توفيره.", "المحافظ الرقمية، حيثما تم إضافتها."]}, {"heading": "٥. تأكيد الدفع", "paragraphs": ["تُعتبر عملية الدفع ناجحة بمجرد الموافقة عليها من قبل مزوّد خدمة الدفع أو البنك أو جهة إصدار البطاقة المعنية. ويُعتبر الطلب مؤكَّداً بمجرد استلام الدفع الناجح والتحقق منه، أو، في حالة الدفع عند الاستلام، بمجرد قبول \"غولدن سيزرز\" للطلب. وقد تقوم \"غولدن سيزرز\" بتعليق الطلب لحين التحقق من عملية الدفع قبل تأكيده."]}, {"heading": "٦. معالجة الطلبات والدفع", "paragraphs": ["بمجرد تأكيد الدفع، أو قبول طلب الدفع عند الاستلام، ينتقل الطلب إلى مرحلة التجهيز، ثم يتم إعداده لتسليمه إلى شركة التوصيل أو مندوب الشحن، وفقاً لسياسة الشحن والتوصيل الخاصة بنا. وقد تحتاج بعض الطلبات إلى مراجعة إضافية قبل بدء تجهيزها - على سبيل المثال، للتأكد من بيانات الدفع، أو التحقق من حساب عميل الجملة، أو معالجة أي خصائص أخرى غير معتادة للطلب - مما قد يطيل الوقت اللازم قبل انتقال الطلب إلى مرحلة التجهيز."]}, {"heading": "٧. الدفع عند الاستلام", "paragraphs": ["تقدم \"غولدن سيزرز\" حالياً خدمة الدفع عند الاستلام للطلبات المؤهلة داخل العراق.", "تعتمد إتاحة خدمة الدفع عند الاستلام على منطقة التوصيل، وقد لا تكون متوفرة في جميع المناطق.", "قد لا تكون خدمة الدفع عند الاستلام متاحة لبعض الطلبات، مثل الطلبات ذات القيمة المرتفعة، أو طلبات الجملة، أو الطلبات المُحدَّدة لمراجعة إضافية.", "تحتفظ \"غولدن سيزرز\" بحقها في تقييد خدمة الدفع عند الاستلام أو تعليقها أو سحبها، بشكل عام أو لطلبات محددة، حيثما كان ذلك ضرورياً لحماية عملياتها."]}, {"heading": "٨. المدفوعات الدولية", "paragraphs": ["تقبل \"غولدن سيزرز\" الطلبات المقدَّمة من عملاء خارج العراق.", "يتم الدفع مقابل الطلبات الدولية باستخدام وسائل الدفع الإلكترونية المتاحة عند إتمام الشراء للدولة أو السوق المعنية.", "قد تتواصل \"غولدن سيزرز\" مع العميل الدولي لتنسيق تفا ١٥. حدود المسؤولية", "paragraphs": ["لا تتحمل \"غولدن سيزرز\" المسؤولية عن أي تأخير أو عطل أو خسارة تنشأ عن ظروف خارجة عن إرادتها المعقولة، بما في ذلك المشاكل المتعلقة بمزوّدي خدمات الدفع، أو انقطاع الخدمات المصرفية، أو الأعطال التقنية الناجمة عن أطراف ثالثة."]}, {"heading": "١٦. العلاقة مع السياسات الأخرى", "paragraphs": ["يجب قراءة هذه السياسة إلى جانب الشروط والأحكام الخاصة بنا، وسياسة الخصوصية، وسياسة الشحن والتوصيل، وسياسة الإرجاع والاسترداد. وحيثما تتناول تلك السياسات موضوعاً معيناً بتفصيل أكبر، فإنها تكون هي المرجع الأساسي بخصوص ذلك الموضوع، ولا تكرر هذه السياسة محتواها."]}, {"heading": "١٧. تحديثات السياسة", "paragraphs": ["قد نقوم بتحديث سياسة الدفع هذه من وقت لآخر لتعكس التغييرات في ممارساتنا أو خدماتنا أو القانون المعمول به. وسيتم نشر أي تحديث على الموقع الإلكتروني مع تاريخ \"آخر تحديث\" محدَّث. وفي حال كان التغيير جوهرياً، سنتخذ خطوات معقولة لإطلاعكم عليه عبر قنواتنا الرسمية قبل أو عند دخول التغيير حيز التنفيذ."]}, {"heading": "١٨. التواصل معنا", "paragraphs": ["لأي استفسارات أو مخاوف بخصوص سياسة الدفع هذه أو أي عملية دفع قمتم بها، يُرجى التواصل معنا عبر قنواتنا الرسمية: واتساب على الرقم 964 750 400 6200+ (wa.me/9647504006200)، أو عبر إنستغرام على الحساب golden_scissors400@، أو عبر البريد الإلكتروني goldenscissors400@gmail.com. كما ترد تفاصيل التواصل الكاملة في سياسة التواصل والدعم الخاصة بنا."]}], "sectionsKuSor": [{"heading": "١. دەستپێک و مەبەستی سیاسەتەکە", "paragraphs": ["\"گۆڵدن سیزەرز\" پابەندە بەوەی کە پرۆسەی پارەدان لەسەر ماڵپەڕەکەی ڕوون، سەلامەت و دادپەروەر بێت بۆ هەموو ئەو کەسانەی کە لەگەڵیاندا کار دەکەین. ئەم سیاسەتە ڕێسا و ڕێکارەکانی کۆنتڕۆڵکردنی پرۆسەکانی پارەدانی داواکارییەکان ڕوون دەکاتەوە، تاوەکو مشتەرییەکانی تاکفرۆشی، مشتەرییەکانی کۆفرۆشی، بڵاوکاران و نوێنەران تێبگەن کە چۆن پرۆسەکانی پارەدان قبوڵ دەکرێن، پشتڕاست دەکرێنەوە و چارەسەر دەکرێن."]}, {"heading": "٢. چوارچێوەی جێبەجێکردنی ئەم سیاسەتە", "paragraphs": ["ئەم سیاسەتە لەسەر سەرجەم پرۆسەکانی پارەدانی پەیوەندیدار بەو داواکارییانەی کە لەسەر ماڵپەڕ یان لە ڕێگەی کەناڵە فەرمییەکانمانەوە لە واتساپ و ئینستاگرام پێشکەش کراون، جێبەجێ دەکرێت. ئەم سیاسەتە لەسەر ئەم توێژانەی خوارەوە جێبەجێ دەبێت:", "مشتەرییەکانی تاکفرۆشی.", "مشتەرییەکانی کۆفرۆشی.", "بڵاوکاران.", "نوێنەران."]}, {"heading": "٢.١ حوکمە تایبەتەکان لە ژێر ڕێککەوتنەکاندا", "paragraphs": ["لە حاڵەتی بوونی ڕێککەوتنێک یان گرێبەستێکی نووسراوی جودا لە نێوان \"گۆڵدن سیزەرز\" و یەکێک لە مشتەرییەکانی کۆفرۆشی، یان بڵاوکاران، یان نوێنەران، ئەوا حوکمەکانی پارەدان کە لەو ڕێککەوتن یان گرێبەستەدا هاتوون، ئەوانەن کە جێبەجێ دەکرێن ئەگەر جیاوازی لە نێوان ئەوان و ئەم سیاسەتەدا هەبێت. ئەم سیاسەتە بۆ هەر بابەتێک کە ئەو ڕێککەوتن یان گرێبەستە بە تایبەتی باسی نەکات، بە سەرکەوتوویی دەمێنێتەوە."]}, {"heading": "٣. ئەو دراوە قبوڵکراوانە", "paragraphs": ["ماڵپەڕەکە ڕەنگە پشتگیری لە یەک دراو یان پتر بکات بەپێی ئەو وڵاتە یان بازاڕە ئارمانجکراوە. ئەو دراوەی کە لە کاتی تەواوکردنی پرۆسەی کڕیندا بۆت دەردەکەوێت، سەرچاوەی کۆتاییە بۆ پرۆسەی پارەدانەکە. هەر گۆڕینی دراوێکیش کە لەلایەن بانکی تۆوە، یان دەردەری کارتەکەت، یان دابینکەری خزمەتگوزاریی پارەدانەوە ئەنجام دەدرێت، کارێکە لەلایەن ئەو لایەنەوە ئەنجام دەدرێت و لە دەسەڵاتی \"گۆڵدن سیزەرز\" دەرچووە \"."]}, {"heading": "٤. ڕێگەکانی پارەدان", "paragraphs": ["ڕێگەکانی پارەدان پێکدێن، بە بێ سنووردارکردن بۆ ئەم ڕێگەیانە:", "پارەدان بە کارت.", "پارەدان لە کاتی وەرگرتندا (Cash on Delivery)، لەو شوێنەی کە بەردەست بێت.", "گواستنەوەی بانکی، لەو شوێنەی کە دابابینکراوە.", "جزدانە دیجیتاڵییەکان، لەو شوێنەی کە زیاد کرابوون."]}, {"heading": "٥. پشتڕاستکردنەوەی پارەدان", "paragraphs": ["پرۆسەی پارەدان بە سەرکەوتوو ئەژمار دەکرێت لە کاتی پەسەندکردنیدا لەلایەن دابینکەری خزمەتگوزاریی پارەدان یان بانگ یان لایەنی دەردەری کارتە پەیوەندیدارەکە. داواکارییەکەش بە پشتڕاستکراوە ئەژمار دەکرێت لە کاتی وەرگرتنی پارەدانی سەرکەوتوو و پشکنینیدا، یان لە حاڵەتی پارەدان لە کاتی وەرگرتنیدا، لە کاتی قبوڵکردنی داواکارییەکە لەلایەن \"گۆڵدن سیزەرز\"ەوە. هەروەها \"گۆڵدن سیزەرز\" دەتوانێت داواکارییەکە ڕابگرێت تاوەکو پشکنینی پرۆسەی پارەدانەکە دەکات پێش ئەوەی پشتڕاستی بکاتەوە."]}, {"heading": "٦. چارەسەرکردنی داواکاری و پارەدانەکان", "paragraphs": ["لە کاتی پشتڕاستکردنەوەی پارەدانەکەدا، یان قبوڵکردنی داواکاریی پارەدان لە کاتی وەرگرتنیدا، داواکارییەکە دەگوازرێتەوە بۆ قۆناغی ئامادەکردن، و پاشان ئامادە دەکرێت بۆ ڕادەستکردنی بە کۆمپانیای گواستنەوە یان نوێنەری بارکردن، بەپێی سیاسەتی بارکردن و گواستنەوەمان. هەندێک داواکاریش پێویستیان بە پێداچوونەوەی زیاتر هەیە پێش دەستپێکردنی ئامادەکردنیان - بۆ نموونە، بۆ پشتڕاستکردنەوەی داتاکانی پارەدان، یان پشکنینی هەژماری مشتەریی کۆفرۆشی، یان چارەسەرکردنی هەر تایبەتمەندییەکی تری نائاسایی بۆ داواکارییەکە - کە ئەمەش لەوانەیە کاتی پێویست درێژ بکاتەوە پێش ئەوەی داواکارییەکە بۆ قۆناغی ئامادەکردن ببورێت."]}, {"heading": "٧. پارەدان لە کاتی وەرگرتن", "paragraphs": ["لە ئێستادا \"گۆڵدن سیزەرز\" خزمەتگوزاریی پارەدان لە کاتی وەرگرتندا بۆ داواکارییە شیاوەکان لە ناو عێراقدا پێشکەش دەکات.", "بوونی خزمەتگوزاریی پارەدان لە کاتی وەرگرتنیدا دەگەڕێتەوە سەر ناوچەی گواستنەوە، و ڕەنگە لە هەموو ناوچەکاندا دابین نەکرێت.", "ڕەنگە خزمەتگوزاریی پارەدان لە کاتی وەرگرتندا بۆ هەندێک داواکاری دابین نەکرێت، وەکو ئەو داواکارییانەی کە بڕەکەیان بەرزە، یان داواکارییەکانی کۆفرۆشی، یان ئەو داواکارییانەی بۆ پێداچوونەوەی زیاتر دیاری کراون.", "گۆڵدن سیزەرز\" مافی خۆی دەپارێزێت لە سنووردارکردنی خزمەتگوزاریی پارەدان لە کاتی وەرگرتنیدا یان ڕاگرتنی یان کشاندنەوەی، بە شێوازێکی گشتی یان بۆ داواکارییە دیاریکراوەکان، لەو شوێنەی کە ئەمە بۆ پاراستنی کارەکانی پێویست بێت."]}, {"heading": "٨. پارەدانە نێودەوڵەتییەکان", "paragraphs": ["\"گۆڵدن سیزەرز\" ئەو داواکارییانەی کە لە دەرەوەی عێراقەوە پێشکەش کراون قبوڵ دەکات.", "پارەدان لە بەرامبەر داواکارییە نێودەوڵەتییەکاندا بە بەکارهێنانی ڕێگەکانی پارەدانی دیجیتاڵیی بەردەست لە کاتی تەواوکردنی کڕین بۆ وڵات یان بازاڕە پەیوەندیدارەکە دەستپێدەکات.", "\"گۆڵدن سیزەرز\" دەتوانێت پەیوەندی بە مشتەرییە نێودەوڵەتییەکەوە بکات بۆ ڕێکخستنی وردەکارییەکانی پارەدان یان بارکردن لە کاتی پێویستدا بۆ تەواوکردنی داواکارییەکە."]}, {"heading": "٩. باج و ڕەسومات", "paragraphs": ["لە کاتی تەواوکردنی پرۆسەی کڕیندا یان لە لاپەڕەی بەرهەم یان بەهای پەیوەندیداردا، ئاماژە بەوە دەکرێت کە ئایا ئەم بەهایانەی لەسەر ماڵپەڕەکە نیشان دراون باج و ڕەسوماتە کارپێکراوەکان لەخۆ دەگرن یان نا. مشتەریش بەرپرسە لە هەر ڕەسوماتێکی بانکی، یان ڕەسوماتەکانی گۆڕینی دراو، یان ڕەسوماتەکانی گواستنەوە، یان ڕەسوماتەکانی گومرگی کە لەوانەیە لەسەر پرۆسەی پارەدان یان داواکارییەکە بێنە کایەوە، لەو شوێنەی کە ئەمە گونجاو بێت."]}, {"heading": "١٠. سەلامەتی پرۆسەکانی پارەدان", "paragraphs": ["\"گۆڵدن سیزەرز\" داتاکانی کارتی پارەدانی تۆ لە لای خۆی هەڵناگرێت. لەو شوێنەی کە پرۆسەکانی پارەدان لە ڕێگەی دەروازەیەکی پارەدان یان دابینکەرێکی خزمەتگوزاریی پارەدانەوە یەکلایی دەکرێنەوە، زانیارییەکانی پارەدانت ڕاستەوخۆ و بە شێوازێکی سەلامەت لەلایەن ئەو دابینکەرەوە چارەسەر دەکرێن. ئێمەش ڕێگەکانی پاراستنی گونجاو بەکار دەهێنین، وەکو دەروازەیەکی پارەدانی سەلامەت و چەقاندنی SSL، بۆ هاریکاریکردن لە پاراستنی زانیارییەکانی پارەدان لە کاتی گواستنەوەیاندا."]}, {"heading": "١١. پشکنینی پرۆسەکانی پارەدان", "paragraphs": ["\"گۆڵدن سیزەرز\" دەتوانێت لە هەندێک حاڵەتی دیاریکراودا داوای پشکنینێکی زیاتر بۆ پرۆسەی پارەدان یان داواکارییەک بکات، لەوانەش بە بێ سنووردارکردن بۆ ئەم حاڵەتانە:", "گومانکردن لە بوونی چالاکیی فێڵبازانە.", "بوونی جیاوازییەک لە داتاکانی پارەداندا.", "ئەو داواکارییانەی کە بەهایان بەرزە.", "هەر حاڵەتێکی تری کە بە شێوازێکی لۆژیکی پێویستی بە پشکنینێکی زیاتر هەبێت."]}, {"heading": "١٢. ڕەتکردنەوەی پرۆسەکانی پارەدان یان هەڵوەشاندنەوەی یاخود ڕاگرتنیان", "paragraphs": ["\"گۆڵدن سیزەرز\" دەتوانێت پرۆسەی پارەدان ڕەت بکاتەوە، یان داواکارییەک هەڵوەشێنێتەوە، یان ڕایگرێت، لەو حاڵەتانەی کە بە بێ سنووردارکردن ئەم حاڵەتانە لەخۆ دەگرن: شکستخواردنی پرۆسەی پارەدان یان ڕەتکردنەوەی، یان گومانکردن لە فێڵکردن، یان نەتوانی لە پشکنینی داتاکانی پارەدان یان هەژمارەکە، یان هەر حاڵەتێکی تری کە لەوانەیە کاریگەری لەسەر سەلامەتیی مامەڵەکە یان بەرژەوەندییەکانی \"گۆڵدن سیزەرز\" یان مشتەرییەکانی هەبێت. \"گۆڵدن سیزەرز\" مافی خۆی دەپارێزێت لە وەرگرتنی ئەو ڕێکارەی کە بە گونجاوی دەبینێت بۆ پاراستنی بەرژەوەندییەکانی لەم حاڵەتانەدا."]}, {"heading": "١٣. ئەو پارانەی کە دەگەڕێنرێنەوە", "paragraphs": ["پرۆسەکانی گەڕاندنەوەی پارە، لەو شوێنەی کە گونجاو بێت، دەکەونە ژێر بەشی سیاسەتی گەڕاندنەوە و پاشگەزبوونەوەمانەوە. تکایە سەردانی ئەو سیاسەتە بکەن بۆ زانینی وردەکارییەکانی شیاوبوون، ڕێکارەکان و ماوە دیاریکراوەکان."]}, {"heading": "١٤. دژایەتیکردنی فێڵکاری", "paragraphs": ["\"گۆڵدن سیزەرز\" مافی خۆی دەپارێزێت لە پشکنینی هەر داواکارییەک یان پرۆسەیەکی پارەدان، و ڕاگرتنی هەر مامەڵەیەکی گومانلێکراو، و داواکردنی زانیاریی زیاتر لە مشتەری، و ڕەتکردنەوەی هەر مامەڵەیەک کە بە شێوازێکی لۆژیکی گومانی لەسەر بێت کە فێڵبازانە بێت."]}, {"heading": "١٥. سنوورەکانی بەرپرسیارێتی", "paragraphs": ["\"گۆڵدن سیزەرز\" بەرپرسیارێتی هەڵناگرێت لەسەر هیچ دواکەوتنێک، یان تێکچوونێک، یان لەدەستدانێک کە لە بارودۆخەکانی دەرەوەی دەسەڵاتی لۆژیکییەوە سەرچاوە بگرێت، لەوانەش ئەو سەرۆکانەی پەیوەندیدارن بە دابینکەرانی خزمەتگوزارییەکانی پارەدان، یان پچڕانی خزمەتگوزارییە بانکییەکان، یان هەڵە تەکنیکییەکانی کە لەلایەن لایەنی سێیەمەوە دروست دەبن."]}, {"heading": "١٦. پەیوەندی لەگەڵ سیاسەتەکانی تردا", "paragraphs": ["پێویستە ئەم سیاسەتە لەگەڵ مەرج و ڕێساکانمان، و سیاسەتی نهێنیپارێزی، و سیاسەتی بارکردن و گواستنەوە، و سیاسەتی گەڕاندنەوە و پاشگەزبوونەوەدا بخوێنرێتەوە. لەو شوێنەی کە ئەم سیاسەتە بابەتێک بە وردەکاریی زیاترەوە دەهێڵێتەوە، ئەوا ئەو دەبێتە سەرچاوەی سەرەکی سەبارەت بەو بابەتە و ئەم سیاسەتە ناوەرۆکەکەی دووبارە ناکاتەوە."]}, {"heading": "١٧. نوێکردنەوەکانی سیاسەت", "paragraphs": ["ئێمە دەتوانین ئەم سیاسەتی پارەدانە لە کاتێکەوە بۆ کاتێکی تر نوێ بکەینەوە بۆ نیشاندانی گۆڕانکارییەکان لە ناو کارەکانمان یان خزمەتگوزارییەکانمان یان یاسا کارپێکراوەکاندا. هەر نوێکردنەوەیەکیش لەسەر ماڵپەڕەکە لەگەڵ ڕێکەوتی \"دوایین نوێکردنەوە\" کە هاتووە بڵاو دەکرێتەوە. لە حاڵەتی گۆڕانکاریی سەرەکیدا، ئێمە هەنگاوی لۆژیکی هەڵدەگرین بۆ ئاگادارکردنەوەت لە ڕێگەی کەناڵە فەرمییەکانمانەوە پێش یان لە کاتی چوونە بواری جێبەجێکردنی گۆڕانکارییەکەدا."]}, {"heading": "١٨. پەیوەندیکردن لەگەڵ ئێمەدا", "paragraphs": ["بۆ هەر پرسیارێک یان گومانێک سەبارەت بە ئەم سیاسەتی پارەدانە یان هەر پرۆسەیەکی پارەدان کە ئەنجامت داوە، تکایە پەیوەندیمان پێوە بکەن لە ڕێگەی کەناڵە فەرمییەکانمانەوە: واتساپ لەسەر ژمارەی
