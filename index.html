ەرمییەکانمانەوە، بۆ کڕیارانی تاک، کڕیارانی کۆ، دابەشکاران و بریکاران، لە ناوخۆی عێراق و دەرەوەیدا. هەروەها ئەم سیاسەتە بژاردەکانی گەیاندنی بەردەست، شێوازی کارکردنی ماوە خەمڵێنراوەکانی گەیاندن، و بەرپرسیارێتییەکانی هەردوو لایەن واتە \"گۆڵدن سیزەرز\" و کڕیار ڕوون دەکاتەوە. پێشکەشکردنی داواکارییەکی کڕین لە ڕێگەی ماڵپەڕەوە یان هەر کەناڵێکی فەرمیی ترەوە بە مانای ڕەزامەندی ئێوەیە لەسەر ئەم سیاسەتە", "introKuBad": "تشتێ سیاسەتا هنارتن و گەهاندنێ روهکن دکەت کو چەوا \"گولدن سیزرز\" داخوازیا ئامادە دکەت،دهنێرین و دگەهینت ب رێکا مالپەرێ gscissors.com و کەناڵێن مە یێن فەرمی، بۆ بکرێ تاک (تجزئة)، بکرێ کۆم (جملە)، بەلاڤکەر و بریکاران، د ناڤ ئیراقێ و ژ دەرڤەی وەڵاتی. ئەڤ سیاسەتە بژاردەیێن گەهاندنێ یێن هەین، سیستەمێ ماوێن گەهاندنێ یێن مەزەندەکری، و بەرپرسیارەتیێن هەردوو ئالییان یێن \"گولدن سیزرز\" و بکری دیار دکەت. پێشکێشکرنا داخوازیا کرینێ رێکا مالپەرێ ئەلکترۆنی یان هەر کەناڵەکێ فەرمی، ب خۆ رازەمەندیا وە هەژمار دبیت لسەر ڤێ سیاسەتێ", "sectionsEn": [{"heading": "1. Introduction and Purpose", "paragraphs": ["Golden Scissors is committed to preparing, shipping, and delivering Orders in a clear and reliable way for everyone we serve. This Policy sets out the delivery options available, how Orders move from confirmation to delivery, and the responsibilities of both Golden Scissors and the customer, so that Retail Customers, Wholesale Customers, Distributors, and Agents all understand how shipping and delivery work, both within Iraq and internationally."]}, {"heading": "2. Scope of This Policy", "paragraphs": ["This Policy applies to the shipping and delivery of all Orders placed through the Website or through our official WhatsApp and Instagram channels. It applies to:", "Retail Customers.", "Wholesale Customers.", "Distributors.", "Agents."]}, {"heading": "2.1 Agreement-Specific Arrangements", "paragraphs": ["Where Golden Scissors has entered into a separate written agreement or contract with a Wholesale Customer, Distributor, or Agent, the shipping and delivery arrangements set out in that agreement or contract will govern to the extent they differ from this Policy. This Policy continues to apply to any matter not specifically addressed in such an agreement or contract."]}, {"heading": "3. Service Areas", "paragraphs": ["Golden Scissors delivers Orders within the following general service areas:", "Domestic Deliveries — within Iraq.", "International Deliveries — to customers located outside Iraq."]}, {"heading": "3.1 Expansion of Service Areas", "paragraphs": ["Golden Scissors may expand its service areas to include additional countries or markets over time. This Policy applies to any new service area without requiring a change to its structure."]}, {"heading": "4. Delivery Methods", "paragraphs": ["Depending on the customer's location, the nature of the Order, and operational availability, Golden Scissors may use one or more of the following delivery methods:", "Factory Delivery, where offered.", "Local delivery companies or courier partners.", "Factory Pickup, for customers who prefer to collect their Order directly.", "Any other delivery method Golden Scissors may adopt in the future."]}, {"heading": "5. Order Processing", "paragraphs": ["Order processing begins once the applicable payment requirements have been met, in accordance with our Payment Policy — that is, once payment has been confirmed or, for Cash on Delivery Orders, once the Order has been accepted. Processing times are estimates and may vary depending on the nature of the Order, product availability, and current order volume."]}, {"heading": "6. Estimated Delivery Time", "paragraphs": ["Delivery times shown on the Website or communicated to a customer are estimates only, generally expressed in business days and depending on the destination, and remain subject to operational conditions. Golden Scissors does not guarantee specific delivery dates, and estimated delivery times may change without prior notice due to factors beyond its control."]}, {"heading": "7. International Orders", "paragraphs": ["Golden Scissors accepts Orders from customers located outside Iraq.", "Following receipt of an international Order, Golden Scissors will coordinate with the customer to determine the most suitable shipping and delivery method.", "Shipping costs, delivery methods, and procedures for international Orders may vary depending on the destination country and the shipping company involved."]}, {"heading": "8. Shipping Fees", "paragraphs": ["Shipping fees are calculated during the ordering process or prior to Order confirmation and are shown to the customer before payment is completed. Shipping fees may vary depending on factors such as delivery location, weight, size, and the delivery method selected."]}, {"heading": "9. Customer Responsibility", "paragraphs": ["To help ensure a smooth delivery, customers are responsible for:", "Providing accurate and complete order and contact information.", "Providing a clear and correct delivery address.", "Responding to the delivery company or Golden Scissors when contact is needed to complete delivery.", "Receiving the Order within the agreed delivery window."]}, {"heading": "10. Delivery Delays", "paragraphs": ["Golden Scissors makes reasonable efforts to deliver Orders within the estimated delivery time. However, delays may occur due to circumstances beyond Golden Scissors' reasonable control, including but not limited to:", "Weather conditions.", "Security-related circumstances.", "Official holidays.", "Technical malfunctions.", "Delays caused by shipping companies or carriers."]}, {"heading": "10.1 Notification of Delays", "paragraphs": ["Where a delay is likely to materially affect a customer's Order, Golden Scissors will make reasonable efforts to inform the customer through our official channels."]}, {"heading": "11. Failed Delivery", "paragraphs": ["In the event that delivery cannot be completed — for example, because the customer could not be reached, the customer declined to accept the Order, the delivery address provided was incorrect, or the Order was not collected within the specified period — Golden Scissors may take appropriate action, which may include attempting redelivery, contacting the customer to arrange collection, or handling the Order in accordance with applicable terms, potentially subject to additional fees."]}, {"heading": "12. Transfer of Responsibility", "paragraphs": ["Responsibility for an Order transfers to the customer:", "Upon actual delivery of the Order to the customer or their designated recipient;", "Upon collection of the Order by the customer under Factory Pickup; or", "Upon handover of the Order to the shipping company, where a separate agreement with a Wholesale Customer, Distributor, or Agent specifically provides for this."]}, {"heading": "13. Special Orders", "paragraphs": ["Certain Orders, such as:", "Large-volume Orders.", "Wholesale Orders.", "Distributor Orders.", "Agent Orders."]}, {"heading": "13.1 Special Arrangements", "paragraphs": ["may be subject to special shipping and delivery arrangements agreed separately between Golden Scissors and the relevant customer."]}, {"heading": "14. Limitation of Liability", "paragraphs": ["Golden Scissors does not guarantee delivery within a specific timeframe and is not responsible for delays, losses, or damages arising from circumstances beyond its reasonable control, including but not limited to actions or omissions of third-party shipping companies, customs authorities, or other delivery partners."]}, {"heading": "15. Relationship to Other Policies", "paragraphs": ["This Policy should be read together with our Terms & Conditions, Payment Policy, Return & Refund Policy, and Privacy Policy. Where those policies address a topic in more detail, they take precedence for that topic, and this Policy does not repeat their content."]}, {"heading": "16. Policy Updates", "paragraphs": ["We may update this Shipping & Delivery Policy from time to time to reflect changes in our practices, our services, or applicable law. Any update will be posted on the Website with a revised \"Last Updated\" date. Where a change is material, we will take reasonable steps to bring it to your attention through our official channels prior to, or at the time of, the change taking effect."]}, {"heading": "17. Contact Us", "paragraphs": ["For any questions or concerns regarding this Shipping & Delivery Policy or the status of your Order, please contact us through our official channels: WhatsApp +964 750 400 6200 (wa.me/9647504006200), Instagram @golden_scissors400, or email goldenscissors400@gmail.com. Full contact details are also set out in our Contact & Support Policy."]}], "sectionsAr": [{"heading": "١. المقدمة والغرض من السياسة", "paragraphs": ["تلتزم \"غولدن سيزرز\" بتجهيز الطلبات وشحنها وتسليمها بطريقة واضحة وموثوقة لكل من نتعامل معهم. وتوضح هذه السياسة خيارات التوصيل المتاحة، وكيفية انتقال الطلبات من التأكيد إلى التسليم، ومسؤوليات كل من \"غولدن سيزرز\" والعميل، بحيث يفهم عملاء التجزئة، وعملاء الجملة، والموزّعون، والوكلاء آلية عمل الشحن والتوصيل، داخل العراق وخارجه."]}, {"heading": "٢. نطاق تطبيق هذه السياسة", "paragraphs": ["تنطبق هذه السياسة على شحن وتسليم جميع الطلبات المقدَّمة عبر الموقع الإلكتروني أو عبر قنواتنا الرسمية على واتساب وإنستغرام. وتنطبق هذه السياسة على:", "عملاء التجزئة.", "عملاء الجملة.", "الموزّعون.", "الوكلاء."]}, {"heading": "٢.١ الترتيبات الخاصة بموجب الاتفاقيات", "paragraphs": ["في حال وجود اتفاقية أو عقد خطي منفصل بين \"غولدن سيزرز\" وأحد عملاء الجملة، أو الموزّعين، أو الوكلاء، فإن ترتيبات الشحن والتوصيل الواردة في تلك الاتفاقية أو ذلك العقد هي التي تُطبَّق في حال اختلافها عن هذه السياسة. وتظل هذه السياسة سارية على أي أمر لا تتناوله تلك الاتفاقية أو ذلك العقد تحديداً."]}, {"heading": "٣. مناطق الخدمة", "paragraphs": ["تقوم \"غولدن سيزرز\" بتسليم الطلبات ضمن مناطق الخدمة العامة التالية:", "التوصيل الداخلي - ضمن العراق.", "التوصيل الدولي - للعملاء خارج العراق."]}, {"heading": "٣.١ توسيع مناطق الخدمة", "paragraphs": ["قد توسّع \"غولدن سيزرز\" مناطق خدمتها لتشمل دولاً أو أسواقاً إضافية مع مرور الوقت. وتنطبق هذه السياسة على أي منطقة خدمة جديدة دون الحاجة إلى تعديل هيكلها."]}, {"heading": "٤. طرق التوصيل", "paragraphs": ["بحسب موقع العميل، وطبيعة الطلب، والإمكانيات التشغيلية المتاحة، قد تعتمد \"غولدن سيزرز\" واحدة أو أكثر من طرق التوصيل التالية:", "التوصيل من المصنع، حيثما كان متوفراً.", "شركات التوصيل المحلية أو شركاء الشحن.", "الاستلام من المصنع، للعملاء الذين يفضلون استلام طلباتهم مباشرة.", "أي وسيلة توصيل أخرى قد تعتمدها \"غولدن سيزرز\" مستقبلاً."]}, {"heading": "٥. تجهيز الطلبات", "paragraphs": ["يبدأ تجهيز الطلب بمجرد استيفاء متطلبات الدفع المعمول بها، وفقاً لسياسة الدفع الخاصة بنا - أي بمجرد تأكيد الدفع، أو، في حالة طلبات الدفع عند الاستلام، بمجرد قبول الطلب. وتُعد أوقات التجهيز تقديرية وقد تختلف بحسب طبيعة الطلب، وتوفر المنتج، وحجم الطلبات الحالي."]}, {"heading": "٦. مدة التسليم التقديرية", "paragraphs": ["تُعد مدد التسليم المعروضة على الموقع الإلكتروني أو التي يتم إبلاغ العميل بها تقديرية فقط، ويُعبَّر عنها عادةً بأيام العمل وبحسب الوجهة، وتبقى خاضعة للظروف التشغيلية. ولا تضمن \"غولدن سيزرز\" مواعيد تسليم محددة، وقد تتغير مدد التسليم التقديرية دون إشعار مسبق نتيجة عوامل خارجة عن إرادتها."]}, {"heading": "٧. الطلبات الدولية", "paragraphs": ["تقبل \"غولدن سيزرز\" الطلبات المقدَّمة من عملاء خارج العراق.", "بعد استلام الطلب الدولي، ستقوم \"غولدن سيزرز\" بالتنسيق مع العميل لتحديد أنسب وسيلة للشحن والتسليم.", "قد تختلف تكاليف الشحن، ووسائل التوصيل، والإجراءات الخاصة بالطلبات الدولية بحسب الدولة الوجهة وشركة الشحن المعنية."]}, {"heading": "٨. رسوم الشحن", "paragraphs": ["يتم احتساب رسوم الشحن أثناء عملية الطلب أو قبل تأكيده، وتُعرض على العميل قبل إتمام الدفع. وقد تختلف رسوم الشحن بحسب عوامل مثل موقع التسليم، والوزن، والحجم، وطريقة التوصيل المختارة."]}, {"heading": "٩. مسؤولية العميل", "paragraphs": ["للمساعدة في ضمان تسليم سلس، يكون العميل مسؤولاً عن:", "تقديم بيانات طلب وتواصل صحيحة وكاملة.", "تقديم عنوان تسليم واضح وصحيح.", "الرد على شركة التوصيل أو \"غولدن سيزرز\" عند الحاجة إلى التواصل لإتمام التسليم.", "استلام ا وەی خەمڵێنراوی گەیاندن", "paragraphs": ["ئەو ماوە خەمڵێنراوانەی گەیاندن کە لەسەر ماڵپەڕی فەرمی نیشان دەدرێن یان بە کڕیار ڕادەگەیەنرێن تەنها خەمڵێنراون، و بە شێوازێکی گشتی بە رۆژانی کار و بەپێی شوێنی مەبەست دەردەبرێن، و لە هەمان کاتدا لە ژێر کاریگەری بارودۆخی کارپێکردندا دەمێننەوە. \"گۆڵدن سیزەرز\" هیچ کاتێك بەڵێنی کاتی گەیاندنی دیاریکراو نادات، و لەوانەیە ماوە خەمڵێنراوەکانی گەیاندن بێ ئاگادارکردنەوەی پێشوەختە بگۆڕێن لە ئەنجامی هۆکارە دەرەکییەکانی دەرەوەی ئیرادەی کارگە."]}, {"heading": "٧. داواکارییە نێودەوڵەتییەکان", "paragraphs": ["\"گۆڵدن سیزەرز\" ئەو داواکارییانە قبوڵ دەکات کە لەلایەن کڕیارانی دەرەوەی عێراقەوە پێشکەش دەکرێن.", "وای وەرگرتنی داواکارییە نێودەوڵەتییەکە، \"گۆڵدن سیزەرز\" هەماهەنگی لەگەڵ کڕیاردا دەکات بۆ دیاریکردنی گونجاوترین ڕێگا بۆ ناردن و گەیاندن.", "ێچوونی ناردن، ڕێگاکانی گەیاندن، و ڕێکارە تایبەتەکان بۆ داواکارییە نێودەوڵەتییەکان لەوانەیە بەپێی وڵاتی مەبەست و کۆمپانیای ناردنی پەیوەندیدار جیاواز بن."]}, {"heading": "٨. تێچوونی ناردن", "paragraphs": ["تێچوونی ناردن لە کاتی پرۆسەی پێشکەشکردنی داواکاری یان پێش پشتڕاستکردنەوەی هەژمار دەکرێت، و پێش تەواوکردنی پرۆسەی پارەدان بە کڕیار نیشان دەدرێت. هەروەها تێچوونی ناردن لەوانەیە بەپێی هەندێک هۆکار وەک شوێنی گەیاندن، کێش، قەبارە، و ڕێگای هەڵبژێردراوی گەیاندن جیاواز بێت"]}, {"heading": ". ٩. بەرپرسیارێتی کڕیار", "paragraphs": ["بۆ یارمەتیدان لە دابینکردنی پرۆسەیەکی گەیاندنی ئاسان، کڕیار بەرپرسیارە لە:", "پێشکەشکردنی زانیاری دروست و تەواوی داواکاری و پەیوەندیکردن.", "ێشکەشکردنی ناونیشانێکی گەیاندنی ڕوون و دروست.", "وەڵامدانەوەی کۆمپانیای گەیاندن یان \"گۆڵدن سیزەرز\" لە کاتی پێویستبوونی پەیوەندیکردن بۆ تەواوکردنی گەیاندنەکە.", "وەرگرتنی داواکارییەکە لە ماوەی گەیاندنی ڕێککەوتن لەسەرکراود."]}, {"heading": "١٠. دواکەوتنی گەیاندن", "paragraphs": ["\"گۆڵدن سیزەرز\" هەوڵێکی گونجاو دەدات بۆ گەیاندنی داواکارییەکان لە ناو ماوەی خەمڵێنراوی گەیاندندا. لەگەڵ ئەوەشدا، لەوانەیە دواکەوتن ڕووبدات بەهۆی بارودۆخێکی دەرەوەی دەسەڵاتی لۆژیکی \"گۆڵدن سیزەرز\"، کە ئەمانەی خوارەوە لەخۆ دەگرێت بەڵام تەنها بەم مەرجانە سنوردار نییە:", برنا کارێن خوە یێن دیزاین و جلوبەرگان ب بەرپرسیاری. پێشکێشکرنا هەر داخوازییەکا کڕینێ ب رێکا مالپەرێ ئەلیکترۆنی یان هەر کەناڵەکێ فەرمی، وەک رازەمەندییا تە دهێتە دانان ل سەر ڤێ سداسەتیێ.", "sectionsEn": [{"heading": "1. Introduction and Purpose", "paragraphs": ["Golden Scissors wants Retail Customers, Wholesale Customers, Distributors, and Agents to feel confident when placing an Order. This Policy explains how returns, exchanges, and refunds are handled, so that the process is clear and fair for everyone, while protecting Golden Scissors' ability to operate its fashion and apparel business responsibly. This Policy is intended to remain workable as Golden Scissors' product range, markets, and services — including any warranty offerings introduced in the future — continue to grow."]}, {"heading": "2. Scope of This Policy", "paragraphs": ["This Policy applies to returns, exchanges, and refunds relating to Orders placed through the Website or through our official WhatsApp and Instagram channels. It applies to:", "Retail Customers.", "Wholesale Customers.", "Distributors.", "Agents."]}, {"heading": "2.1 Agreement-Specific Terms", "paragraphs": ["Where Golden Scissors has entered into a separate written agreement or contract with a Wholesale Customer, Distributor, or Agent, the return, exchange, and refund terms set out in that agreement or contract will govern to the extent they differ from this Policy. This Policy continues to apply to any matter not specifically addressed in such an agreement or contract."]}, {"heading": "3. Return Eligibility", "paragraphs": ["To be eligible for return, a product must generally meet conditions such as:", "Being in its original condition.", "Showing no use or damage caused by the customer.", "Being accompanied by proof of purchase, where applicable.", "Being submitted for return within the period specified by Golden Scissors, as shown at checkout, on the order confirmation, or on the Website."]}, {"heading": "3.1 Changes to the Return Period", "paragraphs": ["Golden Scissors may update the applicable return period from time to time. The period in effect at the time an Order is placed is the one that applies to it."]}, {"heading": "4. Non-Returnable Items", "paragraphs": ["Certain products may not be eligible for return, including but not limited to:", "Used products.", "Customized or modified products.", "Products damaged due to misuse.", "Any other category identified by Golden Scissors."]}, {"heading": "5. Return Process", "paragraphs": ["The general return process includes the following steps:", "Submitting a return request.", "Review of the request by Golden Scissors.", "Approval or rejection of the request.", "Return of the product, where approved.", "Inspection of the returned product.", "A final decision on the return."]}, {"heading": "6. Exchanges", "paragraphs": ["Where appropriate, Golden Scissors may offer to exchange a product instead of issuing a refund. Whether an exchange is offered, and the products available for exchange, is determined at Golden Scissors' discretion in accordance with this Policy."]}, {"heading": "7. Refunds", "paragraphs": ["Where a refund applies, it will be handled as follows:", "Refunds are issued where a return or refund request has been approved in accordance with this Policy.", "Refunds are generally issued to the original payment method, or through another suitable method determined by Golden Scissors.", "The time required to process a refund may vary depending on the relevant payment provider or bank."]}, {"heading": "8. Shipping Fees for Returns", "paragraphs": ["Responsibility for shipping fees related to a return — including the original shipping fee, the fee for returning the product, and any other related fees — may vary depending on the reason for the return, and will be communicated to the customer as part of the return process."]}, {"heading": "9. Damaged or Incorrect Products", "paragraphs": ["This section applies where:", "A product arrives damaged.", "A product received does not match the Order.", "A product has a manufacturing defect."]}, {"heading": "9.1 Resolution", "paragraphs": ["In such cases, Golden Scissors will review the matter and take appropriate action, which may include a replacement, an exchange, or a refund, in accordance with this Policy."]}, {"heading": "10. Wholesale, Distributor, and Agent Orders", "paragraphs": ["Orders placed by Wholesale Customers, Distributors, and Agents may be subject to different return, exchange, and refund terms in accordance with the relevant signed agreements or contracts."]}, {"heading": "11. Golden Scissors' Rights", "paragraphs": ["Golden Scissors reserves the right to:", "Decline any return, exchange, or refund request that does not meet the conditions of this Policy.", "Request additional information or photos to assess a request.", "Inspect a product before approving a return, exchange, or refund."]}, {"heading": "12. Limitation of Liability", "paragraphs": ["Golden Scissors' liability in connection with returns, exchanges, and refunds is limited to what is set out in this Policy and any applicable agreement, and to the extent permitted by law."]}, {"heading": "13. Relationship to Other Policies", "paragraphs": ["This Policy should be read together with our Terms & Conditions, Payment Policy, Shipping & Delivery Policy, and Privacy Policy. Where those policies address a topic in more detail, they take precedence for that topic, and this Policy does not repeat their content."]}, {"heading": "14. Policy Updates", "paragraphs": ["We may update this Return & Refund Policy from time to time to reflect changes in our practices, our services, or applicable law. Any update will be posted on the Website with a revised \"Last Updated\" date. Where a change is material, we will take reasonable steps to bring it to your attention through our official channels prior to, or at the time of, the change taking effect."]}, {"heading": "15. Contact Us", "paragraphs": ["For any questions or concerns regarding this Return & Refund Policy or a return, exchange, or refund request, please contact us through our official channels: WhatsApp +964 750 400 6200 (wa.me/9647504006200), Instagram @golden_scissors400, or email goldenscissors400@gmail.com. Full contact details are also set out in our Contact & Support Policy."]}], "sectionsAr": [{"heading": "١. المقدمة والغرض من السياسة", "paragraphs": ["تحرص \"غولدن سيزرز\" على أن يشعر عملاء التجزئة، وعملاء الجملة، والموزّعون، والوكلاء بالثقة عند تقديم طلباتهم. وتوضح هذه السياسة كيفية التعامل مع طلبات الإرجاع والاستبدال والاسترداد، بحيث تكون العملية واضحة وعادلة للجميع، مع الحفاظ على قدرة \"غولدن سيزرز\" على إدارة أعمالها في مجال الأزياء والملابس بمسؤولية. وتهدف هذه السياسة إلى أن تبقى قابلة للتطبيق مع استمرار نمو تشكيلة منتجات \"غولدن سيزرز\" وأسواقها وخدماتها - بما في ذلك أي خدمات ضمان قد تُستحدث مستقبلاً."]}, {"heading": "٢. نطاق تطبيق هذه السياسة", "paragraphs": ["تنطبق هذه السياسة على طلبات الإرجاع والاستبدال والاسترداد المتعلقة بالطلبات المقدَّمة عبر الموقع الإلكتروني أو عبر قنواتنا الرسمية على واتساب وإنستغرام. وتنطبق هذه السياسة على:", "عملاء التجزئة.", "عملاء الجملة.", "الموزّعون.", "الوكلاء."]}, {"heading": "٢.١ الأحكام الخاصة بموجب الاتفاقيات", "paragraphs": ["في حال وجود اتفاقية أو عقد خطي منفصل بين \"غولدن سيزرز\" وأحد عملاء الجملة، أو الموزّعين، أو الوكلاء، فإن أحكام الإرجاع والاستبدال والاسترداد الواردة في تلك الاتفاقية أو ذلك العقد هي التي تُطبَّق في حال اختلافها عن هذه السياسة. وتظل هذه السياسة سارية على أي أمر لا تتناوله تلك الاتفاقية أو ذلك العقد تحديداً."]}, {"heading": "٣. أهلية الإرجاع", "paragraphs": ["لكي يكون المنتج مؤهلاً للإرجاع، يجب أن يستوفي بشكل عام شروطاً مثل:", "أن يكون بحالته الأصلية.", "ألا يظهر عليه أي استخدام أو تلف ناتج عن العميل.", "أن يكون مصحوباً بإثبات الشراء، حيثما كان ذلك منطبقاً.", "أن يُقدَّم طلب إرجاعه خلال المدة التي تحددها \"غولدن سيزرز\"، كما هي موضحة عند إتمام الشراء، أو في تأكيد الطلب، أو على الموقع الإلكتروني."]}, {"heading": "٣.١ التغييرات على مدة الإرجاع", "paragraphs": ["قد تقوم \"غولدن سيزرز\" بتحديث مدة الإرجاع المعمول بها من وقت لآخر. والمدة السارية وقت تقديم الطلب هي التي تُطبَّق عليه."]}, {"heading": "٤. المنتجات غير القابلة للإرجاع", "paragraphs": ["قد لا تكون بعض المنتجات مؤهلة للإرجاع، وتشمل على سبيل المثال لا الحصر:", "المنتجات المستخدمة.", "المنتجات المعدَّلة أو المخصَّصة.", "المنتجات المتضررة بسبب سوء الاستخدام.", "أي فئة أخرى تحددها \"غولدن سيزرز\"."]}, {"heading": "٥. إجراءات طلب الإرجاع", "paragraphs": ["تشمل إجراءات الإرجاع العامة الخطوات التالية:", "تقديم طلب الإرجاع.", "مراجعة \"غولدن سيزرز\" للطلب.", "الموافقة على الطلب أو رفضه.", "إعادة المنتج، في حال الموافقة.", "فحص المنتج المُعاد.", "اتخاذ القرار النهائي بشأن الإرجاع."]}, {"heading": "٦. الاستبدال", "paragraphs": ["قد تعرض \"غولدن سيزرز\"، حيثما كان ذلك مناسباً، استبدال المنتج بدلاً من استرداد قيمته. ويُترك تحديد إمكانية عرض الاستبدال، والمنتجات المتاحة له، لتقدير \"غولدن سيزرز\" وفقاً لهذه السياسة."]}, {"heading": "٧. الاسترداد", "paragraphs": ["حيثما كان الاسترداد منطبقاً، يتم التعامل معه على النحو التالي:", "يتم إصدار الاسترداد في حال الموافقة على طلب الإرجاع أو الاسترداد وفقاً لهذه السياسة.", "يتم الاسترداد بشكل عام إلى وسيلة الدفع الأصلية، أو من خلال أي وسيلة أخرى مناسبة تحددها \"غولدن سيزرز\".", "قد تختلف المدة اللازمة لمعالجة الاسترداد بحسب مزود خدمة الدفع أو البنك المعني."]}, {"heading": "٨. رسوم الشحن المتعلقة بالإرجاع", "paragraphs": ["قد تختلف المسؤولية عن رسوم الشحن المتعلقة بالإرجاع - بما في ذلك رسوم الشحن الأصلية، ورسوم إعادة المنتج، وأي رسوم أخرى ذات صلة - بحسب سبب الإرجاع، وسيتم إبلاغ العميل بذلك كجزء من إجراءات الإرجاع."]}, {"heading": "٩. المنتجات التالفة أو الخاطئة", "paragraphs": ["ينطبق هذا القسم في الحالات التالية:", "وصول منتج تالف.", "استلام منتج لا يطابق الطلب.", "وجود عيب تصنيع في المنتج."]}, {"heading": "٩.١ الحل", "paragraphs": ["في هذه الحالات، ستقوم \"غولدن سيزرز\" بمراجعة الأمر واتخاذ الإجراء المناسب، والذي قد يشمل الاستبدال، أو المبادلة، أو الاسترداد، وفقاً لهذه السياسة."]}, {"heading": "١٠. طلبات الجملة والموزّعين والوكلاء", "paragraphs": ["قد تخضع الطلبات المقدَّمة من عملاء الجملة، والموزّعين، والوكلاء لشروط إرجاع واستبدال واسترداد مختلفة وفقاً للاتفاقيات أو العقود الموقّعة ذات الصلة."]}, {"heading": "١١. حقوق \"غولدن سيزرز\"", "paragraphs": ["تحتفظ \"غولدن سيزرز\" بالحق في:", "رفض أي طلب إرجاع أو استبدال أو استرداد لا يستوفي شروط هذه السياسة.", "طلب معلومات أو صور إضافية لتقييم الطلب.", "فحص المنتج قبل الموافقة على الإرجاع أو الاستبدال أو الاسترداد."]}, {"heading": "١٢. حدود المسؤولية", "paragraphs": ["تقتصر مسؤولية \"غولدن سيزرز\" فيما يتعلق بعمليات الإرجاع والاستبدال والاسترداد على ما تنص عليه هذه السياسة وأي اتفاقية معمول بها، وفي الحدود التي يسمح بها القانون."]}, {"heading": "١٣. العلاقة مع السياسات الأخرى", "paragraphs": ["يجب قراءة هذه السياسة إلى جانب الشروط والأحكام الخاصة بنا، وسياسة الدفع، وسياسة الشحن والتوصيل، وسياسة الخصوصية. وحيثما تتناول تلك السياسات موضوعاً معيناً بتفصيل أكبر، فإنها تكون هي المرجع الأساسي بخصوص ذلك الموضوع، ولا تكرر هذه السياسة محتواها."]}, {"heading": "١٤. تحديثات السياسة", "paragraphs": ["قد نقوم بتحديث سياسة الإرجاع والاسترداد هذه من وقت لآخر لتعكس التغييرات في ممارساتنا أو خدماتنا أو القانون المعمول به. وسيتم نشر أي تحديث على الموقع الإلكتروني مع تاريخ \"آخر تحديث\" محدَّث. وفي حال كان التغيير جوهرياً، سنتخذ خطوات معقولة لإطلاعكم عليه عبر قنواتنا الرسمية قبل أو عند دخول التغيير حيز التنفيذ."]}, {"heading": "١٥. التواصل معنا", "paragraphs": ["لأي استفسارات أو مخاوف بخصوص سياسة الإرجاع والاسترداد هذه أو طلب إرجاع أو استبدال أو استرداد، يُرجى التواصل معنا عبر قنواتنا الرسمية: واتساب على الرقم 964 750 400 6200+ (wa.me/9647504006200)، أو عبر إنستغرام على الحساب golden_scissors400@، أو عبر البريد الإلكتروني goldenscissors400@gmail.com. كما ترد تفاصيل التواصل الكاملة في سياسة التواصل والدعم الخاصة بنا."]}], "sectionsKuSor": [{"heading": "١ پێشەکی و مەبەستی سیاسەتەکە", "paragraphs": ["کۆمپانیای \"گۆڵدن سیزەرز\" تامەزرۆیە بۆ ئەوەی کڕیارانی تاك، کڕیارانی کۆ، دابەشکەران و بریکارەکان هەست بە متمانە بکەن لە کاتی پێشکەشکردنی داواکارییەکانیان. ئەم سیاسەتە ڕوونی دەکاتەوە کە چۆن مامەڵە لەگەڵ داواکارییەکانی گەڕاندنەوە، گۆڕینەوە و قەرەبووکردنەوە دەکرێت، بە جۆرێک کە پرۆسەکە بۆ هەمووان ڕوون و دادپەروەر بێت. ئامانج لەم سیاسەتە ئەوەیە کە لەگەڵ گەشەسەندنی بەردوامی بەرهەمەکان، بازاڕەکان و خزمەتگوزارییەکانی \"گۆڵدن سیزەرز\"دا بە کارا بمێنێتەوە – لەوانەش هەر خزمەتگوزارییەکی دڵنیایی (ضمان) کە لە داهاتوودا دابمەزرێت."]}, {"heading": "٢. مەودای جێبەجێکردنی ئەم سیاسەتە", "paragraphs": ["ئەم سیاسەتە جێبەجێ دەکرێت لەسەر داواکارییەکانی گەڕاندنەوە، گۆڕینەوە و قەرەبووکردنەوە کە پەیوەندیدارن بەو داواکارییانەی لە ڕێگەی ماڵپەڕی ئەلیکترۆنی یان کەناڵە فەرمییەکانمان لە واتسአپ و ئینستاگرام پێشکەش کراون. ئەم سیاسەتە بۆ ئەم لایەنانەی خوارەوە دەگونجێت:", "کڕیارانی تاکەکەس (تجزئة).", "کڕیارانی کۆ (جملة).", "دابەشکەران.", "بریکارەکان."]}, {"heading": "٢.١ بڕگە تایبەتەکان بە پێی ڕێککەوتننامەکان", "paragraphs": ["لە حالەتی بوونی ڕێککەوتننامە یان گرێبەستێکی نووسراوی جیاواز لە نێوان \"گۆڵدن سیزەرز\" و یەکێک لە کڕیارانی کۆ، دابەشکەران یان بریکارەکاندا، ئەوا بڕگەکانی گەڕاندنەوە، گۆڕینەوە و قەرەبووکردنەوەی ناو ئەو ڕێککەوتننامە یان گرێبەستە پەیڕەو دەکرێن ئەگەر جیاواز بن لەم سیاسەتە. لەگەڵ ئەوەشدا، ئەم سیاسەتە بۆ هەر بابەتێک کە لەو گرێبەستەدا بە دیاریکراوی باس نەکرابێت بە کارا دەمێنێتەوە."]}, {"heading": "٣. مەرجی گەڕاندنەوە", "paragraphs": ["بۆ ئەوەی بەرهەمێک شایستەی گەڕاندنەوە بێت، بە شێوەیەکی گشتی دەبێت مەرجەکانی خوارەوە تێدابێت:", "لە دۆخی سەرەتایی خۆیدا بێت.", "هیچ نیشانەیەکی بەکارهێنان یان زیان پێگەییشتن بەهۆی کڕیارەوە بەسەرەوە نەبێت.", "بەڵگەی کڕینی لەگەڵدا بێت، لەو شوێنانەی کە گونجاوە.", "داواکاری گەڕاندنەوەی لەو ماوەیەدا پێشکەش کرابێت کە \"گۆڵدن سیزەرز\" دیاری دەکات، وەک لە کاتی تەواوکردنی کڕین، لە پشتڕاستکردنەوەی داواکارییەکەدا، یان لەسەر ماڵپەڕەکە ڕوون کراوەتەوە."]}, {"heading": "٣.١ گۆڕانکاری لە ماوەی گەڕاندنەوەدا", "paragraphs": ["لەوانەیە \"گۆڵدن سیزەرز\" ماوەی گەڕاندنەوەی پەیوەندیدار لە کاتێکەوە بۆ کاتێکی تر نوێ بکاتەوە. ئەو ماوەیەی کە لە کاتی پێشکەشکردنی داواکارییەکەدا کارا بێت، پەیڕەو دەکرێت."]}, {"heading": "٤. ئەو بەرهەمانەی ناگەڕێنرێنەوە", "paragraphs": ["لەوانەیە هەندێک بەرهەم شایستەی گەڕاندنەوە نەبن، بۆ نموونە و نەک تەنها ئەمانە:", "بەرهەمە بەکارهاتووەکان.", "بەرهەمە دەستکارییکراوەکان یان تایبەتکراوەکان (مخصصة).", "ئەو بەرهەمانەی بەهۆی خراپ بەکارهێنانەوە زیانیان پێگەیشتووە.", "هەر پۆلێنێکی تری بەرهەم کە \"گۆڵدن سیزەرز\" دیاری دەکات\"."]}, {"heading": "٥ ڕێکارەکانی داواکاری گەڕاندنەوە", "paragraphs": ["ڕێکارە گشتییەکانی گەڕاندنەوە ئەم هەنگاوانەی خوارەوە لەخۆ دەگرن:", "پێشکەشکردنی داواکاری گەڕاندنەوە.", "پێداچوونەوەی \"گۆڵدن سیزەرز\" بە داواکارییەکەدا.", "پەسەندکردن یان ڕەتکردنەوەی داواکارییەکە.", "گەڕاندنەوەی بەرهەمەکە، لە حاڵەتی پەسەندکردندا.", "پشکنینی بەرهەمە گەڕاوەکە.", "بڕیاردانی کۆتایی سەبارەت بە گەڕاندنەوەکە."]}, {"heading": "٦. گۆڕینەوە (الاستبدال)", "paragraphs": ["لەو شوێنانەی کە گونجاو بێت، \"گۆڵدن سیزەرز\" دەکرێت پێشکەش بە گۆڕینەوەی بەرهەمەکە بکات لە جیاتی گەڕاندنەوەی پارەکەی. دیاریکردنی گونجاوی پێشکەشکردنی گۆڕینەوە و ئەو بەرهەمانەی بۆی بەردەستن، دەگەڕێتەوە بۆ دەسەڵاتی خەمڵاندنی \"گۆڵدن سیزەرز\" بە پێی ئەم سیاسەتە."]}, {"heading": "٧. قەرەبووکردنەوە و گەڕاندنەوەی پارە (الاسترداد)", "paragraphs": ["لەو شوێنانەی کە قەرەبووکردنەوە گونجاو بێت، بەم شێوازەی خوارەوە مامەڵەی لەگەڵ دەکرێت:", "قەرەبووکردنەوە دەکرێت لە حاڵەتی پەسەندکردنی داواکاری گەڕاندنەوە یان قەرەبووکردنەوە بە پێی ئەم سیاسەتە.", "بە شێوەیەکی گشتی پارە گەڕاندنەوەکە دەدرێتەوە بە هەمان شێوازی پێدانی سەرەتایی، یان لە ڕێگەی هەر شێوازێکی تری گونجاوەوە کە \"گۆڵدن سیزەرز\" دیاری دەکات\".", "لەوانەیە ئەو ماوەیەی کە بۆ پرۆسەی قەرەبووکردنەوە پێویستە جیاواز بێت لەسەر بنەمای دابینکەری خزمەتگوزاری پارەدان یان بانکی پەیوەندیدار."]}, {"heading": "٨. تێچووی گواستنەوەی پەیوەندیدار بە گەڕاندنەوە", "paragraphs": ["بەرپرسیارێتی بەرامبەر بە تێچووی گواستنەوەی گەڕاندنەوە - لەوانەش کرێی ڕەسەنی گەیاندن، تێچووی گەڕاندنەوەی بەرهەمەکە، و هەر رسوماتێکی تری پەیوەندیدار - لەوانەیە بە پێی هۆکاری گەڕاندنەوەکە جیاواز بێت، و کڕیار لەو بارەیەوە ئاگادار دەکرێتەوە وەک بەشێک لە ڕێکارەکانی گەڕاندنەوە."]}, {"heading": "٩. بەرهەمە تێکچووەکان یان هەڵەکان", "paragraphs": ["ئەم بڕگەیە لەم حاڵەتانەی خوارەوەدا جێبەجێ دەکرێت:", "گەیشتنی بەرهەمێکی تێکشکاو یان زیانپێگەیشتوو.", "وەرگرتنی بەرهەمێک کە لەگەڵ داواکارییەکەدا نەگونجێت (هەڵە بێت).", "بوونی هەڵەی دروستکردن (عیب تصنيع) لە بەرهەمەکەدا."]}, {"heading": "٩.١ چارەسەر", "paragraphs": ["لەم حاڵەتانەدا، \"گۆڵدن سیزەرز\" پێداچوونەوە بە بابەتیەکەدا دەکات و ڕێکاری گونجاو دەگرێتەبەر، کە ڕەنگە گۆڕینەوە، ئاڵوگۆڕ، یان قەرەبووکردنەوە لەخۆ بگرێت، بە پێی ئەم سیاسەتە."]}, {"heading": "١٠. داواکارییەکانی کۆ، دابەشکەران و بریکارەکان", "paragraphs": ["ئەو داواکارییانەی کە لەلایەن کڕیارانی کۆ، دابەشکەران و بریکارەکانەوە پێشکەش دەکرێن، لەوانەیە بکەونە ژێر مەرجەکانی گەڕاندنەوە، گۆڕینەوە و قەرەبووکردنەوەی جیاوازەوە بە پێی ئەو ڕێککەوتننامە یان گرێبەستانەی کە واژۆ کراون."]}, {"heading": "١١. مافەکانی \"گۆڵدن سیزەرز\"", "paragraphs": ["کۆمپانیای \"گۆڵدن سیزەرز\" مافی بۆ پارێزراوە لەم حاڵەتانەدا:", "رەتکردنەوەی هەر داواکارییەکی گەڕاندنەوە، گۆڕینەوە یان قەرەبووکردنەوە کە مەرجەکانی ئەم سیاسەتە نەبەستێتەوە.", "داواکردنی زانیاری یان وێنەی زیاتر بۆ هەڵسەنگاندنی داواکارییەکە.", "پشکنینی بەرهەمەکە پێش پەسەندکردنی گەڕاندنەوە، گۆڕینەوە یان قەرەبووکردنەوە."]}, {"heading": "١٢. سنووری بەرپرسیارێتی", "paragraphs": ["بەرپرسیارێتی \"گۆڵدن سیزەرز\" سەبارەت بە پرۆسەکانی گەڕاندنەوە، گۆڕینەوە و قەرەبووکردنەوە سنووردارە بەوەی کە ئەم سیاسەتە و هەر ڕێککەوتننامەیەکی کارا باسی دەکەن، لەو سنوورانەی کە یاسا ڕێگەی پێدەدات."]}, {"heading": "١٣. پەیوەندی لەگەڵ سیاسەتەکانی تردا", "paragraphs": ["پێویستە ئەم سیاسەتە لە تەنیشت مەرج و ڕێساکانی تری ئێمەوە بخوێنرێتەوە، وەک سیاسەتی پارەدان، سیاسەتی گەیاندن و ناردن، و سیاسەتی تایبەتمەندێتی. لەو شوێنانەی کە ئەو سیاسەتانە باس لە بابەتێکی دیاریکراو دەکەن بە وردی زیاتر، ئەوا ئەوان دەبنە سەرچاوەی سەرەکی بۆ ئەو بابەتە و ئەم سیاسەتە ناوەرۆکەکەی دووبارە ناکاتەوە."]}, {"heading": "١٤. نوێکردنەوەکانی سیاسەت", "paragraphs": ["لەوانەیە ئێمە ئەم سیاسەتەی گەڕاندنەوە و قەرەبووکردنەوەیە لە کاتێکەوە بۆ کاتێکی تر نوێ بکەینەوە بۆ ئەوەی گۆڕانکارییەکانی کارکردنمان، خزمەتگوزارییەکان یان یاسای کارا  gscissors.com website, including registration, account approval, and the general rights and obligations that apply to Wholesale Customers. It applies to Orders placed through the Website or through our Official Communication Channels (including, but not limited to, the Website, WhatsApp, Instagram, email, and any other official communication channels designated by Golden Scissors). By registering for or using a wholesale account, you agree to this Policy.", "introAr": "توضح سياسة البيع بالجملة هذه كيفية إدارة \"غولدن سيزرز\" لعمليات البيع بالجملة عبر موقع gscissors.com الإلكتروني، بما في ذلك التسجيل، واعتماد الحساب، والحقوق والالتزامات العامة التي تنطبق على عملاء الجملة. وتنطبق هذه السياسة على الطلبات المقدَّمة عبر الموقع الإلكتروني أو عبر قنوات التواصل الرسمية الخاصة بنا (بما في ذلك على سبيل المثال لا الحصر الموقع الإلكتروني، وواتساب، وإنستغرام، والبريد الإلكتروني، وأي قنوات تواصل رسمية أخرى تحددها \"غولدن سيزرز\"). إن تسجيلكم أو استخدامكم لحساب جملة يُعد موافقة منكم على هذه السياسة.", "introKuSor": "ئەم سیاسەتی فرۆشتنی بەکۆمەڵە ڕوون دەکاتەوە کە چۆن \"گۆڵدن سيزرز\" بەڕێوەبردنی پرۆسەکانی فرۆشتنی بەکۆمەڵ لە ڕێگەی ماڵپەڕی gscissors.com ئەنجام دەدات، لەوانەش تۆمارکردن، پەسەندکردنی هەژمار، ماف و پابەندبوونە گشتییەکانی کە بەسەر کڕیارانی بەکۆمەڵدا پەیڕەو دەبن. ئەم سیاسەتە بەسەر ئەو داواکارییانەدا جێبەجێ دەبێت کە لە ڕێگەی ماڵپەڕ یان کەناڵە فەرمییەکانی پەیوەندیکردنی ئێمەوە پێشکەش دەکرێن (لەوانەش بۆ نموونە نەک تەنها ماڵپەڕ، واتسئاپ، ئینستاگرام، ئیمەیڵ، و هەر کەناڵێکی تری فەرمی پەیوەندیکردن کە لەلایەن \"گۆڵدن سيزرز\"ەوە دیاری دەکرێت). تۆمارکردن یان بەکارهێنانی هەژماری بەکۆمەڵ لەلایەن ئێوەوە بە واتای ڕەزامەندی دەبێت لەسەر ئەم سیاسەتە.", "introKuBad": "ئەڤ سیاسەتا فرۆتنا ب کۆم دیار دکەت کا \"گۆڵدن سیزرز\" دێ چەوا سەرەدەریێ دگەل پرۆسەیێن فرۆتنا ب کۆم کەت ب رێیا مالپەرێ ئەلیکترۆنی gscissors.com، ژ وان ژی تۆمارکرن، پەسەندکرنا حیسابێ، و ماف و ئەرکێن گشتی یێن کو کڕیارێن ب کۆم ڤەدگریت. ئەڤ سیاسەتە ل سەر وان داخوازییان دهێتە جێبەجێکرن یێن کو ب رێیا مالپەرێ ئەلیکترۆنی یان کەنالێن مە یێن فەرمی یێن پەیوەندیێ دهێنە پێشکێشکرن (ژ وان ژی، بێی کو ب ڤان بتنێ بهێتە سنووردارکرن: مالپەرێ ئەلیکترۆنی، واتساپ، ئینستگرام، ئیمەیل، و هەر کەنالەکێ دی یێ فەرمی یێ کو \"گۆڵدن سیزرز\" دیار بکەت). تۆمارکرنا تە یان بکارئینانا حیسابا ب کۆم، وەک رازەمەندییا تە ل سەر ڤێ سیاسەتێ دهێتە دانان.", "sectionsEn": [{"heading": "1. Introduction and Purpose", "paragraphs": ["This Policy sets out clear rules for wholesale sales through Golden Scissors, including registration requirements, how wholesale accounts are approved, and the general rights and obligations of Golden Scissors and its Wholesale Customers. It is intended to remain workable as Golden Scissors' wholesale operations grow — including any future wholesale loyalty programs, customer tiers, volume discount structures, new sales regions, a dedicated B2B platform, or a wholesale mobile application, where applicable and subject to availability."]}, {"heading": "2. Scope of This Policy", "paragraphs": ["This Policy applies only to Wholesale Customers. It does not apply to Retail Customers, Distributors, or Agents, each of whom is governed by their own applicable policy or agreement."]}, {"heading": "3. Definition of a Wholesale Customer", "paragraphs": ["A Wholesale Customer is an individual or company that purchases products from Golden Scissors for the purpose of resale or use in a commercial activity, rather than for personal use."]}, {"heading": "4. Registration Eligibility", "paragraphs": ["Registering for a wholesale account does not guarantee automatic approval. Golden Scissors reserves the right to:", "Review any registration request.", "Request additional documents.", "Accept or reject the request, at its discretion."]}, {"heading": "5. Business Verification", "paragraphs": ["Where appropriate, Golden Scissors may request documents such as:", "A commercial registration.", "A business license.", "A tax card, where applicable.", "Any other documents evidencing commercial activity."]}, {"heading": "5.1 Additional Documentation", "paragraphs": ["Golden Scissors reserves the right to request any additional documents it considers necessary to verify a Wholesale Customer's business."]}, {"heading": "6. Account Approval", "paragraphs": ["Wholesale benefits are not activated until a wholesale account has been approved. Golden Scissors reserves the right to suspend or withdraw approval where a Wholesale Customer breaches this Policy or an applicable agreement."]}, {"heading": "7. Wholesale Pricing", "paragraphs": ["Wholesale pricing is not displayed publicly and is shown only to approved wholesale accounts. Wholesale prices may change in accordance with Golden Scissors' pricing policy; the price in effect at the time an Order is confirmed is the price that applies to that Order."]}, {"heading": "7.1 Confidentiality of Wholesale Pricing", "paragraphs": ["Wholesale prices and any other commercial terms extended to an approved wholesale account are considered confidential business information. They may not be shared, disclosed, or republished without Golden Scissors' prior approval."]}, {"heading": "8. Minimum Order Requirements", "paragraphs": ["Golden Scissors may apply a minimum order requirement to certain products or Orders. These requirements may vary depending on the product or market and will be communicated to the Wholesale Customer as applicable."]}, {"heading": "9. Orders", "paragraphs": ["Wholesale Orders generally involve the following steps:", "Submitting an Order.", "Review of the Order by Golden Scissors.", "Confirmation of the Order.", "Golden Scissors may modify or decline an Order where necessary."]}, {"heading": "10. Payment and Shipping", "paragraphs": ["Payment and shipping for wholesale Orders are governed by our Payment Policy and Shipping & Delivery Policy. Please refer to those policies for details; this Policy does not repeat their content."]}, {"heading": "11. Discounts and Offers", "paragraphs": ["Any discounts or special offers are subject to Golden Scissors' policies and may vary depending on order quantity, ongoing campaigns, or the terms of a specific agreement. A Wholesale Customer may not claim any discount that has not been announced or specifically agreed with Golden Scissors."]}, {"heading": "12. Resale", "paragraphs": ["Products purchased from Golden Scissors are intended for lawful and ethical resale. Wholesale Customers must not make misleading claims about Golden Scissors' products or brand."]}, {"heading": "13. Brand Usage", "paragraphs": ["Use of Golden Scissors' logo, product images, videos, or other marketing materials is subject to Golden Scissors' approval, or to applicable Brand Guidelines where such guidelines exist."]}, {"heading": "14. Account Misuse", "paragraphs": ["Golden Scissors reserves the right to suspend or cancel a wholesale account where it is used unlawfully or inappropriately, including but not limited to:", "Sharing login credentials with another party.", "Using the account on behalf of another party.", "Providing incorrect or misleading business information."]}, {"heading": "15. Account Suspension or Termination", "paragraphs": ["Golden Scissors reserves the right to suspend a wholesale account, withdraw its approval, or discontinue access to wholesale pricing where:", "Incorrect information has been provided.", "The account has been misused.", "This Policy or an applicable agreement has been breached.", "Any other legitimate reason exists to protect Golden Scissors' interests."]}, {"heading": "16. Relationship with Wholesale Supply Agreements", "paragraphs": ["Where Golden Scissors has entered into a separate Wholesale Supply Agreement or other written agreement with a Wholesale Customer, the terms of that agreement will be the primary reference in the event of any conflict with this Policy. This Policy continues to apply to any matter the agreement does not address, unless the agreement expressly provides otherwise."]}, {"heading": "17. Relationship to Other Policies", "paragraphs": ["This Policy should be read together with our Terms & Conditions, Privacy Policy, Payment Policy, Shipping & Delivery Policy, and Return & Refund Policy. Where those policies address a topic in more detail, they take precedence for that topic, and this Policy does not repeat their content."]}, {"heading": "18. Policy Updates", "paragraphs": ["We may update this Wholesale Policy from time to time to reflect changes in our practices, our services, or applicable law. Any update will be posted on the Website with a revised \"Last Updated\" date. Where a change is material, we will take reasonable steps to bring it to the attention of Wholesale Customers through our Official Communication Channels prior to, or at the time of, the change taking effect."]}, {"heading": "19. Contact Us", "paragraphs": ["For any questions or concerns regarding this Wholesale Policy or a wholesale account, please contact us through our Official Communication Channels (including, but not limited to, the Website, WhatsApp, Instagram, email, and any other official communication channels designated by Golden Scissors): WhatsApp +964 750 400 6200 (wa.me/9647504006200), Instagram @golden_scissors400, or email goldenscissors400@gmail.com. Full contact details are also set out in our Contact & Support Policy."]}], "sectionsAr": [{"heading": "١. المقدمة والغرض من السياسة", "paragraphs": ["توضح هذه السياسة قواعد واضحة لعمليات البيع بالجملة لدى \"غولدن سيزرز\"، بما في ذلك متطلبات التسجيل، وكيفية اعتماد حسابات الجملة، والحقوق والالتزامات العامة لكل من \"غولدن سيزرز\" وعملاء الجملة. وتهدف هذه السياسة إلى أن تبقى قابلة للتطبيق مع استمرار نمو عمليات البيع بالجملة لدى \"غولدن سيزرز\" - بما في ذلك أي برامج ولاء لعملاء الجملة، أو مستويات للعملاء، أو هياكل خصومات على الكميات، أو مناطق بيع جديدة، أو منصة B2B مستقلة، أو تطبيق خاص بالجملة، قد تُستحدث مستقبلاً، حيثما كان ذلك منطبقاً وبحسب التوفر."]}, {"heading": "٢. نطاق تطبيق هذه السياسة", "paragraphs": ["تنطبق هذه السياسة على عملاء الجملة فقط. ولا تنطبق على عملاء التجزئة، أو الموزّعين، أو الوكلاء، حيث يخضع كل منهم لسياسته أو اتفاقيته الخاصة المعمول بها."]}, {"heading": "٣. تعريف عميل الجملة", "paragraphs": ["عميل الجملة هو شخص أو شركة يشتري منتجات من \"غولدن سيزرز\" بغرض إعادة بيعها أو استخدامها في نشاط تجاري، وليس للاستخدام الشخصي."]}, {"heading": "٤. أهلية التسجيل", "paragraphs": ["لا يعني التسجيل للحصول على حساب جملة اعتماده تلقائياً. وتحتفظ \"غولدن سيزرز\" بالحق في:", "مراجعة أي طلب تسجيل.", "طلب مستندات إضافية.", "قبول الطلب أو رفضه، وفقاً لتقديرها."]}, {"heading": "٥. التحقق من النشاط التجاري", "paragraphs": ["قد تطلب \"غولدن سيزرز\"، عند الاقتضاء، مستندات مثل:", "السجل التجاري.", "رخصة النشاط.", "البطاقة الضريبية، حيثما كانت منطبقة.", "أي مستندات أخرى تثبت ممارسة النشاط التجاري."]}, {"heading": "٥.١ مستندات إضافية", "paragraphs": ["تحتفظ \"غولدن سيزرز\" بالحق في طلب أي مستندات إضافية تراها لازمة للتحقق من نشاط عميل الجملة التجاري."]}, {"heading": "٦. اعتماد الحساب", "paragraphs": ["لا يتم تفعيل مزايا الجملة إلا بعد اعتماد حساب الجملة. وتحتفظ \"غولدن سيزرز\" بالحق في تعليق الاعتماد أو سحبه في حال مخالفة عميل الجملة لهذه السياسة أو لأي اتفاقية معمول بها."]}, {"heading": "٧. أسعار الجملة", "paragraphs": ["لا تُعرض أسعار الجملة للعامة، وتُعرض فقط للحسابات المعتمدة. وقد تتغير أسعار الجملة وفقاً لسياسة التسعير الخاصة بـ \"غولدن سيزرز\"؛ ويكون السعر الساري وقت تأكيد الطلب هو السعر المطبَّق على ذلك الطلب."]}, {"heading": "٧.١ سرية أسعار الجملة", "paragraphs": ["تُعتبر أسعار الجملة وأي شروط تجارية أخرى تُمنح لحساب جملة معتمد معلومات تجارية سرية. ولا يجوز مشاركتها أو الإفصاح عنها أو إعادة نشرها دون موافقة \"غولدن سيزرز\" المسبقة."]}, {"heading": "٨. الحد الأدنى للطلبات", "paragraphs": ["قد تطبّق \"غولدن سيزرز\" حداً أدنى لبعض المنتجات أو الطلبات. وقد تختلف هذه المتطلبات بحسب المنتج أو السوق، وسيتم إبلاغ عميل الجملة بها بحسب الحالة."]}, {"heading": "٩. الطلبات", "paragraphs": ["تشمل طلبات الجملة عموماً الخطوات التالية:", "تقديم الطلب.", "مراجعة \"غولدن سيزرز\" للطلب.", "تأكيد الطلب.", "يجوز لـ \"غولدن سيزرز\" تعديل الطلب أو رفضه عند الحاجة."]}, {"heading": "١٠. الدفع والشحن", "paragraphs": ["تخضع عمليات الدفع والشحن الخاصة بطلبات الجملة لسياسة الدفع وسياسة الشحن والتوصيل الخاصتين بنا. يُرجى الرجوع إلى تلك السياستين للاطلاع على التفاصيل؛ ولا تكرر هذه السياسة محتواهما."]}, {"heading": "١١. الخصومات والعروض", "paragraphs": ["تخضع أي خصومات أو عروض خاصة لسياسات \"غولدن سيزرز\"، وقد تختلف بحسب كمية الطلب، أو الحملات الجارية، أو شروط اتفاقية محددة. ولا يحق لعميل الجملة المطالبة بأي خصم لم يُعلن عنه أو لم يُتفق عليه تحديداً مع \"غولدن سيزرز\"."]}, {"heading": "١٢. إعادة البيع", "paragraphs": ["منتجات \"غولدن سيزرز\" المشتراة مخصصة لإعادة البيع بطريقة قانونية وأخلاقية. ويجب على عملاء الجملة عدم تقديم أي ادعاءات مضللة بشأن منتجات \"غولدن سيزرز\" أو علامتها التجارية."]}, {"heading": "١٣. استخدام العلامة التجارية", "paragraphs": ["يخضع استخدام شعار \"غولدن سيزرز\"، أو صور المنتجات، أو مقاطع الفيديو، أو أي مواد تسويقية أخرى لموافقة \"غولدن سيزرز\"، أو لإرشادات العلامة التجارية (Brand Guidelines) المعمول بها حيثما وُجدت."]}, {"heading": "١٤. إساءة استخدام الحساب", "paragraphs": ["تحتفظ \"غولدن سيزرز\" بالحق في تعليق حساب الجملة أو إلغائه في حال استخدامه بشكل غير مشروع أو غير لائق، بما في ذلك على سبيل المثال لا الحصر:", "مشاركة بيانات الدخول مع طرف آخر.", "استخدام الحساب لصالح طرف آخر.", "تقديم معلومات تجارية غير صحيحة أو مضللة."]}, {"heading": "١٥. تعليق الحساب أو إنهاؤه", "paragraphs": ["تحتفظ \"غولدن سيزرز\" بالحق في تعليق حساب الجملة، أو سحب اعتماده، أو إيقاف الوصول إلى أسعار الجملة، في الحالات التالية:", "تقديم معلومات غير صحيحة.", "إساءة استخدام الحساب.", "مخالفة هذه السياسة أو أي اتفاقية معمول بها.", "وجود أي سبب مشروع آخر يستدعي حماية مصالح \"غولدن سيزرز\"."]}, {"heading": "١٦. العلاقة مع اتفاقيات توريد الجملة", "paragraphs": ["في حال وجود اتفاقية توريد جملة (Wholesale Supply Agreement) منفصلة أو أي اتفاقية خطية أخرى بين \"غولدن سيزرز\" وأحد عملاء الجملة، فإن أحكام تلك الاتفاقية تكون المرجع الأساسي عند وجود أي تعارض مع هذه السياسة. وتظل هذه السياسة سارية على أي أمر لا تتناوله تلك الاتفاقية، ما لم تنص الاتفاقية صراحةً على خلاف ذلك."]}, {"heading": "١٧. العلاقة مع السياسات الأخرى", "paragraphs": ["يجب قراءة هذه السياسة إلى جانب الشروط والأحكام الخاصة بنا، وسياسة الخصوصية، وسياسة الدفع، وسياسة الشحن والتوصيل، وسياسة الإرجاع والاسترداد. وحيثما تتناول تلك السياسات موضوعاً معيناً بتفصيل أكبر، فإنها تكون هي المرجع الأساسي بخصوص ذلك الموضوع، ولا تكرر هذه السياسة محتواها."]}, {"heading": "١٨. تحديثات السياسة", "paragraphs": ["قد نقوم بتحديث سياسة البيع بالجملة هذه من وقت لآخر لتعكس التغييرات في ممارساتنا أو خدماتنا أو القانون المعمول به. وسيتم نشر أي تحديث على الموقع الإلكتروني مع تاريخ \"آخر تحديث\" محدَّث. وفي حال كان التغيير جوهرياً، سنتخذ خطوات معقولة لإطلاع عملاء الجملة عليه عبر قنوات التواصل الرسمية الخاصة بنا قبل أو عند دخول التغيير حيز التنفيذ."]}, {"heading": "١٩. التواصل معنا", "paragraphs": ["لأي استفسارات أو مخاوف بخصوص سياسة البيع بالجملة هذه أو حساب الجملة الخاص بكم، يُرجى التواصل معنا عبر قنوات التواصل الرسمية الخاصة بنا (بما في ذلك على سبيل المثال لا الحصر الموقع الإلكتروني، وواتساب، وإنستغرام، والبريد الإلكتروني، وأي قنوات تواصل رسمية أخرى تحددها \"غولدن سيزرز\"): واتساب على الرقم 964 750 400 6200+ (wa.me/9647504006200)، أو عبر إنستغرام على الحساب golden_scissors400@، أو عبر البريد الإلكتروني goldenscissors400@gmail.com. كما ترد تفاصيل التواصل الكاملة في سياسة التواصل والدعم الخاصة بنا."]}], "sectionsKuSor": [{"heading": "١. پێشەکی و مەبەستی سیاسەت", "paragraphs": ["ئەم سیاسەتە ڕێسای ڕوون بۆ پرۆسەکانی فرۆشتنی بەکۆمەڵ لە \"گۆڵدن سيزرز\" دابین دەکات، لەوانەش مەرجەکانی تۆمارکردن، چۆنیەتی پەسەندکردنی هەژمارەکانی بەکۆمەڵ، و ماف و پابەندبوونە گشتییەکانی هەریەکە لە \"گۆڵدن سيزرز\" و کڕیارانی بەکۆمەڵ. ئامانجی ئەم سیاسەتە ئەوەیە کە بەردەوام بێت لە کارپێکردن لەگەڵ گەشەکردنی بەردوامی پرۆسەکانی فرۆشتنی بەکۆمەڵ لە \"گۆڵدن سيزرز\"دا – لەوانەش هەر بەرنامەیەکی پاشکۆیی بۆ کڕیارانی بەکۆمەڵ، ئاستەکانی کڕیاران، پێکهاتەکانی داشکاندن لەسەر بڕ، ناوچەی نوێی فرۆشتن، یان پلاتفۆرمێکی سەربەخۆی B2B، یان ئەپلیکیشنێکی تایبەت بە بەکۆمەڵ کە لە داهاتوودا دروست ببن، لەو شوێنەی گونجاو بێت و بە پێی بەردەستبوون."]}, {"heading": "٢. مەودای جێبەجێکردنی ئەم سیاسەتە", "paragraphs": ["ئەم سیاسەتە تەنها بۆ کڕیارانی بەکۆمەڵ جێبەجێ دەبێت. بەسەر کڕیارانی تاکفرۆش (تەجزئە)، دابەشکاران، یان بریکارەکاندا جێبەجێ نابێت، چونکە هەموو یەکێکیان لە ژێر کاریگەری سیاسەت یان ڕێککەوتنی تایبەتی خۆیاندا دەبن."]}, {"heading": "٣. پێناسەی کڕیاری بەکۆ", "paragraphs": ["کڕیاری بەکۆ ئەو کەس یان کۆمپانیایەیە کە بەرهەمەکان لە \"گۆڵدن سيزرز\" دەکڕێت بە مەبەستی فرۆشتنەوەیان یان بەکارهێنانیان لە چالاکییەکی بازرگانیدا، نەک بۆ بەکارهێنانی کەسی."]}, {"heading": "٤. شایستەیی تۆمارکردن", "paragraphs": ["تۆمارکردن بۆ بەدەستهێنانی هەژماری بەکۆمەڵ بە مانای پەسەندکردنی خۆکارانەی نییە. \"گۆڵدن سيزرز\" مافی ئەوەی بۆ پارێزراوە کە:", "پێداچوونەوە بە هەر داواکارییەکی تۆمارکردندا بکات.", "داوای بەڵگەنامەی زیاتر بکات.", "داواکارییەکە قبوڵ یان ڕەت بکاتەوە، بە پێی هەڵسەنگاندنی خۆی."]}, {"heading": "٥. پشکنینی چالاکیی بازرگانی", "paragraphs": ["لە کاتی پێویستدا، \"گۆڵدن سيزرز\" دەکرێت داوای بەڵگەنامەکان بکات وەک:", "تۆماری بازرگانی.", "مۆڵەتی چالاکی.", "کارتی باج، لەو شوێنەی گونجاو بێت.", "هەر بەڵگەنامەیەکی تر کە سەلمێنەری ئەنجامدانی چالاکیی بازرگانی بێت."]}, {"heading": "٥.١ بەڵگەنامەی زیاتر", "paragraphs": ["\"گۆڵدن سيزرز\" مافی ئەوەی بۆ پارێزراوە کە داوای هەر بەڵگەنامەیەکی تری زیاتر بکات کە بە پێویستی بزانێت بۆ پشکنینی چالاکیی بازرگانی کڕیاری بەکۆ."]}, {"heading": "٦. پەسەندکردنی هەژمار", "paragraphs": ["سوودەکانی فرۆشتنی بەکۆمەڵ تەنها دوای پەسەندکردنی هەژماری بەکۆمەڵ چالاک دەبن. \"گۆڵدن سيزرز\" مافی ئەوەی بۆ پارێزراوە کە پەسەندکردنەکە هەڵپەسێرێت یان بکێشێتەوە لە حاەتی سەرپێچیکردنی کڕیاری بەکۆمەڵ بۆ ئەم سیاسەتە یان بۆ هەر ڕێککەوتنێکی تری کارپێکراو."]}, {"heading": "٧. نرخەکانی بەکۆ", "paragraphs": ["نرخەکانی بەکۆمەڵ بۆ گشتییەکان نیشان نادرێن، و تەنها بۆ هەژمارە پەسەندکراوەکان دەردەکەون. نرخەکانی بەکۆمەڵ دەکرێت بەپێی سیاسەتی نرخدانانی \"گۆڵدن سيزرز\" گۆڕانکارییان بەسەردا بێت؛ ئەو نرخەی لە کاتی پشتڕاستکردنەوەی داواکارییەکەدا کارا بێت، بریتی دەبێت لەو نرخەی کە بەسەر ئەو داواکارییەدا جێبەجێ دەبێت طبقاً وبحسب التوفر.", "introKuSor": "ئەم سیاسەتی پەیوەندیکردن و پشتگیرییە ڕوون دەکاتەوە کە چۆن دەتوانرێت پەیوەندی بە \"جێناڵی زێڕین\" (Golden Scissors) کرێت، جۆرەکانی ئەو داواکارییانەی کە پێشوازییان لێ دەکەین، و ئەوەی کە دەکرێت لە پرۆسەی پشتگیرییەکەماندا چاوەڕوان بکرێت. ئەم سیاسەتە بەسەر پرسیارە گشتییەکان، داواکارییەکانی پشتگیری، و سکاڵاکانی پەیوەندیدار بە وێبگەی gscissors.com و خزمەتگوزارییەکان دا پەیڕەو دەبێت، و ئامانج لێی ئەوەیە کە لەگەڵ فراوانبوونی \"جێناڵی زێڕین\" لە کەناڵەکانی پشتگیری خۆیدا – لەوانە سەنگی پەیوەندی، سیستەمی تیکتی پشتگیری، گفتوگۆی ڕاستەوخۆ، ڕۆبۆتی گفتوگۆ کە بە ژیریی دەستکرد پاڵپشتی دەکرێت، ئەپی مۆبایل، یان لقی زیاتر – لە هەر شوێنێک کە گونجاو بێت و بەپێی بەردەستبوون، بەردەوام بەکاربێت.", "introKuBad": "ئەڤ سیاسەتا پەیوەندیکردن و پشتەڤانیێ دیار دکەت کا چەوا پەیوەندی ب \"گۆڵدن سیزەرز\" دهێتە کرن، و ئەو جورێن داخوازیان یێن ئەم وەردگرین، و چ تشت دهێتە چاڤەرێکرن ژ پرۆسەیا مە یا پشتەڤانیێ. ئەڤ سیاسەتە ل سەر پرسیارێن گشتی، و داخوازیێن پشتەڤانیێ، و گازندەیێن گرێدایی ب مالپەرێ gscissors.com یێ ئەلیکترۆنی و خزمەتگوزاریێن مە ڤە دهێتە جێبەجێکرن، و مەرەم ژێ ئەوە کو یا جهێ جێبەجێکرنێ بمینیت دگەل بەرفرەهبوونا \"گۆڵدن سیزەرز\" د کەنالێن خوە یێن پشتەڤانیێ دا — ژ وان ژی سەنتەرێ پەیوەندیان، یان سیستەمێ تیکێتێن پشتەڤانیێ، یان چاتێ راستەوخۆ، یان رۆبۆتێ دانوستاندنێ یێ پشت بەستۆ ب ژیرییا دەستکرد، یان ئەپلیکەیشنێ مۆبایلێ، یان چقێن زێدەتر — ل هەر جهەکێ بجهـ بهێت و ل دویڤ بەردەستبوونێ.", "sectionsEn": [{"heading": "1. Introduction and Purpose", "paragraphs": ["Golden Scissors wants it to be easy to reach us with a question, a request, or a concern. This Policy explains our official communication channels, the kinds of requests we handle, and what you can generally expect from our support process."]}, {"heading": "2. Scope of This Policy", "paragraphs": ["This Policy applies to all users of the Website, including:", "Retail Customers.", "Wholesale Customers.", "Distributors.", "Agents.", "Website Visitors."]}, {"heading": "3. Official Communication Channels", "paragraphs": ["All official communication with Golden Scissors takes place through the channels Golden Scissors designates, which may include:", "The Website contact form.", "Our official email.", "WhatsApp Business.", "Instagram.", "Phone call, where adopted.", "Live chat, if introduced in the future.", "Any other official channel Golden Scissors announces."]}, {"heading": "3.1 Unofficial Channels", "paragraphs": ["Communications sent through unofficial or unverified channels may not be recognized or acted upon."]}, {"heading": "4. Types of Requests", "paragraphs": ["These channels are intended to receive:", "General inquiries.", "Support requests.", "Complaints.", "Suggestions for improvement.", "Questions about a specific Order.", "Business collaboration inquiries.", "Wholesale inquiries.", "Distributor and Agent inquiries."]}, {"heading": "5. Response Times", "paragraphs": ["We aim to respond to messages within a reasonable time, during business hours, subject to operational workload. Response times may vary depending on the nature of the request."]}, {"heading": "6. Business Hours", "paragraphs": ["Support is generally provided during Golden Scissors' official business hours. Requests received outside business hours will be addressed as soon as reasonably possible during the next business day."]}, {"heading": "7. Information We May Request", "paragraphs": ["To help address your request, Golden Scissors may ask for information such as:", "Your name.", "Order number.", "Phone number.", "Email address.", "A description of the issue.", "Photos or documents, where needed."]}, {"heading": "8. Complaints", "paragraphs": ["Golden Scissors welcomes complaints and is committed to reviewing and addressing them fairly and professionally."]}, {"heading": "9. Acceptable Communication", "paragraphs": ["Golden Scissors expects everyone who contacts us to communicate respectfully. Abusive language, threats, or harassment directed at our staff will not be tolerated, and Golden Scissors reserves the right to end any communication it considers inappropriate."]}, {"heading": "10. Support Limitations", "paragraphs": ["Our support team assists with matters related to Golden Scissors' products and services. We are not obligated to provide advice or services outside the scope of Golden Scissors' business."]}, {"heading": "11. Privacy", "paragraphs": ["Any information you provide through our communication channels is handled in accordance with our Privacy Policy."]}, {"heading": "12. Exceptional Circumstances", "paragraphs": ["Response times may be delayed in exceptional circumstances, including but not limited to:", "Force majeure.", "Technical malfunctions.", "Interruptions to communication services.", "Security-related circumstances.", "Natural disasters."]}, {"heading": "13. Relationship to Other Policies", "paragraphs": ["Depending on the nature of your inquiry, this Policy should be read together with our Terms & Conditions, Privacy Policy, Shipping & Delivery Policy, and Return & Refund Policy. Where those policies address a topic in more detail, they take precedence for that topic, and this Policy does not repeat their content."]}, {"heading": "14. Policy Updates", "paragraphs": ["We may update this Contact & Support Policy from time to time to reflect changes in our practices, our support channels, or applicable law. Any update will be posted on the Website with a revised \"Last Updated\" date. Where a change is material, we will take reasonable steps to bring it to your attention through our Official Communication Channels prior to, or at the time of, the change taking effect."]}, {"heading": "15. Contact Us", "paragraphs": ["You can reach Golden Scissors through our Official Communication Channels (including, but not limited to, the Website, WhatsApp, Instagram, email, and any other official communication channels designated by Golden Scissors): WhatsApp +964 750 400 6200 (wa.me/9647504006200), Instagram @golden_scissors400, or email goldenscissors400@gmail.com."]}], "sectionsAr": [{"heading": "١. المقدمة والغرض من السياسة", "paragraphs": ["تحرص \"غولدن سيزرز\" على أن يكون التواصل معنا سهلاً لطرح أي سؤال، أو تقديم طلب، أو إثارة أي مخاوف. وتوضح هذه السياسة قنوات التواصل الرسمية الخاصة بنا، وأنواع الطلبات التي نستقبلها، وما يمكن توقعه بشكل عام من عملية الدعم لدينا."]}, {"heading": "٢. نطاق تطبيق هذه السياسة", "paragraphs": ["تنطبق هذه السياسة على جميع مستخدمي الموقع الإلكتروني، بما في ذلك:", "عملاء التجزئة.", "عملاء الجملة.", "الموزّعون.", "الوكلاء.", "زوّار الموقع الإلكتروني."]}, {"heading": "٣. قنوات التواصل الرسمية", "paragraphs": ["يتم كل تواصل رسمي مع \"غولدن سيزرز\" عبر القنوات التي تحددها \"غولدن سيزرز\"، والتي قد تشمل:", "نموذج التواصل على الموقع الإلكتروني.", "بريدنا الإلكتروني الرسمي.", "واتساب بزنس.", "إنستغرام.", "المكالمات الهاتفية، حيثما تم اعتمادها.", "الدردشة المباشرة، إذا تم إضافتها مستقبلاً.", "أي قناة رسمية أخرى تعلن عنها \"غولدن سيزرز\"."]}, {"heading": "٣.١ القنوات غير الرسمية", "paragraphs": ["قد لا يتم الاعتراف بالتواصل الذي يتم عبر قنوات غير رسمية أو غير موثقة، أو التعامل معه."]}, {"heading": "٤. أنواع الطلبات", "paragraphs": ["تُخصص هذه القنوات لاستقبال:", "الاستفسارات العامة.", "طلبات الدعم.", "الشكاوى.", "اقتراحات التحسين.", "الاستفسارات المتعلقة بطلب معين.", "استفسارات التعاون التجاري.", "استفسارات الجملة.", "استفسارات الموزّعين والوكلاء."]}, {"heading": "٥. أوقات الاستجابة", "paragraphs": ["نسعى إلى الرد على الرسائل خلال فترة زمنية معقولة، خلال ساعات العمل، وبحسب حجم العمل التشغيلي. وقد تختلف مدة الاستجابة بحسب طبيعة الطلب."]}, {"heading": "٦. أوقات العمل", "paragraphs": ["يُقدَّم الدعم بشكل عام خلال أوقات العمل الرسمية لدى \"غولدن سيزرز\". وستتم معالجة الطلبات الواردة خارج أوقات العمل في أقرب وقت ممكن خلال يوم العمل التالي."]}, {"heading": "٧. المعلومات التي قد نطلبها", "paragraphs": ["للمساعدة في معالجة طلبكم، قد تطلب \"غولدن سيزرز\" معلومات مثل:", "اسمكم.", "رقم الطلب.", "رقم الهاتف.", "البريد الإلكتروني.", "وصف المشكلة.", "صور أو مستندات، عند الحاجة."]}, {"heading": "٨. الشكاوى", "paragraphs": ["ترحب \"غولدن سيزرز\" بالشكاوى وتلتزم بمراجعتها ومعالجتها بطريقة عادلة ومهنية."]}, {"heading": "٩. السلوك المقبول في التواصل", "paragraphs": ["تتوقع \"غولدن سيزرز\" من كل من يتواصل معنا الالتزام بالاحترام. ولن يتم التسامح مع أي لغة مسيئة، أو تهديدات، أو مضايقات موجهة لموظفينا، وتحتفظ \"غولدن سيزرز\" بالحق في إنهاء أي تواصل تراه غير لائق."]}, {"heading": "١٠. حدود الدعم", "paragraphs": ["يقدم فريق الدعم لدينا المساعدة فيما يتعلق بمنتجات وخدمات \"غولدن سيزرز\". ولسنا ملزمين بتقديم استشارات أو خدمات خارج نطاق نشاط \"غولدن سيزرز\"."]}, {"heading": "١١. الخصوصية", "paragraphs": ["تتم معالجة أي معلومات تقدمونها عبر قنوات التواصل الخاصة بنا وفقاً لسياسة الخصوصية الخاصة بنا."]}, {"heading": "١٢. الحالات الاستثنائية", "paragraphs": ["قد تتأخر أوقات الاستجابة في حالات استثنائية، تشمل على سبيل المثال لا الحصر:", "القوة القاهرة.", "الأعطال الفنية.", "انقطاع خدمات الاتصالات.", "الظروف الأمنية.", "الكوارث الطبيعية."]}, {"heading": "١٣. العلاقة مع السياسات الأخرى", "paragraphs": ["بحسب طبيعة استفساركم، يجب قراءة هذه السياسة إلى جانب الشروط والأحكام الخاصة بنا، وسياسة الخصوصية، وسياسة الشحن والتوصيل، وسياسة الإرجاع والاسترداد. وحيثما تتناول تلك السياسات موضوعاً معيناً بتفصيل أكبر، فإنها تكون هي المرجع الأساسي بخصوص ذلك الموضوع، ولا تكرر هذه السياسة محتواها."]}, {"heading": "١٤. تحديثات السياسة", "paragraphs": ["قد نقوم بتحديث سياسة التواصل والدعم هذه من وقت لآخر لتعكس التغييرات في ممارساتنا أو قنوات الدعم لدينا أو القانون المعمول به. وسيتم نشر أي تحديث على الموقع الإلكتروني مع تاريخ \"آخر تحديث\" محدَّث. وفي حال كان التغيير جوهرياً، سنتخذ خطوات معقولة لإطلاعكم عليه عبر قنوات التواصل الرسمية الخاصة بنا قبل أو عند دخول التغيير حيز التنفيذ."]}, {"heading": "١٥. التواصل معنا", "paragraphs": ["يمكنكم التواصل مع \"غولدن سيزرز\" عبر قنوات التواصل الرسمية الخاصة بنا (بما في ذلك على سبيل المثال لا الحصر الموقع الإلكتروني، وواتساب، وإنستغرام، والبريد الإلكتروني، وأي قنوات تواصل رسمية أخرى تحددها \"غولدن سيزرز\"): واتساب على الرقم 964 750 400 6200+ (wa.me/9647504006200)، أو ع   if (cc === "IQ") {
    if (/duh[oa]k|dahuk/.test(hay)) return "ku";
    if (/erbil|arbil|h[eê]w[lê]r|hawler|sulaymaniyah|sulaimaniyah|slemani|silêmanî|kirkuk|karkuk|kerkuk|halabj|halabcha|soran|sorân|rania|ranya|koya|koysinjaq|shaqlawa|rawanduz|choman/.test(hay)) return "ckb";
    return "ar";
  }
  if (GS_ARAB_CC.has(cc)) return "ar";
  return "en";
}
function gsdeBrowserLang() {
  const c = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
  for (const raw of c) {
    const tg = (raw || "").toLowerCase();
    if (tg.startsWith("en")) return "en";
    if (tg.startsWith("ar")) return "ar";
    if (tg.startsWith("kmr")) return "ku";
    if (tg.startsWith("ckb") || tg.startsWith("ku")) return "ckb";
  }
  return null;
}
async function gsdeResolveStartLang() {
  try { const s = localStorage.getItem("gs_lang_pref"); if (s && ["en","ar","ckb","ku"].includes(s)) return s; } catch (e) {}
  try {
    const res = await Promise.race([fetch("https://ipwho.is/"), new Promise((_, rj) => setTimeout(() => rj(new Error("timeout")), 3000))]);
    const d = await res.json();
    if (d && d.success !== false && d.country_code) return gsdeLangFromGeo(d);
  } catch (e) {}
  return gsdeBrowserLang() || "en";
}
gsdeShowLoading();
Promise.all([gsdeLoadLiveCatalog(), gsdeResolveStartLang(), new Promise(r => setTimeout(r, 900))]).then(([result, startLang]) => {
  lang = startLang;
  if (result.websiteMode === "maintenance") { gsdeShowUnavailable(result.maintenance); return; }
  PRODUCTS = result.products;
  FAMILY_ICONS = result.familyIcons;
  FAMILY_SIZE_GUIDES = result.familySizeGuides;
  CATEGORY_ICONS = result.categoryIcons;
  DELIVERY_LOCATIONS_MOBILE = result.deliveryLocations;
  if (!DELIVERY_LOCATIONS_MOBILE.some(x => x.en === checkoutDeliveryState.location)) checkoutDeliveryState.location = DELIVERY_LOCATIONS_MOBILE[0].en;
  const ui = result.uiLocalizationByLanguage;
  if (ui) for (const l of ["en", "ar", "ku_bad", "ku_sor"]) { if (ui[l]) LIVE_HOME_MASTER_UI[l] = Object.assign(LIVE_HOME_MASTER_UI[l] || {}, ui[l]); }
  render(true);
  gsdeInitAccounts();
}).catch(err => { console.error("GSDE app: failed to load live catalog", err); gsdeShowUnavailable(); });


</script>
